622166.A.384"], "verification_steps": [4], "key": "original-03", "sort_date": "2020-11-17", "sort_order": 30, "paragraphs": ["11月17日晚上，robertshih先列第三季EPS1.7元、前三季累計2.27元，以及10月營收創當年新高；再把它們和持續上升的SCFI運價放在一起。他先找一個已公布、可作起點的獲利水準，再判斷下一季遇到的價格條件是否更有利。", "推論順序是：第三季在較早的運價環境下已賺1.7元；眼前運價繼續高於那個環境，10月營收也仍強。若貨量、成本與合約沒有出現足以抵銷漲價的變化，第四季就有機會至少維持第三季水準。這是他選擇用1.7元作下一季起估值的原因。", "他把前三季2.27元加上假設的第四季1.7元，得到3.97元，文中進一步判斷全年超過4元。這筆估計讓讀者能追到輸入：已公布部分是2.27，向前看的部分是第四季能否維持。之後新資料出來，應先改這個輸入，再改全年獲利。", "這個估計最先等到的是下一季營收和獲利。12月新運價再漲，他上修第四季；11月營收卻月減時，他又回頭問公司、查船期，檢查原先的獲利推論是否仍站得住腳。"], "calculations": [{"title": "從已公布獲利，估到全年", "formula": "前三季 2.27 ＋ 假設第四季 1.70 ＝ 全年 3.97 元（約4元）", "meaning": "作者先用第三季作下一季基準，再看高運價能否維持獲利。"}], "context_notes": [{"after_paragraph": 0, "title": "SCFI和公司營收，反映的時間不同", "text": "SCFI追蹤上海出口貨櫃的即期市場運價。長榮有不同航線與長約，新報價還要經過接單、航程和營收認列，才逐步進入財報。", "refs": ["https://en.sse.net.cn/indices/fqaen.jsp"]}], "calculation_labels": ["作者原估｜長榮2020全年"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [3]}]}, {"date_context": "2020年11月17日 同一篇文章", "heading": "作者為什麼選長榮：同族群比較後，找出便宜與賣壓的解釋", "text": "有了全年獲利估計，作者才和價格比較。他用長榮21元、全年EPS約4元、每股淨值16.68元，算出約5.2倍本益比（PE）、1.26倍股價淨值比（PB）；同文列陽明約7倍與1.69倍、萬海約12.5倍與2倍。各公司的全年獲利採作者當時預估。他先提出一個相對比較：三家都受惠運價上升，按他的獲利估計，長榮的價格倍數卻較低。若公司差異足以解釋折價，便宜可以持續；若其中一部分折價來自暫時性的賣單，等賣單消化後，價格就可能靠近同族群的評價。接下來需要找到造成價差的具體原因。作者列了股本較大與海外可轉換公司債（ECB）兩個解釋，並把重點放在近期增加的借券賣出餘額。他的完整投資主張因而有兩條線：運價與換約使獲利往上，交易性賣壓可能使當時價格暫時跟不上。下面分別追這批債券怎麼連到股票賣單，以及他如何估賣壓的數量和時間。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "verification_steps": [4], "key": "original-04", "sort_date": "2020-11-17", "sort_order": 40, "table": {"title": "作者當時用同業比較，找出價格差異", "columns": ["2020年11月17日作者列值", "長榮", "陽明", "萬海"], "rows": [["預估本益比", "約5.2倍", "約7倍", "約12.5倍"], ["股價淨值比", "約1.26倍", "約1.69倍", "約2倍"], ["這張表用來問什麼", "共同受惠時，為何長榮倍數較低？", "各家公司獲利採作者當時預估", "再查航線、合約、財務與賣壓差異"]]}, "paragraphs": ["有了全年獲利估計，作者才和價格比較。他用長榮21元、全年EPS約4元、每股淨值16.68元，算出約5.2倍本益比（PE）、1.26倍股價淨值比（PB）；同文列陽明約7倍與1.69倍、萬海約12.5倍與2倍。各公司的全年獲利採作者當時預估。", "他先提出一個相對比較：三家都受惠運價上升，按他的獲利估計，長榮的價格倍數卻較低。若公司差異足以解釋折價，便宜可以持續；若其中一部分折價來自暫時性的賣單，等賣單消化後，價格就可能靠近同族群的評價。接下來需要找到造成價差的具體原因。", "作者列了股本較大與海外可轉換公司債（ECB）兩個解釋，並把重點放在近期增加的借券賣出餘額。他的完整投資主張因而有兩條線：運價與換約使獲利往上，交易性賣壓可能使當時價格暫時跟不上。下面分別追這批債券怎麼連到股票賣單，以及他如何估賣壓的數量和時間。"], "calculations": [{"title": "同一個價格，放進兩種估值", "formula": "21 ÷ 預估EPS 4 ≈ 5.25 倍\n21 ÷ 每股淨值16.68 ≈ 1.26 倍", "meaning": "前者是預估本益比，後者是股價淨值比；EPS採作者當時情境。"}], "calculation_labels": ["依作者列值驗算｜長榮"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "table", "index": 0}]}, {"key": "ecb-pressure", "sort_date": "2020-11-17", "sort_order": 45, "date_context": "2020年11月17日：作者的ECB推論，連回9月發行條款", "heading": "作者為何判斷ECB賣壓壓住股價，又怎麼估消化時間？", "paragraphs": ["作者觀察長榮近兩個月借券賣出餘額增加，推測主要是持有ECB的外資做動態套利。他文中採21元股價，和18.2元轉換價相差2.8元，讓債券換股權與股票市價之間的關係值得研究；持有人可以一邊保留換股權，一邊在股票市場安排價差與避險部位。", "這批債券的條款在9月已公開。長榮發行3億美元海外可轉債；9月22日的發行文件列初始轉換價18.2元、固定換算匯率每美元28.9910元，9月29日發行交付，9月30日新加坡交易所頁面更新；條款寫明2020年12月29日起開始接受轉股。", "這些條款分別解決三個問題。3億美元給出整批潛在規模，固定匯率與轉換價用來算可取得的股數，12月29日則決定何時能申請換股。因此，11月看到的借券賣出，可以先於轉股交付發生；要檢查賣壓，應把賣股、申請轉股、交付和還券分別記日期。", "18.2元決定本金能換多少股。持債人的實際價差，還要把買債價格、股票賣價、匯率、借券費與資金成本一起算，才能判斷安排這筆交易是否划算。", "持債人可以先透過借券取得長榮股票，在市場賣出；12月29日起符合條款時，再申請把債券轉成股票，用取得的新股還券。先賣出的股票增加當時供給，所以公司接單和獲利改善時，股價仍可能遇到持續賣單。作者據此解釋長榮的獲利與估值暫時不同步。", "若股價上漲，借券賣出的股票部位，買回還券的成本會提高；同時，可轉債的換股價值也會上升。持有人可以調整債券和借券賣出數量，降低股價波動對整體部位的影響，並爭取兩邊的價差。這是作者所說動態套利的交易邏輯；實際收益仍要合併債券成交價、股票賣價、借券費和資金成本。", "這個機制還帶出一個重要查核點：日後若用轉股取得的股票還券，主要市場賣單已發生在前面；若到市場買股還券，當時則增加買單；若持債人轉股後才賣，賣單又落在後面。因此，轉換進度和市場賣壓的消化進度，需要沿不同紀錄一起追。", "作者把3億美元ECB換成40至50萬張潛在股票，再和長榮日均成交10至20萬張相比，估套利賣壓一至兩個月可以消化。他的投資理由是：公司獲利持續改善，眼前壓價的賣方若有有限的部位，賣完之後，長榮就有機會回到較接近同業的評價。", "先核40至50萬張從哪裡來。官方條款採每美元28.9910元固定換算，3億美元等於新台幣86.973億元；每股18.2元，除下去約4.779億股，再以1,000股一張換算，得到477,874張，約47.8萬張。這是整批債券按初始條款全數轉換的名目規模。", "接著算消化時間。47.8萬張除以全市場日成交10至20萬張，只有約2.4至4.8個日成交量。要推到一至兩個月，分母還要縮成「這批賣方每天賣多少」，因為市場其他投資人也在買賣，這批套利交易者只占當天成交的一部分。", "原文列了總規模、日均量和時間結論，沒有另列每日賣出占比。這裡由編者把條件補算出來：若整批47.8萬張仍待賣出，每月先用20個交易日換算，一個月須每天賣約2.39萬張；兩個月則約1.19萬張。放進日成交15萬張的情境，約占每天成交16%或8%。一至兩個月的判斷，因而相當於相信買盤能持續承接這個速度的供給。", "再看不同速度會差多少。編者同用日成交15萬張，特定賣方每天占20%、10%、5%，整批約需16、32、64個交易日。下表把乘除寫開；占比是為了呈現時間判斷需要的條件，作者留下的是經驗時間估計。", "剩餘量也會改變等待時間。用一個補算情境來看：若47.8萬張已有20萬張先賣出，剩約27.8萬張；之後每天賣1.5萬張，約19個交易日。持有人先前已賣多少、後面每天賣多快，會直接改變原先一至兩個月的估計。", "檢查這個判斷，要依序看借券賣出的速度、尚待賣出的數量，以及長榮相對同業的折價如何變。7月1日公司公告這批ECB已全數轉換，讓最終轉換狀態有了答案；作者原估的一至兩個月，則接著對照2020年11月至2021年1月的逐日交易紀錄。下面把已核對的結果和接下來要補的資料列在一起。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384", "https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546", "https://wwwc.twse.com.tw/zh/products/sbl/download/edu-info16.pdf"], "verification_steps": [25, 26, 27], "lane": "判斷", "calculations": [{"title": "第一步：美元本金 → 台幣本金 → 股數 → 張數", "formula": "300,000,000美元 × 固定匯率28.9910\n＝ 8,697,300,000元\n8,697,300,000 ÷ 轉換價18.2\n≈ 477,873,626股 ÷ 1,000\n≈ 477,874張（約47.8萬張）", "meaning": "本金、固定匯率及初始轉換價核自官方U70。作者原文估40至50萬張，量級相符。"}, {"title": "第二步：把一至兩個月反推成每天要賣多少", "formula": "編者換算：每月20個交易日，整批尚待賣出\n1個月：477,874 ÷ 20 ≈ 每天23,894張\n2個月：477,874 ÷ 40 ≈ 每天11,947張\n若日成交150,000張：\n23,894 ÷ 150,000 ≈ 15.9%\n11,947 ÷ 150,000 ≈ 8.0%", "meaning": "這是把作者時間判斷需要的交易速度攤開；實際每日占比及已賣數量，原文未列。"}, {"title": "第三步：新資料出來，改剩餘量與每日速度", "formula": "消化交易日 ＝ 尚待賣出張數 ÷ 每日這批賣方賣出張數\n編者示例：已先賣20萬張，之後每天賣1.5萬張\n（477,874 − 200,000）÷ 15,000 ≈ 18.5\n約19個交易日", "meaning": "已先賣20萬張為示例假設；實作查證時以可辨認的交易流量替換。"}], "text": "作者觀察長榮近兩個月借券賣出餘額增加，推測主要是持有ECB的外資做動態套利。他文中採21元股價，和18.2元轉換價相差2.8元，讓債券換股權與股票市價之間的關係值得研究；持有人可以一邊保留換股權，一邊在股票市場安排價差與避險部位。這批債券的條款在9月已公開。長榮發行3億美元海外可轉債；9月22日的發行文件列初始轉換價18.2元、固定換算匯率每美元28.9910元，9月29日發行交付，9月30日新加坡交易所頁面更新；條款寫明2020年12月29日起開始接受轉股。這些條款分別解決三個問題。3億美元給出整批潛在規模，固定匯率與轉換價用來算可取得的股數，12月29日則決定何時能申請換股。因此，11月看到的借券賣出，可以先於轉股交付發生；要檢查賣壓，應把賣股、申請轉股、交付和還券分別記日期。18.2元決定本金能換多少股。持債人的實際價差，還要把買債價格、股票賣價、匯率、借券費與資金成本一起算，才能判斷安排這筆交易是否划算。持債人可以先透過借券取得長榮股票，在市場賣出；12月29日起符合條款時，再申請把債券轉成股票，用取得的新股還券。先賣出的股票增加當時供給，所以公司接單和獲利改善時，股價仍可能遇到持續賣單。作者據此解釋長榮的獲利與估值暫時不同步。若股價上漲，借券賣出的股票部位，買回還券的成本會提高；同時，可轉債的換股價值也會上升。持有人可以調整債券和借券賣出數量，降低股價波動對整體部位的影響，並爭取兩邊的價差。這是作者所說動態套利的交易邏輯；實際收益仍要合併債券成交價、股票賣價、借券費和資金成本。這個機制還帶出一個重要查核點：日後若用轉股取得的股票還券，主要市場賣單已發生在前面；若到市場買股還券，當時則增加買單；若持債人轉股後才賣，賣單又落在後面。因此，轉換進度和市場賣壓的消化進度，需要沿不同紀錄一起追。作者把3億美元ECB換成40至50萬張潛在股票，再和長榮日均成交10至20萬張相比，估套利賣壓一至兩個月可以消化。他的投資理由是：公司獲利持續改善，眼前壓價的賣方若有有限的部位，賣完之後，長榮就有機會回到較接近同業的評價。先核40至50萬張從哪裡來。官方條款採每美元28.9910元固定換算，3億美元等於新台幣86.973億元；每股18.2元，除下去約4.779億股，再以1,000股一張換算，得到477,874張，約47.8萬張。這是整批債券按初始條款全數轉換的名目規模。接著算消化時間。47.8萬張除以全市場日成交10至20萬張，只有約2.4至4.8個日成交量。要推到一至兩個月，分母還要縮成「這批賣方每天賣多少」，因為市場其他投資人也在買賣，這批套利交易者只占當天成交的一部分。原文列了總規模、日均量和時間結論，沒有另列每日賣出占比。這裡由編者把條件補算出來：若整批47.8萬張仍待賣出，每月先用20個交易日換算，一個月須每天賣約2.39萬張；兩個月則約1.19萬張。放進日成交15萬張的情境，約占每天成交16%或8%。一至兩個月的判斷，因而相當於相信買盤能持續承接這個速度的供給。再看不同速度會差多少。編者同用日成交15萬張，特定賣方每天占20%、10%、5%，整批約需16、32、64個交易日。下表把乘除寫開；占比是為了呈現時間判斷需要的條件，作者留下的是經驗時間估計。剩餘量也會改變等待時間。用一個補算情境來看：若47.8萬張已有20萬張先賣出，剩約27.8萬張；之後每天賣1.5萬張，約19個交易日。持有人先前已賣多少、後面每天賣多快，會直接改變原先一至兩個月的估計。檢查這個判斷，要依序看借券賣出的速度、尚待賣出的數量，以及長榮相對同業的折價如何變。7月1日公司公告這批ECB已全數轉換，讓最終轉換狀態有了答案；作者原估的一至兩個月，則接著對照2020年11月至2021年1月的逐日交易紀錄。下面把已核對的結果和接下來要補的資料列在一起。", "aliases": ["ecb-terms", "ecb-transaction"], "tables": [{"title": "同一筆安排，分清市場賣單發生在哪一天", "columns": ["順序", "交易安排", "對市場的作用"], "rows": [["先持債、借券賣出", "保留換股權，同時先賣借來的股票", "賣出當時增加股票供給"], ["之後轉股、拿新股還券", "以債權換股，交回出借人", "完成先前還券義務"], ["另一條路：市場買回還券", "用買到的股票歸還，債券另行處理", "買回當時增加股票需求"], ["另一位持有人：轉股後才賣", "原先沒有先賣部位，取得新股後出售", "賣單落在轉股後"]]}, {"title": "編者重建消化速度：日成交15萬張，整批47.8萬張尚待賣出", "columns": ["這批賣方占日成交", "每日賣出怎麼算", "整批消化怎麼算", "約需交易日"], "rows": [["20%", "150,000 × 20%＝30,000張", "477,874 ÷ 30,000＝15.93", "16日"], ["10%", "150,000 × 10%＝15,000張", "477,874 ÷ 15,000＝31.86", "32日"], ["5%", "150,000 × 5%＝7,500張", "477,874 ÷ 7,500＝63.72", "64日"]]}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "heading", "text": "先回頭看9月條款：這批債券能換多少股票、何時能換？"}, {"type": "paragraphs", "indices": [1, 2, 3]}, {"type": "heading", "text": "有了換股權，持債人就可以先借券賣出"}, {"type": "paragraphs", "indices": [4, 5, 6]}, {"type": "table", "index": 0}, {"type": "heading", "text": "接著算規模：3億美元，為什麼約等於47.8萬張？"}, {"type": "paragraphs", "indices": [7, 8]}, {"type": "calculations", "indices": [0]}, {"type": "heading", "text": "再算時間：一至兩個月，需要每天承接多少賣單？"}, {"type": "paragraphs", "indices": [9, 10]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [11]}, {"type": "table", "index": 1}, {"type": "paragraphs", "indices": [12]}, {"type": "calculations", "indices": [2]}, {"type": "heading", "text": "最後追蹤：賣單減少後，長榮的折價有沒有縮小？"}, {"type": "paragraphs", "indices": [13]}], "context_notes": [{"after_paragraph": 0, "title": "這裡追的是「借券賣出餘額」", "text": "借券是借入股票；借券賣出則多了在市場出售這一步。作者觀察已借入並賣出、尚未回補了結的數量，用來推想賣方部位與後續供給。", "refs": ["https://www.twse.com.tw/zh/products/sbl/disclosures/info.html"]}], "outcome": {"title": "把當時的判斷，接到後來的結果", "columns": ["當時判斷", "後來查到的資料", "如何更新判斷"], "rows": [["3億美元可換40至50萬張", "官方條款換算約47.8萬張。", "規模與作者估計相符。"], ["套利賣壓約一至兩個月消化", "目前收錄了作者估計與轉換條款；2021年7月1日公司公告已全轉。", "一至兩個月的實際賣出速度，待補2020年11月至2021年1月的逐日借券賣出、還券與餘額。"], ["賣單減輕後，相對折價有機會縮小", "本案已保存長榮、大盤與同業的同期價格。", "再把相對估值和交易流量接在同一期間，檢查折價縮小發生在何時。"]], "refs": ["https://links.sgx.com/1.0.0/corporate-announcements/90JS5329MGPV2XYG/93849ad870c9107c36d456f7fa8eb8420bdb2d84d6f30d0a2da96da7cdda47a6"]}, "calculation_labels": ["官方條款＋編者換算｜整批轉換規模", "編者補算｜20至40個交易日情境", "編者示例｜剩餘賣出量"]}, {"date_context": "2020年11月17日 同一篇文章", "heading": "他把持有理由寫成條件：舊長約重簽，並追蹤運價是否反轉", "text": "作者接著往2021年推：既然眼前運價已高，為什麼收入還沒完全跟上？他認為一部分客戶仍使用較早簽下的低價長約，所以目前獲利還受舊價限制。等舊約到期、按較高運價重簽，同一批合約貨量便可能增加收入，形成第二段獲利改善。這個推論需要兩組資料一起成立：現貨高價能維持到換約時，且新約價差乘上適用貨量後，仍足以超過新增成本。他因此把券商次年EPS5至6元的預估接進來。後續應追換約價格、適用箱量、生效月份與成本，才能檢查改善究竟有多大。價格方面，他以全年EPS4元、假設配息六成得到2.4元，再用10%、8%、6%的殖利率情境倒算24、30、40元。這是把「公司可能賺到」接到「投資人願意付多少」，配息與市場要求的報酬各有一項假設。他也翻過去二十年長榮獲利較好的年份，比較EPS與年內股價高點，認為本次約4元的獲利可支持三字頭價格。這是另一條歷史估值參照；那些年份的成本、配息與資金環境，還要和眼前條件一起比。把他的歷史比較再算開，今年若賺4元，股價30元相當於7.5倍PE；他列出的2004、2005、2007等獲利好年份，高價約對應7至10倍。作者因此認為三字頭有歷史參照，又把當時資金寬鬆放進價格空間的判斷。下表保留他原文數字，倍數按同一列驗算。文章最後將持有條件接回運價：高檔持續，就追實收與獲利能否兌現；若運價大跌且走成趨勢，則重新判斷。這讓研究從一次目標價，變成可隨新資料更新的持有理由：換約提高獲利、交易賣壓可能減輕、當時價格仍留有空間。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "verification_steps": [4], "key": "original-05", "sort_date": "2020-11-17", "sort_order": 50, "paragraphs": ["作者接著往2021年推：既然眼前運價已高，為什麼收入還沒完全跟上？他認為一部分客戶仍使用較早簽下的低價長約，所以目前獲利還受舊價限制。等舊約到期、按較高運價重簽，同一批合約貨量便可能增加收入，形成第二段獲利改善。", "這個推論需要兩組資料一起成立：現貨高價能維持到換約時，且新約價差乘上適用貨量後，仍足以超過新增成本。他因此把券商次年EPS5至6元的預估接進來。後續應追換約價格、適用箱量、生效月份與成本，才能檢查改善究竟有多大。", "價格方面，他以全年EPS4元、假設配息六成得到2.4元，再用10%、8%、6%的殖利率情境倒算24、30、40元。這是把「公司可能賺到」接到「投資人願意付多少」，配息與市場要求的報酬各有一項假設。", "他也翻過去二十年長榮獲利較好的年份，比較EPS與年內股價高點，認為本次約4元的獲利可支持三字頭價格。這是另一條歷史估值參照；那些年份的成本、配息與資金環境，還要和眼前條件一起比。", "把他的歷史比較再算開，今年若賺4元，股價30元相當於7.5倍PE；他列出的2004、2005、2007等獲利好年份，高價約對應7至10倍。作者因此認為三字頭有歷史參照，又把當時資金寬鬆放進價格空間的判斷。下表保留他原文數字，倍數按同一列驗算。", "文章最後將持有條件接回運價：高檔持續，就追實收與獲利能否兌現；若運價大跌且走成趨勢，則重新判斷。這讓研究從一次目標價，變成可隨新資料更新的持有理由：換約提高獲利、交易賣壓可能減輕、當時價格仍留有空間。"], "calculations": [{"title": "把假設配息，換成價格情境", "formula": "EPS 4 × 假設配息率60% ＝ 每股股利2.4元\n2.4 ÷ 10% ＝ 24元；2.4 ÷ 8% ＝ 30元；2.4 ÷ 6% ＝ 40元", "meaning": "配息率決定能領多少；市場要求的殖利率決定願意付多少。兩項都會改變估值。"}, {"title": "作者認為三字頭有空間，對應什麼估值", "formula": "30元 ÷ 預估EPS4元＝7.5倍PE\n再和原文列出的歷史獲利年高價倍數比較", "meaning": "30元與EPS4來自作者當時想法；倍數是把原文價格與獲利相除的驗算。"}], "table": {"title": "作者11月17日翻出的六個獲利年：原文列值與倍數驗算", "columns": ["獲利年度", "原文EPS", "原文所列股價高點", "高價÷EPS"], "rows": [["2017", "1.97", "23.35", "約11.85倍"], ["2010", "4.94", "31.80", "約6.44倍"], ["2007", "3.53", "34.80", "約9.86倍"], ["2005", "4.53", "33.90", "約7.48倍"], ["2004", "5.29", "40.70", "約7.69倍"], ["2003", "1.68", "32.50", "約19.35倍"]]}, "context_notes": [{"after_paragraph": 0, "title": "現貨先漲，長約為何稍後才受惠？", "text": "現貨報價較快隨當下供需調整；長約則按約定期間與價格承運。舊約到期後，實際談成較高的新約價，才會提高這批貨的收入。", "refs": []}]}, {"date_context": "2020年12月7日 21:45:38", "heading": "先上修第四季，再算2020年底淨值", "text": "12月7日，作者先更新自己的核心輸入。他把第二季SCFI平均895、EPS0.66，與第三季1182、EPS1.7並排；眼前指數已到2129，他估第四季均值至少1700。原先只按第三季1.7元估第四季，現在遇到更高的報價，獲利假設就需要上修。他用已公布季度作比較：SCFI從895到1182，約漲32%；EPS從0.66到1.70，多了1.04元。船公司的部分成本在短期內較固定，漲價多收的錢可以使利潤增加得更快；實際幅度還受貨量、航線、合約及燃油影響。這個比較讓他相信獲利有上修空間。他因此把第四季EPS抓2.5至3元，前三季2.27元加上去，全年變成4.77至5.27元。這個2.5至3元是作者參考運價、已公布獲利及宏遠研究給的估計區間；原文沒有列逐航線箱量、費用和稅率的完整季度試算。可直接驗算的，是全年加總，以及他比前文1.7元提高了多少。他又把航線分開看：先前東南亞強勢，萬海也有表現；當時東南亞漲勢休息，但長榮主要經營的美國與歐洲線仍強。這讓他判斷要追的是長榮自己的航線報價，族群總指數之外，營收結構同樣重要。新的獲利估計接著影響年底淨值：第三季每股淨值16.68元，加假設第四季賺2.5至3元，得到19.18至19.68元。這一步把當季獲利留在公司、其他權益變化先維持原狀，接著才往下一年的長約和估值推。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"], "verification_steps": [5], "table": {"title": "把兩次估算放在一起，就看得到他改了什麼", "columns": ["時間", "新數字如何改變獲利估計", "估值與行動"], "rows": [["2020-11-17", "前三季EPS2.27元，假設Q4約1.7元，全年抓約4元；預期次年換約後更好。", "以21元看，作者列本益比約5.2倍、淨值比1.26倍，認為同族群中較便宜。"], ["2020-12-07", "SCFI升至2129；Q4 EPS改估2.5–3元，全年4.77–5.27元；2021年估6元以上。", "2021年底淨值估25–26元，乘1.5倍＝37.5–39元；作者自述持續加碼。"]]}, "key": "original-06", "sort_date": "2020-12-07", "sort_order": 60, "paragraphs": ["12月7日，作者先更新自己的核心輸入。他把第二季SCFI平均895、EPS0.66，與第三季1182、EPS1.7並排；眼前指數已到2129，他估第四季均值至少1700。原先只按第三季1.7元估第四季，現在遇到更高的報價，獲利假設就需要上修。", "他用已公布季度作比較：SCFI從895到1182，約漲32%；EPS從0.66到1.70，多了1.04元。船公司的部分成本在短期內較固定，漲價多收的錢可以使利潤增加得更快；實際幅度還受貨量、航線、合約及燃油影響。這個比較讓他相信獲利有上修空間。", "他因此把第四季EPS抓2.5至3元，前三季2.27元加上去，全年變成4.77至5.27元。這個2.5至3元是作者參考運價、已公布獲利及宏遠研究給的估計區間；原文沒有列逐航線箱量、費用和稅率的完整季度試算。可直接驗算的，是全年加總，以及他比前文1.7元提高了多少。", "他又把航線分開看：先前東南亞強勢，萬海也有表現；當時東南亞漲勢休息，但長榮主要經營的美國與歐洲線仍強。這讓他判斷要追的是長榮自己的航線報價，族群總指數之外，營收結構同樣重要。", "新的獲利估計接著影響年底淨值：第三季每股淨值16.68元，加假設第四季賺2.5至3元，得到19.18至19.68元。這一步把當季獲利留在公司、其他權益變化先維持原狀，接著才往下一年的長約和估值推。"], "calculations": [{"title": "第四季估計，如何接到全年與年底淨值", "formula": "前三季EPS2.27 ＋ Q4估計2.5～3\n＝ 2020全年EPS4.77～5.27元\n第三季每股淨值16.68 ＋ Q4估計2.5～3\n＝ 2020年底估計淨值19.18～19.68元", "meaning": "作者12月7日列值；淨值的簡化接法，先沿用原股數並保留該季獲利。股利、增減資與其他權益變動出現後再更新。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [0]}, {"type": "table", "index": 0}]}, {"key": "contract-dec07", "sort_date": "2020-12-07", "sort_order": 61, "date_context": "2020年12月7日：同一篇文章的推論接續", "heading": "換約多逾2元EPS，原文究竟給了哪些計算依據", "paragraphs": ["作者下一步盯住美國線舊長約。舊約每大箱一千多美元，當時現貨美東4,700、美西3,947美元；他的想法是，同一批原先按低價承運的貨，等到重簽後提高單價，可以在原有運輸量上增加收入。若增加的成本較小，這段價差就有機會留下成利潤。", "要從每箱價差走到每股多賺多少，中間先算適用新價的大箱數，乘實際換約漲幅與匯率；扣掉新增燃油、租船、塞港等費用，再處理稅和股東可分得的利潤，最後除以相同期間的股數。若原始箱量用TEU記，先除以2換成大箱FEU；現貨報價在這裡提供議價空間的參照，估算營收時，要用實際談成的新長約價格。", "他12月7日引用的宏遠52頁研究，確實在第45、46頁做了換約試算。第45頁假設長約約四成，5月1日換約、考慮航程後6月見到效益，完整年度落在2021年6月至2022年5月。", "對照第9頁美線櫃量示意，去程長約25除以去程合計38加25，約39.7%，可用來理解去程長約約四成的分母。", "第46頁則以一間未具名航商列價差表：每大箱多100美元，稅前利益增加12.12億元；扣20%後剩9.696億元，對應稀釋EPS約0.29元。", "把這張表繼續算，價差700美元對應稅後67.872億元、EPS約2.04元；價差1,000美元對應稅後96.96億元、EPS約2.91元。所以「價差擴大，換約能帶來數元EPS」有明確的數字示範。表中沒有另列採用的箱量與匯率，增加稅前利益的那一步仍藏在模型輸入裡。", "第46頁的股數也要一起看。9.696億元除以同份研究第50頁陽明的稀釋股數33.321億股，約0.291元；長榮第49頁則採52.992億股。未具名示例的數字與陽明股數相符。用於長榮時，模型應放入長榮自己的長約貨櫃量和股數，再用長榮自己的股數計算EPS。", "作者12月7日自己提出長榮換約多逾2元、全年6元以上，但文章沒有另列長榮的箱量、換約價、成本及稅的工作表。能核對到的是：他看見舊約與現貨大幅價差，讀了附有敏感度表的研究，據此判斷次年還有一段獲利增量。12月11日宏遠後續報告才明確給出長榮每漲100美元增加0.33元的敏感度；下面依12月14日公開引用的時間，把能算到2元的條件接續展開。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [31], "lane": "判斷", "calculations": [{"title": "把換約收入，一路接到增量EPS", "formula": "增量運費收入\n＝ 本期適用新約FEU數 × 每FEU新舊價差（美元）× 匯率\n增量歸屬母公司稅後利益\n＝ 扣新增成本費用後的利益，處理稅及股東歸屬\n增量EPS\n＝ 增量歸屬母公司稅後利益 ÷ 同期間股數", "meaning": "這是編者攤開的計算鏈。箱量、價差、成本、稅與股數各有自己的輸入，換約期間也要一致。"}, {"title": "宏遠第46頁未具名示例：能驗算到哪裡", "formula": "每FEU漲100美元：\n稅前12.12億元 ×（1 − 20%）＝ 稅後9.696億元\n9.696億元 ÷ 33.321億股 ≈ 0.291元\n每FEU漲700美元：0.291 × 7 ≈ 2.04元\n每FEU漲1,000美元：0.291 × 10 ≈ 2.91元", "meaning": "稅前利益與稅後利益採U48第46頁；33.321億股由第50頁陽明稀釋股本反算，為編者核對。第46頁公司未具名，這組數字用來還原示例模型。"}], "table": {"title": "第46頁示例的中間步驟與這次查到的程度", "columns": ["輸入或步驟", "原資料給什麼", "這次怎麼核"], "rows": [["換約適用期間", "5月1日換約，6月起反映；效益跨12個月", "U48第45頁：2021/06至2022/05"], ["價差100美元→稅前利益", "增加12.12億元", "原表有結果；箱量、匯率與成本細項未另列"], ["稅前→稅後", "12.12億→9.696億", "9.696 ÷ 12.12＝80%，對應20%扣減"], ["稅後→稀釋EPS", "9.696億→約0.29元", "以陽明33.321億股可驗算；第46頁仍未具名"], ["長榮逾2元結論", "robertshih在12/7文章提出", "長榮個別工作表未列；後續0.33敏感度按12/11日期接上"]]}, "text": "作者下一步盯住美國線舊長約。舊約每大箱一千多美元，當時現貨美東4,700、美西3,947美元；他的想法是，同一批原先按低價承運的貨，等到重簽後提高單價，可以在原有運輸量上增加收入。若增加的成本較小，這段價差就有機會留下成利潤。要從每箱價差走到每股多賺多少，中間先算適用新價的大箱數，乘實際換約漲幅與匯率；扣掉新增燃油、租船、塞港等費用，再處理稅和股東可分得的利潤，最後除以相同期間的股數。若原始箱量用TEU記，先除以2換成大箱FEU；現貨報價在這裡提供議價空間的參照，估算營收時，要用實際談成的新長約價格。他12月7日引用的宏遠52頁研究，確實在第45、46頁做了換約試算。第45頁假設長約約四成，5月1日換約、考慮航程後6月見到效益，完整年度落在2021年6月至2022年5月。對照第9頁美線櫃量示意，去程長約25除以去程合計38加25，約39.7%，可用來理解去程長約約四成的分母。第46頁則以一間未具名航商列價差表：每大箱多100美元，稅前利益增加12.12億元；扣20%後剩9.696億元，對應稀釋EPS約0.29元。把這張表繼續算，價差700美元對應稅後67.872億元、EPS約2.04元；價差1,000美元對應稅後96.96億元、EPS約2.91元。所以「價差擴大，換約能帶來數元EPS」有明確的數字示範。表中沒有另列採用的箱量與匯率，增加稅前利益的那一步仍藏在模型輸入裡。第46頁的股數也要一起看。9.696億元除以同份研究第50頁陽明的稀釋股數33.321億股，約0.291元；長榮第49頁則採52.992億股。未具名示例的數字與陽明股數相符。用於長榮時，模型應放入長榮自己的長約貨櫃量和股數，再用長榮自己的股數計算EPS。作者12月7日自己提出長榮換約多逾2元、全年6元以上，但文章沒有另列長榮的箱量、換約價、成本及稅的工作表。能核對到的是：他看見舊約與現貨大幅價差，讀了附有敏感度表的研究，據此判斷次年還有一段獲利增量。12月11日宏遠後續報告才明確給出長榮每漲100美元增加0.33元的敏感度；下面依12月14日公開引用的時間，把能算到2元的條件接續展開。", "context_notes": [{"after_paragraph": 0, "title": "先把貨櫃單位統一", "text": "TEU以20呎貨櫃為一單位，FEU以40呎貨櫃為一單位；一個FEU等於兩個TEU。本文的「每大箱」指每個40呎貨櫃，算運費收入前先統一單位。", "refs": ["https://en.sse.net.cn/indices/fqaen.jsp", "https://www.cna.com.tw/news/afe/202010260132.aspx"]}], "outcome": {"title": "把當時的判斷，接到後來的結果", "columns": ["當時判斷", "後來查到的資料", "如何更新判斷"], "rows": [["換約使長榮次年增加逾2元EPS", "12月11日研究進一步列長榮每漲100美元、完整12個月增加0.33元。", "依這組模型，2021年反映7個月且各月貨量相同時，約需每大箱多1,039美元。"], ["高運價與換約支持次年獲利", "公司後來列2021年實際EPS45.57元。", "全年利潤方向有實績可對照；換約本身貢獻多少，待補新約實收、適用箱量和成本。"]], "refs": ["https://speakerdeck.com/robertshih/14", "https://csr.evergreen-marine.com/pdf/csr-policy-report/Evergreen_CSR_2021.pdf"]}, "calculation_labels": ["編者展開計算鏈｜各公司分別代入", "宏遠示例＋編者驗算｜原頁未具名，數字對應陽明股數"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "paragraphs", "indices": [5]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [6]}, {"type": "paragraphs", "indices": [7]}, {"type": "table", "index": 0}]}, {"key": "valuation-dec07", "sort_date": "2020-12-07", "sort_order": 62, "date_context": "2020年12月7日：同一篇文章的推論接續", "heading": "從全年6元，怎麼走到淨值25至26、目標37.5至39元", "paragraphs": ["作者把2021全年獲利抓6元以上，理由是現有運價先支撐獲利，長約重簽再提供增量。他給的是全年預估下限，接著把這筆未來獲利放進淨值，推算股價可能還有多少空間。", "前面估2020年底淨值19.18至19.68元，若2021每股再賺6元並先全數保留，年底就約25.18至25.68元，與文中25至26元的整數區間相近。若其間發放股利，淨值應扣掉每股股利；若有轉股、增資或匯兌等權益變化，則重新用股東權益和股數計算。作者這次使用的是先保留獲利的簡化估算。", "有了25至26元，再問市場願付幾倍。他參照長榮2004、2005、2007、2010等獲利好年份，認為至少1.5倍PB有歷史參照；也質疑宏遠只給長榮1.3倍、同業卻給1.5至2倍。這是他選1.5倍的理由，倍數仍是對市場評價的判斷。", "最後25乘1.5得到37.5元，26乘1.5得到39元。整條推論因而是：運價提高先上修當季獲利，換約再延伸到明年；留存獲利推高淨值，最後以歷史與同業選倍數。後續資料可以分別改EPS、股利、股數或倍數，目標價也就跟著重算。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [32], "lane": "判斷", "calculations": [{"title": "先驗算淨值，再驗算目標價", "formula": "編者依作者列值接算，先假設獲利保留：\n2020年底19.18～19.68 ＋ 2021 EPS6\n≈ 2021年底25.18～25.68元\n作者採整數淨值區間25～26元\n25 × 1.5＝37.5元；26 × 1.5＝39元", "meaning": "19.18–19.68、6元以上、25–26及1.5倍均見作者原文；中間保留獲利的接法由編者重建。"}], "text": "作者把2021全年獲利抓6元以上，理由是現有運價先支撐獲利，長約重簽再提供增量。他給的是全年預估下限，接著把這筆未來獲利放進淨值，推算股價可能還有多少空間。前面估2020年底淨值19.18至19.68元，若2021每股再賺6元並先全數保留，年底就約25.18至25.68元，與文中25至26元的整數區間相近。若其間發放股利，淨值應扣掉每股股利；若有轉股、增資或匯兌等權益變化，則重新用股東權益和股數計算。作者這次使用的是先保留獲利的簡化估算。有了25至26元，再問市場願付幾倍。他參照長榮2004、2005、2007、2010等獲利好年份，認為至少1.5倍PB有歷史參照；也質疑宏遠只給長榮1.3倍、同業卻給1.5至2倍。這是他選1.5倍的理由，倍數仍是對市場評價的判斷。最後25乘1.5得到37.5元，26乘1.5得到39元。整條推論因而是：運價提高先上修當季獲利，換約再延伸到明年；留存獲利推高淨值，最後以歷史與同業選倍數。後續資料可以分別改EPS、股利、股數或倍數，目標價也就跟著重算。", "calculation_labels": ["作者列值＋編者銜接｜長榮2021年底"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [0]}]}, {"key": "decision-dec07", "sort_date": "2020-12-07", "sort_order": 63, "date_context": "2020年12月7日：同一篇文章的推論接續", "heading": "獲利與估值上修後，他為何繼續加碼", "paragraphs": ["ECB假說也有後續：他再引借券相關截圖，文中稱借券費率達10%，仍把股價受到壓抑連到持債機構的避險賣單。這記錄了他持續檢查同一解釋；費率與餘額提供交易活動線索，交易者身分則另由部位資料核。", "這讓他同時保留兩條理由：營運面的運價和換約有望把獲利往上推，交易面的ECB套利賣單則可能暫時壓低價格。前一條靠後續實收與利潤驗證；後一條靠賣出流量、剩餘部位與相對評價驗證。新增資料要各自回到對應的假設。", "最後他自述持有現股9,000張、股期1,332口並繼續加碼。這次行動的順序是新報價推高獲利估計、換約保留下一年的增量、價格仍低於他的估值，因此擴大部位。後續每一筆新營收與獲利，都應拿來檢查這些上修是否成立。", "他列現股9,000張與股期1,332口，按每口約當2張，合計11,664張。這個換算呈現曝險規模；實際投入資金與盈虧還要按現股買價、期貨成交價及保證金逐筆核。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"], "verification_steps": [5], "lane": "判斷", "calculations": [{"title": "把作者兩種持有工具加在同一單位", "formula": "現股9,000張 ＋ 股期1,332口 × 每口2張\n＝ 約當11,664張", "meaning": "股期換算與部位數量依作者12月7日自述。"}], "text": "ECB假說也有後續：他再引借券相關截圖，文中稱借券費率達10%，仍把股價受到壓抑連到持債機構的避險賣單。這記錄了他持續檢查同一解釋；費率與餘額提供交易活動線索，交易者身分則另由部位資料核。這讓他同時保留兩條理由：營運面的運價和換約有望把獲利往上推，交易面的ECB套利賣單則可能暫時壓低價格。前一條靠後續實收與利潤驗證；後一條靠賣出流量、剩餘部位與相對評價驗證。新增資料要各自回到對應的假設。最後他自述持有現股9,000張、股期1,332口並繼續加碼。這次行動的順序是新報價推高獲利估計、換約保留下一年的增量、價格仍低於他的估值，因此擴大部位。後續每一筆新營收與獲利，都應拿來檢查這些上修是否成立。他列現股9,000張與股期1,332口，按每口約當2張，合計11,664張。這個換算呈現曝險規模；實際投入資金與盈虧還要按現股買價、期貨成交價及保證金逐筆核。", "context_notes": [{"after_paragraph": 2, "title": "股期就是股票期貨", "text": "作者把部分部位放在股票期貨。本案依他披露的契約，以每口約當2張股票換算，先讓現股和期貨的持有規模能放在同一單位比較。", "refs": ["https://www.taifex.com.tw/cht/2/sTF", "https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"]}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [0]}]}, {"key": "macro-first", "sort_date": "2020-12-07", "sort_order": 70, "date_context": "2020年11月23日資料截點／12月7日公開上傳與引用", "heading": "宏遠林奕頎怎麼拆：同樣運價上漲，先看公司跑哪條線", "text": "作者12月7日引用宏遠研究員林奕頎的報告，提供較細的公司拆解。研究先對照第二季SCFI895、EPS0.66與第三季1182、EPS1.70；截至11月23日，第四季指數均值已到1568、當日1938，於是上修下一季的獲利情境。研究員再看成本的反向證據：第三季燃油均價較第二季高約22%，EPS仍增加。他據此繼續研究漲價收益是否足以蓋過成本增加。這比只看油價上升就下修，或只看運價上升就等比例放大EPS，多接了一層已發生的結果。他再看眼前成本：報告列截至11月20日第四季海運燃油均價346美元，第三季367美元，約低6%。因此，這一季的方向是運價提高、油價均值反而降低，兩邊一起支持獲利上修；實際公司費用還要看用油量、燃料種類和其他營運支出。接著拆營收來源：長榮2019年美國線約四成、歐洲三成、亞洲三成。報告另用美線櫃量示意，分回程37%、去程現貨38%、去程長約25%。前一組按公司收入算，後一組按美線貨櫃量TEU算；推模型時各用自己的基準。各航線開始漲價的時間也不同。報告列美國線5月底起漲、歐洲線8月底起漲並在11月加速，亞洲線10月下旬轉強；第四季受惠範圍因此比第三季更廣。歐洲以現貨為主、亞洲多採現貨循環航線，新價格進入營收的節奏，也會和仍有舊長約的美國線不同。這種拆法回答「誰先受惠、誰還沒受惠」。現貨可以較快反映新價，舊長約則等生效；不同航線漲幅又不同，所以要先把報價接到適用合約，再按各部分實際貨量加總。總指數與公司的收入之間，就是透過這些項目相連。研究還把損益表接到每股數字。第49頁估2021稅後純益303.73億元，採股數48.13億股，算EPS6.31元；把分母改成稀釋股數52.992億股，算5.73元。同一筆估計利潤，攤在更多股數上，每股數字就降低。年底淨值也有接法：表內2020年底18.70元，加2021預估EPS6.31元，正好是25.01元，顯示這一段採保留獲利的簡化銜接；最後25.01乘1.3倍，得到約32.5元。作者自己採1.5倍，兩人的分歧因此可以分成獲利輸入、留存條件和倍數。研究也追海外同業的市場反應，列馬士基3月19日至11月20日漲135%、中遠海控5月22日至11月20日漲224%。研究員把這些當成全球航運景氣已被市場重估的參照，再回到長榮自己的EPS與價格，判斷還有多少差距。宏遠使用截至11月23日的資料，12月7日由作者分享。除了獲利表，研究員還追需求、供給、空櫃與船員周轉，以及2010年的景氣經驗，判斷這波改善能延續多久。", "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [12], "lane": "資訊", "table": {"title": "先分清楚比例在量什麼，再推價格何時進帳", "columns": ["林奕頎報告拆分", "比例採什麼基準", "對推論的幫助"], "rows": [["長榮美國線約40%、歐洲約30%、亞洲約30%", "各航線占公司營收", "決定公司對哪些航線報價較敏感"], ["美線回程37%、去程現貨38%、去程長約25%", "美國線貨櫃量TEU", "現貨與舊長約反映新運價的時間不同"], ["歐洲以現貨為主；亞洲多為現貨", "合約性質", "先追現貨報價如何傳入營收，再等長約重簽"]]}, "paragraphs": ["作者12月7日引用宏遠研究員林奕頎的報告，提供較細的公司拆解。研究先對照第二季SCFI895、EPS0.66與第三季1182、EPS1.70；截至11月23日，第四季指數均值已到1568、當日1938，於是上修下一季的獲利情境。", "研究員再看成本的反向證據：第三季燃油均價較第二季高約22%，EPS仍增加。他據此繼續研究漲價收益是否足以蓋過成本增加。這比只看油價上升就下修，或只看運價上升就等比例放大EPS，多接了一層已發生的結果。", "他再看眼前成本：報告列截至11月20日第四季海運燃油均價346美元，第三季367美元，約低6%。因此，這一季的方向是運價提高、油價均值反而降低，兩邊一起支持獲利上修；實際公司費用還要看用油量、燃料種類和其他營運支出。", "接著拆營收來源：長榮2019年美國線約四成、歐洲三成、亞洲三成。報告另用美線櫃量示意，分回程37%、去程現貨38%、去程長約25%。前一組按公司收入算，後一組按美線貨櫃量TEU算；推模型時各用自己的基準。", "各航線開始漲價的時間也不同。報告列美國線5月底起漲、歐洲線8月底起漲並在11月加速，亞洲線10月下旬轉強；第四季受惠範圍因此比第三季更廣。歐洲以現貨為主、亞洲多採現貨循環航線，新價格進入營收的節奏，也會和仍有舊長約的美國線不同。", "這種拆法回答「誰先受惠、誰還沒受惠」。現貨可以較快反映新價，舊長約則等生效；不同航線漲幅又不同，所以要先把報價接到適用合約，再按各部分實際貨量加總。總指數與公司的收入之間，就是透過這些項目相連。", "研究還把損益表接到每股數字。第49頁估2021稅後純益303.73億元，採股數48.13億股，算EPS6.31元；把分母改成稀釋股數52.992億股，算5.73元。同一筆估計利潤，攤在更多股數上，每股數字就降低。", "年底淨值也有接法：表內2020年底18.70元，加2021預估EPS6.31元，正好是25.01元，顯示這一段採保留獲利的簡化銜接；最後25.01乘1.3倍，得到約32.5元。作者自己採1.5倍，兩人的分歧因此可以分成獲利輸入、留存條件和倍數。", "研究也追海外同業的市場反應，列馬士基3月19日至11月20日漲135%、中遠海控5月22日至11月20日漲224%。研究員把這些當成全球航運景氣已被市場重估的參照，再回到長榮自己的EPS與價格，判斷還有多少差距。", "宏遠使用截至11月23日的資料，12月7日由作者分享。除了獲利表，研究員還追需求、供給、空櫃與船員周轉，以及2010年的景氣經驗，判斷這波改善能延續多久。"], "calculations": [{"title": "宏遠第49頁：利潤 → EPS → 淨值 → 目標價", "formula": "2021預估稅後純益303.73億元\n÷ 48.13億股 ≈ EPS6.31元\n÷ 稀釋股數52.992億股 ≈ 稀釋EPS5.73元\n2020年底淨值18.70 ＋ EPS6.31＝25.01元\n25.01 × 1.3倍PB ≈ 32.5元", "meaning": "均為當時研究預估。股數由報告股本除以每股面額10元換算；淨值接法採表內值核算。"}], "context_notes": [{"after_paragraph": 6, "title": "稀釋EPS在處理什麼？", "text": "可轉債換成股票後，同一筆公司獲利要分給更多股份。研究同時列一般股數與假設轉股後的股數，讓讀者比較每股獲利會差多少。", "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}], "calculation_labels": ["宏遠當時預估｜長榮2021年"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "paragraphs", "indices": [5]}, {"type": "paragraphs", "indices": [6]}, {"type": "paragraphs", "indices": [7]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [8]}, {"type": "paragraphs", "indices": [9]}, {"type": "table", "index": 0}]}, {"key": "macro-demand-dec07", "sort_date": "2020-12-07", "sort_order": 71, "date_context": "2020年12月7日分享：宏遠第16–23頁，資料截至11月23日", "heading": "為何相信需求還在：看出口、庫存與商品消費是否一起改善", "paragraphs": ["林奕頎先用需求資料驗證漲價。他看到美國製造業指數6月、歐元區7月回到50以上，製造活動由收縮轉向擴張；再列亞洲9月輸美貨櫃量年增14.5%、中國輸美年增19.6%。產業調查與實際出貨量同方向，讓運價上漲有了貨物流動的支持。", "下一個問題是：貨已經運這麼多，為何還可能繼續？他查美國零售商庫存與銷售的比率，6月1.22、7月和8月1.23，仍處低檔。若商品持續賣出、庫存還沒補足，零售商便需要繼續向上游下單，接著產生運輸需求。", "庫存銷售比低，可能是商品賣得快，也可能是庫存太少。研究員因此同時看出口貨櫃量和終端銷售：報告列iRobot季度營收增43%、Winnebago約增40%，以及玩具和清潔用品需求。他把這些放在一起，判斷實體商品消費是需求來源之一。", "他的解釋是，疫情限制旅行與部分服務消費，支出轉向居家、娛樂和日常商品，這些商品仍需要跨國運輸。若零售銷售維持、庫存又持續偏低，就支持後續補貨；若庫存回升而銷售轉弱，原先的持續補貨假設便需要調整。", "他還把疫苗與解封放進需求判斷。報告引用旅客調查，認為旅行消費短期可能難回原狀；另彙整國際機構對2021經濟復甦的預估。商品消費若維持，製造和補庫存又恢復，便有機會讓運輸需求延續。這部分是對未來消費行為與復甦速度的預測，後續觀察重點是實際零售、庫存與出貨量。"], "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [33], "lane": "判斷", "text": "林奕頎先用需求資料驗證漲價。他看到美國製造業指數6月、歐元區7月回到50以上，製造活動由收縮轉向擴張；再列亞洲9月輸美貨櫃量年增14.5%、中國輸美年增19.6%。產業調查與實際出貨量同方向，讓運價上漲有了貨物流動的支持。下一個問題是：貨已經運這麼多，為何還可能繼續？他查美國零售商庫存與銷售的比率，6月1.22、7月和8月1.23，仍處低檔。若商品持續賣出、庫存還沒補足，零售商便需要繼續向上游下單，接著產生運輸需求。庫存銷售比低，可能是商品賣得快，也可能是庫存太少。研究員因此同時看出口貨櫃量和終端銷售：報告列iRobot季度營收增43%、Winnebago約增40%，以及玩具和清潔用品需求。他把這些放在一起，判斷實體商品消費是需求來源之一。他的解釋是，疫情限制旅行與部分服務消費，支出轉向居家、娛樂和日常商品，這些商品仍需要跨國運輸。若零售銷售維持、庫存又持續偏低，就支持後續補貨；若庫存回升而銷售轉弱，原先的持續補貨假設便需要調整。他還把疫苗與解封放進需求判斷。報告引用旅客調查，認為旅行消費短期可能難回原狀；另彙整國際機構對2021經濟復甦的預估。商品消費若維持，製造和補庫存又恢復，便有機會讓運輸需求延續。這部分是對未來消費行為與復甦速度的預測，後續觀察重點是實際零售、庫存與出貨量。"}, {"key": "macro-supply-dec07", "sort_date": "2020-12-07", "sort_order": 72, "date_context": "2020年12月7日分享：宏遠第24–32頁", "heading": "為何供給跟不上：新船要等，長榮卻已有船排在交付名單", "paragraphs": ["運價提高會吸引更多供給，研究員於是接著查新船。他列2020年7月全球待交船約221萬TEU，占現有運力9.4%；10月約降到8%。這批待交船還要分好幾年交付，能立刻增加的運力有限。", "他再查新增訂單，2020年前三季約17.74萬TEU，同期交付新船約65.86萬TEU。舊訂單持續交船，補進去的新訂單卻少，待交訂單便逐步消耗。研究員因此認為，當期景氣轉好之後，船隊擴張仍有一段時間差。", "造船慢還有資本與決策因素。過去景氣不佳，航商財務和銀行放款意願較弱；新船又要決定船型、燃料、引擎和融資。報告舉中遠2020年10月下訂大型船，預計2023至2024年才陸續交付，說明新增訂單無法立即解除當時的缺船。", "放回長榮，研究員看到另一種差異：截至11月18日，長榮已排定待交約49.26萬TEU，相當於當時船隊39.1%，預計2020至2022年投入。若高運價持續到交船，長榮除了每櫃多收運費，還可能用新增運力多接貨。這就是他認為長榮有額外成長空間的原因。", "39.1%是待交船相對現有船隊的規模，真正多出多少營業能力，還要扣舊船退租、處分和周轉變慢的影響。宏遠當時先假設新船搭配部分舊船退出，只估2021營收年增17%；若交船後舊船仍留下來，便可能再上修。"], "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [34], "lane": "判斷", "calculations": [{"title": "先分清待交船與實際增加的運力", "formula": "淨增可營運運力\n＝ 本期交付的新船運力 − 退租及處分的舊船運力\n全球同期交船 ÷ 新增訂單\n＝ 658,627 ÷ 177,434 ≈ 3.71倍", "meaning": "交船和新增訂單為報告所列2020年前三季數字。待交船逐步消耗，影響之後可增加多少運力。"}], "text": "運價提高會吸引更多供給，研究員於是接著查新船。他列2020年7月全球待交船約221萬TEU，占現有運力9.4%；10月約降到8%。這批待交船還要分好幾年交付，能立刻增加的運力有限。他再查新增訂單，2020年前三季約17.74萬TEU，同期交付新船約65.86萬TEU。舊訂單持續交船，補進去的新訂單卻少，待交訂單便逐步消耗。研究員因此認為，當期景氣轉好之後，船隊擴張仍有一段時間差。造船慢還有資本與決策因素。過去景氣不佳，航商財務和銀行放款意願較弱；新船又要決定船型、燃料、引擎和融資。報告舉中遠2020年10月下訂大型船，預計2023至2024年才陸續交付，說明新增訂單無法立即解除當時的缺船。放回長榮，研究員看到另一種差異：截至11月18日，長榮已排定待交約49.26萬TEU，相當於當時船隊39.1%，預計2020至2022年投入。若高運價持續到交船，長榮除了每櫃多收運費，還可能用新增運力多接貨。這就是他認為長榮有額外成長空間的原因。39.1%是待交船相對現有船隊的規模，真正多出多少營業能力，還要扣舊船退租、處分和周轉變慢的影響。宏遠當時先假設新船搭配部分舊船退出，只估2021營收年增17%；若交船後舊船仍留下來，便可能再上修。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [0]}]}, {"key": "macro-turnover-dec07", "sort_date": "2020-12-07", "sort_order": 73, "date_context": "2020年12月7日分享：宏遠第33–38頁", "heading": "缺的是周轉能力：為何加快空櫃回亞洲，可能比收回程運費划算", "paragraphs": ["研究員把缺櫃拆成生產和使用兩端。新櫃製造受先前產能縮減與防疫限制影響；使用中的貨櫃又卡在港口、卡車和倉庫。貨櫃沒有回到亞洲裝貨，即使公司帳上仍有這個櫃，也暫時接不了下一趟出口。", "他因此追貨櫃租賃商和製造商的訂單：報告轉述Triton、Textainer的需求能見度已到2021年2月附近，中國新櫃訂單也排到下一年。這些交期提供了瓶頸短期難補上的線索。", "報告再舉長榮加快調回空櫃的做法。回程每大櫃約500美元、載貨率約五至六成，平均每個可用回程艙位的運費約250至300美元；當時去程美西、美東現貨報價約3,913和4,682美元。若等待回程貨源會拖慢空櫃回亞洲，航商就要在較少的回程收入和下一趟較高的去程收入之間取捨。", "船員換班也影響同一件事。限制上岸、隔離或染疫停航，會延長一艘船完成航程的時間。同樣數量的船與櫃，一年能完成的航次減少，可用供給便下降。", "這同時增加成本和議價能力。研究員的看多條件，是新增運費收入足以超過塞港、租船與人員等增加費用。後續應一起追實收運費、載貨率、完成航次和費用，才知道周轉受阻最後留下多少利潤。"], "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [35], "lane": "判斷", "calculations": [{"title": "回程收入與周轉能力的兩個比較", "formula": "回程每可用大櫃艙位平均運費\n≈ 500美元 × 50%～60%載貨率\n＝ 250～300美元\n固定期間可完成運量\n≈ 可用船櫃數量 × 每次載量 × 可完成周轉次數", "meaning": "回程價格與載貨率採報告示例。更快調回空櫃，價值來自後續可承接的去程貨物。"}], "text": "研究員把缺櫃拆成生產和使用兩端。新櫃製造受先前產能縮減與防疫限制影響；使用中的貨櫃又卡在港口、卡車和倉庫。貨櫃沒有回到亞洲裝貨，即使公司帳上仍有這個櫃，也暫時接不了下一趟出口。他因此追貨櫃租賃商和製造商的訂單：報告轉述Triton、Textainer的需求能見度已到2021年2月附近，中國新櫃訂單也排到下一年。這些交期提供了瓶頸短期難補上的線索。報告再舉長榮加快調回空櫃的做法。回程每大櫃約500美元、載貨率約五至六成，平均每個可用回程艙位的運費約250至300美元；當時去程美西、美東現貨報價約3,913和4,682美元。若等待回程貨源會拖慢空櫃回亞洲，航商就要在較少的回程收入和下一趟較高的去程收入之間取捨。船員換班也影響同一件事。限制上岸、隔離或染疫停航，會延長一艘船完成航程的時間。同樣數量的船與櫃，一年能完成的航次減少，可用供給便下降。這同時增加成本和議價能力。研究員的看多條件，是新增運費收入足以超過塞港、租船與人員等增加費用。後續應一起追實收運費、載貨率、完成航次和費用，才知道周轉受阻最後留下多少利潤。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}]}, {"key": "macro-cycle-dec07", "sort_date": "2020-12-07", "sort_order": 74, "date_context": "2020年12月7日分享：宏遠第39–44頁的2010年比較", "heading": "他怎麼區分淡季回落與趨勢反轉：回頭看2010年的先後順序", "paragraphs": ["研究員想處理另一個會動搖持有的問題：運價從高點回落，是否就該預期股價見頂？他翻2010年，發現7月8日至12月30日，SCFI從1,583降到1,083，約跌32%；同段長榮股價從22.9到30.8元，約漲34%。", "他從這段歷史提出解釋：旺季轉淡季會使單季運價和獲利下降，但若比去年同季仍好，全年獲利預期還可能往上。於是他把季變動和年變動分開，觀察運價年增是否延續，以及季度EPS何時開始年減。", "報告第48頁另列2020上半年是疫情衝擊的低基期，因此預期2021同期較容易呈現年增。驗證年增時，再對照運價、貨量和當期實際利潤，確認成長來自新改善，還是去年基期特別低。", "宏遠當時認為2010年的股價高點，約出現在獲利年增轉弱之前，並將這個觀察拿來追2021年。這是一項用單次歷史景氣循環提出的判斷；新一輪仍要看需求、供給和市場原先預期。", "對投資決策而言，運價一週小跌時，他會再問：是季節性回落，還是補庫存結束、船櫃周轉恢復，已使後續獲利低於原估？先找出改變的是哪一項，再調整持有理由。"], "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "verification_steps": [36], "lane": "判斷", "calculations": [{"title": "2010年同一段期間，運價與股價各變多少", "formula": "SCFI：（1,083 ÷ 1,583 − 1）×100% ≈ −31.6%\n股價：（30.8 ÷ 22.9 − 1）×100% ≈ ＋34.5%", "meaning": "2010/07/08至12/30，數字採宏遠報告。研究員用這個反差，檢查「淡季運價回落就代表行情結束」的想法。"}], "text": "研究員想處理另一個會動搖持有的問題：運價從高點回落，是否就該預期股價見頂？他翻2010年，發現7月8日至12月30日，SCFI從1,583降到1,083，約跌32%；同段長榮股價從22.9到30.8元，約漲34%。他從這段歷史提出解釋：旺季轉淡季會使單季運價和獲利下降，但若比去年同季仍好，全年獲利預期還可能往上。於是他把季變動和年變動分開，觀察運價年增是否延續，以及季度EPS何時開始年減。報告第48頁另列2020上半年是疫情衝擊的低基期，因此預期2021同期較容易呈現年增。驗證年增時，再對照運價、貨量和當期實際利潤，確認成長來自新改善，還是去年基期特別低。宏遠當時認為2010年的股價高點，約出現在獲利年增轉弱之前，並將這個觀察拿來追2021年。這是一項用單次歷史景氣循環提出的判斷；新一輪仍要看需求、供給和市場原先預期。對投資決策而言，運價一週小跌時，他會再問：是季節性回落，還是補庫存結束、船櫃周轉恢復，已使後續獲利低於原估？先找出改變的是哪一項，再調整持有理由。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}]}, {"key": "nixt-field", "sort_date": "2020-12-08", "sort_order": 50, "date_context": "2020年12月8日10:42：nixt的業內訪談與換約判斷", "heading": "nixt怎麼查：問三家航商，發現客戶先搶櫃、附加費也在漲", "text": "12月8日上午，nixt沿著同一波運價上漲，去問分別任職三家大型航商的朋友。他問的是，現在運費是否真的漲得很兇，想用第一線接單情況核對報價指數。依他的轉述，客戶先找櫃、確認有沒有櫃可用，對價格的在意程度降低，各種附加費也持續提高。nixt據此認為，SCFI顯示的漲幅可能還沒完整涵蓋實際收費。檢查這個說法時，指數的費用範圍也要對上。上海航交所列SCFI已包含燃油、旺季等多種海運附加費，碼頭作業、內陸運送等費用則另列。因此，對照業內說的額外收費，要先確認它屬於哪個費目，才能判斷實收比指數多了多少。他接著把瓶頸連起來：疫情使清關和港口處理變慢，貨量卻增加；新櫃訂單排到次年第二季，補充速度趕不上需求。既有櫃卡在途中、新櫃又還沒交付，便能解釋貨主為何急著找櫃。他還認為，次年長約會參考10月以後的運價與市場狀況，因此支持長榮2021年EPS6元以上的方向。這個估值判斷來自業內轉述、報價與換約預期，原文沒有另外列出逐航線的獲利試算。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607395376.A.5B4", "https://en.sse.net.cn/indices/fqaen.jsp"], "verification_steps": [13], "lane": "資訊", "paragraphs": ["12月8日上午，nixt沿著同一波運價上漲，去問分別任職三家大型航商的朋友。他問的是，現在運費是否真的漲得很兇，想用第一線接單情況核對報價指數。", "依他的轉述，客戶先找櫃、確認有沒有櫃可用，對價格的在意程度降低，各種附加費也持續提高。nixt據此認為，SCFI顯示的漲幅可能還沒完整涵蓋實際收費。", "檢查這個說法時，指數的費用範圍也要對上。上海航交所列SCFI已包含燃油、旺季等多種海運附加費，碼頭作業、內陸運送等費用則另列。因此，對照業內說的額外收費，要先確認它屬於哪個費目，才能判斷實收比指數多了多少。", "他接著把瓶頸連起來：疫情使清關和港口處理變慢，貨量卻增加；新櫃訂單排到次年第二季，補充速度趕不上需求。既有櫃卡在途中、新櫃又還沒交付，便能解釋貨主為何急著找櫃。", "他還認為，次年長約會參考10月以後的運價與市場狀況，因此支持長榮2021年EPS6元以上的方向。這個估值判斷來自業內轉述、報價與換約預期，原文沒有另外列出逐航線的獲利試算。"]}, {"key": "nic-dec08", "sort_date": "2020-12-08", "sort_order": 60, "date_context": "2020年12月8日18:31；21:29與21:57當晚補充", "heading": "nic0911補另一條理由：農曆年前先備貨，再用明年淨值驗算估值", "paragraphs": ["同一天傍晚，nic0911把需求時間再往前拆。他看到中國PMI和出口維持高檔，又考慮次年農曆年在2月中旬；如果工廠年後復工有不確定性，出口商和海外買家可能提前在年前備貨，讓貨物流量提早集中。", "他的推論是，港口效率下降使每個貨櫃周轉更慢，提前備貨又提高裝櫃需求，缺櫃便可能延到次年上半年。要追的是年前出貨強度、年後復工和港口效率，三者如何一起變化。", "當晚21:29，他另補估值：假設第四季EPS4元，原先第三季淨值16.68加上去，年底20.68；再假設2021賺6元並保留，次年底26.68；給1.5倍PB，約40元。這比robertshih的第四季2.5至3元更積極，所以淨值與目標價也更高。", "他同時註明採未稀釋股本，並引中遠海控的券商2倍PB作同業參考。到了21:57，他又指出長榮先前在船價低時訂船、景氣反轉時交船。價格提高與既有交船計畫一起出現，是他看公司條件較好的理由。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607423495.A.7D5"], "verification_steps": [37], "lane": "判斷", "calculations": [{"title": "同一天另一位投資人的估值，差別從哪裡來", "formula": "假設Q4賺4元：16.68＋4＝2020年底淨值20.68元\n假設2021賺6元並保留：20.68＋6＝26.68元\n26.68 × 1.5倍PB＝40.02元（約40元）", "meaning": "依nic0911當晚補充，採未稀釋股本；股利與其他權益變動先維持原假設。"}], "text": "同一天傍晚，nic0911把需求時間再往前拆。他看到中國PMI和出口維持高檔，又考慮次年農曆年在2月中旬；如果工廠年後復工有不確定性，出口商和海外買家可能提前在年前備貨，讓貨物流量提早集中。他的推論是，港口效率下降使每個貨櫃周轉更慢，提前備貨又提高裝櫃需求，缺櫃便可能延到次年上半年。要追的是年前出貨強度、年後復工和港口效率，三者如何一起變化。當晚21:29，他另補估值：假設第四季EPS4元，原先第三季淨值16.68加上去，年底20.68；再假設2021賺6元並保留，次年底26.68；給1.5倍PB，約40元。這比robertshih的第四季2.5至3元更積極，所以淨值與目標價也更高。他同時註明採未稀釋股本，並引中遠海控的券商2倍PB作同業參考。到了21:57，他又指出長榮先前在船價低時訂船、景氣反轉時交船。價格提高與既有交船計畫一起出現，是他看公司條件較好的理由。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [3]}]}, {"date_context": "2020年12月14日 20:31:49", "heading": "出現矛盾：運價一直漲，11月營收卻減少", "text": "12月公布長榮11月營收約196.99億元，低於10月203.03億元、月減約3%。robertshih原先認為運價提高會帶動營收，這個反差使他去電長榮，想問發言人為什麼會月減。他在12月14日寫，發言人回電後先解釋幾個因素：塞港與船期延誤、11月比10月少一天，以及營收依航程進度逐日認列。公司認為更主要的原因，是美國線去程與回程船次的月份組合。去程由亞洲載貨到美國，運價和載貨率較高；回程運價和載貨率較低。依作者轉述，11月剛好有較高比例船次處於回程，因此即使去程報價上漲，當月認列的營收仍可能減少。作者聽完後，把原先「運價漲，營收卻減，是否生意轉弱」的疑問，改成「高價去程和低價回程在不同月份認列，造成大小月」。他接著查航線占比與船期，用下面的模型檢查這個解釋，再據此提出12月營收回補的預測。", "refs": ["https://disp.cc/b/Stock/d1NA"], "verification_steps": [6], "key": "original-07", "sort_date": "2020-12-14", "sort_order": 70, "paragraphs": ["12月公布長榮11月營收約196.99億元，低於10月203.03億元、月減約3%。robertshih原先認為運價提高會帶動營收，這個反差使他去電長榮，想問發言人為什麼會月減。", "他在12月14日寫，發言人回電後先解釋幾個因素：塞港與船期延誤、11月比10月少一天，以及營收依航程進度逐日認列。公司認為更主要的原因，是美國線去程與回程船次的月份組合。", "去程由亞洲載貨到美國，運價和載貨率較高；回程運價和載貨率較低。依作者轉述，11月剛好有較高比例船次處於回程，因此即使去程報價上漲，當月認列的營收仍可能減少。", "作者聽完後，把原先「運價漲，營收卻減，是否生意轉弱」的疑問，改成「高價去程和低價回程在不同月份認列，造成大小月」。他接著查航線占比與船期，用下面的模型檢查這個解釋，再據此提出12月營收回補的預測。"], "context_notes": [{"after_paragraph": 1, "title": "按航程進度認列，是什麼意思？", "text": "船公司會隨運輸服務完成的進度，把相應收入計入各月份。航程跨過月底時，收入也會分布到不同月份；下面的去回程模型，就是在檢查這個時間差。", "refs": ["https://disp.cc/b/Stock/d1NA"]}]}, {"date_context": "2020年12月14日 同一次查證", "heading": "他具體查到什麼：美國線占比、去回程差異與航程認列", "text": "他先確認這個因素大不大：美國線占長榮營收四成多，因此去回程船次比例改變，有機會影響全公司單月數字。他再連到ShipmentLink船期表，列亞洲到美西單程約20至25天、美東約35至40天，看到一趟航程足以跨月。接著把公司縮成一艘船來想。假設每程30天、每月1日出發，這個月跑運價高且較滿載的去程，營收較多；下個月跑低價、載貨率低的回程，營收較少。市場報價即使維持，月份營收仍會出現高低起伏。再放回多艘船的現實：各船出發日不同，通常會平滑這個落差；但若某個月恰好較多回程航段，仍可能讓全公司營收偏低。作者認為公司對11月的解釋，和這個航程模型接得起來。他得到的結論是：11月月減3%，可以由當月去回程組合與認列進度解釋；原先高運價的獲利方向仍值得繼續觀察。下一個要驗證的具體結果，就是12月去程占比提高後，營收是否明顯回升。", "refs": ["https://disp.cc/b/Stock/d1NA"], "verification_steps": [6], "key": "original-08", "sort_date": "2020-12-14", "sort_order": 80, "paragraphs": ["他先確認這個因素大不大：美國線占長榮營收四成多，因此去回程船次比例改變，有機會影響全公司單月數字。他再連到ShipmentLink船期表，列亞洲到美西單程約20至25天、美東約35至40天，看到一趟航程足以跨月。", "接著把公司縮成一艘船來想。假設每程30天、每月1日出發，這個月跑運價高且較滿載的去程，營收較多；下個月跑低價、載貨率低的回程，營收較少。市場報價即使維持，月份營收仍會出現高低起伏。", "再放回多艘船的現實：各船出發日不同，通常會平滑這個落差；但若某個月恰好較多回程航段，仍可能讓全公司營收偏低。作者認為公司對11月的解釋，和這個航程模型接得起來。", "他得到的結論是：11月月減3%，可以由當月去回程組合與認列進度解釋；原先高運價的獲利方向仍值得繼續觀察。下一個要驗證的具體結果，就是12月去程占比提高後，營收是否明顯回升。"]}, {"date_context": "2020年12月14日 查完之後", "heading": "他得到的論點與決定：預測12月補回，繼續持有", "text": "作者最後在文中明確推測，11月既然是回程比例高的小月，12月就可能是去程比例高的大月，營收有機會把前月落差補回。這是他把公司解釋和船期資料接起來後，自己提出的12月預測。他的決定是全部部位繼續持有。理由也接得完整：運價仍強，公司回電提供月減原因，航程資料讓大小月模型有了營運依據；接下來等12月營收，檢查這個解釋是否得到支持。同篇文章還交代持有工具的變動：股期多數已換到翌年1月合約，兩千多萬元獲利因此轉為已實現，整筆長榮部位總獲利約1.1億元。到期月份往後移、獲利轉為已實現，和是否減少整體曝險，要分別看換月後的持有數量。作者當時說的是繼續全數持有。文章引用的宏遠報告，另以2021年底淨值27.42元乘1.7倍，列46.6元目標。作者的12月營收預測先在隔年1月接受檢查；研究員的全年估值則繼續看長約、新船、成本與股數。", "refs": ["https://disp.cc/b/Stock/d1NA"], "verification_steps": [6], "key": "original-09", "sort_date": "2020-12-14", "sort_order": 90, "paragraphs": ["作者最後在文中明確推測，11月既然是回程比例高的小月，12月就可能是去程比例高的大月，營收有機會把前月落差補回。這是他把公司解釋和船期資料接起來後，自己提出的12月預測。", "他的決定是全部部位繼續持有。理由也接得完整：運價仍強，公司回電提供月減原因，航程資料讓大小月模型有了營運依據；接下來等12月營收，檢查這個解釋是否得到支持。", "同篇文章還交代持有工具的變動：股期多數已換到翌年1月合約，兩千多萬元獲利因此轉為已實現，整筆長榮部位總獲利約1.1億元。到期月份往後移、獲利轉為已實現，和是否減少整體曝險，要分別看換月後的持有數量。作者當時說的是繼續全數持有。", "文章引用的宏遠報告，另以2021年底淨值27.42元乘1.7倍，列46.6元目標。作者的12月營收預測先在隔年1月接受檢查；研究員的全年估值則繼續看長約、新船、成本與股數。"], "context_notes": [{"after_paragraph": 2, "title": "換月：持有較遠月份的契約", "text": "期貨有到期月份。換月時，先了結較近月份的部位，再改持較遠月份；近月交易的損益因此實現，整體持有規模則看換月後還有多少口。", "refs": ["https://www.taifex.com.tw/cht/2/sTF", "https://disp.cc/b/Stock/d1NA"]}], "outcome": {"title": "把當時的判斷，接到後來的結果", "columns": ["當時判斷", "後來查到的資料", "如何更新判斷"], "rows": [["12月營收會補回，決定繼續持有", "2021年1月8日公布12月營收245.8億元，月增24.77%。", "預測的回升方向獲得支持。"], ["11月回程較多，造成月份營收落差", "作者轉述公司回覆，並用航線占比、船期及單船模型檢查。", "去回程組合與漲價各貢獻多少，接著核對航次、貨量與實收明細。"]], "refs": ["https://disp.cc/b/Stock/d1NA"]}}, {"key": "macro-second", "sort_date": "2020-12-14", "sort_order": 100, "date_context": "2020年12月11日報告／12月14日上傳、由作者引用", "heading": "宏遠的新估算：把營收落差、換約與稀釋逐項算進去", "text": "林奕頎12月11日報告、12月14日由作者上傳引用，先面對11月營收年增22%、月減約3%的落差。他把塞港、截航時間和運價反映到收入超過一個月的延遲放進解釋，預期12月及翌年1月再創高，留下兩個後續能核對的月份。這份研究有把成本和股數接到獲利。第四季估營業利益152.69億元，扣業外淨支出11.39億元，約得稅前141.30億元；報告再估稅後107.39億元，除48.13億股約2.23元，改除52.908億稀釋股數約2.03元。稅前到稅後的差額含報告估計的稅與歸屬調整，原文有總數，細項未逐項展開。成本還有船隊設備的差異。報告提到提高脫硫設備裝設比率，就能增加較便宜高硫油的使用，12月10日高、低硫油每噸價差56美元。節省多少取決於可替代用油量，以及設備、維護和運轉費用；所以同樣運價下，兩家航商最後留下的利潤也可能不同。換約的計算現在明確落在長榮：第1、3頁寫每大箱漲100美元，一整年稀釋EPS增加0.33元；效益期間寫2021年6月至2022年5月。所以先用漲價幅度除以100，再乘0.33，就得到它這組模型對應的12個月增益。要比較2021單一曆年，再算6至12月能入帳的部分。把2元這個門檻算開：若看完整12個月，長約每大箱多約606美元，就對應2元；若先假設每月箱量平均分布、2021只反映7個月，則要多約1,039美元。用1,100美元示範，完整年度多3.63元，乘7/12後，2021約多2.12元。這是依後續報告敏感度作的編者重建，用來說明達到2元需要哪些條件。0.33元本身還可以往回查一層。它乘報告52.908億股，等於每漲100美元須增加約17.46億元的歸屬股東稅後利益。若編者另假設匯率30、扣稅20%、新增成本先維持原狀，且新增利益全數歸屬母公司，這個結果需要一年約72.75萬FEU適用新價。報告沒有列這組箱量與匯率，這裡是對照模型所需條件，方便日後拿實際箱量、成本與稅替換。全年估計另有完整損益表：第7頁估2021稅後純益409.26億元，除52.908億股得稀釋EPS7.74元；未稀釋EPS為8.50元。預估年底淨值27.42元，可由2020年底18.91元加次年EPS約8.50元銜接，四捨五入後與表內值相近；再乘1.7倍得46.61元，報告目標列46.60元。這裡的全年7.74元已是包含報告各項營運假設的總預估。旁邊每100美元增加0.33元，供比較換約幅度改變時要增減多少。將兩者接起來時，要先對報告原先已放入的換約假設，才知道新消息究竟讓原估上修了多少。這份更新把長約、成本、股數和新船放在同一個預估裡。接下來應觀察12月與1月營收是否創高，再對照新船實際交付、長約重簽和稅後利潤，逐項更新原來的估計。", "refs": ["https://speakerdeck.com/robertshih/14"], "verification_steps": [14], "lane": "資訊", "paragraphs": ["林奕頎12月11日報告、12月14日由作者上傳引用，先面對11月營收年增22%、月減約3%的落差。他把塞港、截航時間和運價反映到收入超過一個月的延遲放進解釋，預期12月及翌年1月再創高，留下兩個後續能核對的月份。", "這份研究有把成本和股數接到獲利。第四季估營業利益152.69億元，扣業外淨支出11.39億元，約得稅前141.30億元；報告再估稅後107.39億元，除48.13億股約2.23元，改除52.908億稀釋股數約2.03元。稅前到稅後的差額含報告估計的稅與歸屬調整，原文有總數，細項未逐項展開。", "成本還有船隊設備的差異。報告提到提高脫硫設備裝設比率，就能增加較便宜高硫油的使用，12月10日高、低硫油每噸價差56美元。節省多少取決於可替代用油量，以及設備、維護和運轉費用；所以同樣運價下，兩家航商最後留下的利潤也可能不同。", "換約的計算現在明確落在長榮：第1、3頁寫每大箱漲100美元，一整年稀釋EPS增加0.33元；效益期間寫2021年6月至2022年5月。所以先用漲價幅度除以100，再乘0.33，就得到它這組模型對應的12個月增益。要比較2021單一曆年，再算6至12月能入帳的部分。", "把2元這個門檻算開：若看完整12個月，長約每大箱多約606美元，就對應2元；若先假設每月箱量平均分布、2021只反映7個月，則要多約1,039美元。用1,100美元示範，完整年度多3.63元，乘7/12後，2021約多2.12元。這是依後續報告敏感度作的編者重建，用來說明達到2元需要哪些條件。", "0.33元本身還可以往回查一層。它乘報告52.908億股，等於每漲100美元須增加約17.46億元的歸屬股東稅後利益。若編者另假設匯率30、扣稅20%、新增成本先維持原狀，且新增利益全數歸屬母公司，這個結果需要一年約72.75萬FEU適用新價。報告沒有列這組箱量與匯率，這裡是對照模型所需條件，方便日後拿實際箱量、成本與稅替換。", "全年估計另有完整損益表：第7頁估2021稅後純益409.26億元，除52.908億股得稀釋EPS7.74元；未稀釋EPS為8.50元。預估年底淨值27.42元，可由2020年底18.91元加次年EPS約8.50元銜接，四捨五入後與表內值相近；再乘1.7倍得46.61元，報告目標列46.60元。", "這裡的全年7.74元已是包含報告各項營運假設的總預估。旁邊每100美元增加0.33元，供比較換約幅度改變時要增減多少。將兩者接起來時，要先對報告原先已放入的換約假設，才知道新消息究竟讓原估上修了多少。", "這份更新把長約、成本、股數和新船放在同一個預估裡。接下來應觀察12月與1月營收是否創高，再對照新船實際交付、長約重簽和稅後利潤，逐項更新原來的估計。"], "calculations": [{"title": "長榮要多2元EPS，依0.33敏感度需要多少換約價差", "formula": "12個月增量EPS ＝ 每FEU漲幅 ÷ 100 × 0.33\n全年2元門檻：2 ÷ 0.33 × 100 ≈ 606美元\n若2021只認列6～12月、各月箱量先採相同：\n2 ÷（0.33 × 7/12）× 100 ≈ 1,039美元\n例：漲1,100美元 → 3.63元/12個月\n3.63 × 7/12 ≈ 2021增加2.12元", "meaning": "0.33與跨年效益期間見12/11報告；每月箱量平均及門檻反算為編者情境。後續報告按12/14公開日使用。"}, {"title": "把0.33往回追：需要多少增量利潤與適用箱量", "formula": "0.33元 × 稀釋股數52.908億股\n＝ 每FEU漲100美元，增量稅後利益約17.46億元\n編者另設：匯率30、稅20%、新增成本0\n新增利益全數歸屬母公司\n所需全年FEU數\n＝ 1,745,964,000 ÷〔100 × 30 ×（1 − 20%）〕\n≈ 727,485 FEU（約72.75萬大箱）", "meaning": "報告提供0.33及股數；箱量是額外假設下的反算。實際成本、稅、歸屬與匯率不同時，所需箱量隨之改變。"}, {"title": "全年預估與目標價，各自怎麼算", "formula": "2021預估稅後純益409.26億元\n÷ 稀釋股數52.908億股 ≈ EPS7.74元\n預估年底每股淨值27.42 × 1.7倍PB\n＝ 46.614元 → 報告目標46.60元", "meaning": "總獲利、股數、淨值與倍數採研究第7頁及第1–2頁；0.33另用於比較換約變動幅度。"}], "table": {"title": "編者依長榮0.33敏感度重算：12個月與2021曆年分開", "columns": ["每FEU換約漲幅", "12個月增量EPS", "2021估計反映7/12"], "rows": [["600美元", "1.98元", "1.16元"], ["700美元", "2.31元", "1.35元"], ["1,000美元", "3.30元", "1.93元"], ["1,100美元", "3.63元", "2.12元"], ["1,200美元", "3.96元", "2.31元"]]}, "context_notes": [{"after_paragraph": 3, "title": "敏感度：每改一項條件，獲利會差多少？", "text": "研究先維持其他模型條件，估長約每大箱多100美元時，完整12個月EPS增加0.33元。要換成2021年入帳金額，還要接上新約開始反映的月份與適用貨量。", "refs": ["https://speakerdeck.com/robertshih/14"]}], "calculation_labels": ["宏遠敏感度＋編者補算｜完整12個月與2021年分開", "編者反推｜自設匯率、稅率與成本條件", "宏遠當時預估｜長榮2021全年"], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [5]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [6]}, {"type": "calculations", "indices": [2]}, {"type": "paragraphs", "indices": [7]}, {"type": "paragraphs", "indices": [8]}, {"type": "table", "index": 0}]}, {"key": "sea-empty", "sort_date": "2020-12-16", "sort_order": 50, "date_context": "2020年12月16日：Sea-Intelligence當期研究", "heading": "Alan Murphy追空櫃：短缺要怎麼解除，才是延續多久的關鍵", "text": "12月16日，Sea-Intelligence執行長Alan Murphy把空櫃短缺拆成四種處理情境：沿用原方式、加速調回空櫃、增加新櫃，以及調回與新櫃一起做。他想回答的問題，是造成高運價的供給瓶頸要多久才能改善。推論關鍵在回程船位的用途。如果航商優先帶回程重櫃，眼前可取得運輸收入，但空櫃回到亞洲的速度較慢；若加速帶空櫃回來，亞洲下一趟可接貨能力便較快補上。新櫃投入則再增加可用數量，兩個措施合併才會更快改善短缺。研究在當時情境下估，積極調空櫃並加新櫃，才有機會1月改善；若仍優先載回程重櫃，短缺可能延到2月或之後。這使「高價維持多久」有了可追的輸入：回程配載、空櫃回流、新櫃交付與港口周轉。對長榮的研究，這份材料接在作者的供需假設後面：如果補救速度快，較高運價持續時間可能縮短；如果回流慢，就繼續追下一期報價與收入。這些是Alan Murphy的當期模型，按12月16日加入更新，供與作者看法交叉比較。", "refs": ["https://sea-intelligence.com/press-room/37-empty-container-shortages-in-asia-to-persist-into-january"], "verification_steps": [15], "lane": "資訊", "paragraphs": ["12月16日，Sea-Intelligence執行長Alan Murphy把空櫃短缺拆成四種處理情境：沿用原方式、加速調回空櫃、增加新櫃，以及調回與新櫃一起做。他想回答的問題，是造成高運價的供給瓶頸要多久才能改善。", "推論關鍵在回程船位的用途。如果航商優先帶回程重櫃，眼前可取得運輸收入，但空櫃回到亞洲的速度較慢；若加速帶空櫃回來，亞洲下一趟可接貨能力便較快補上。新櫃投入則再增加可用數量，兩個措施合併才會更快改善短缺。", "研究在當時情境下估，積極調空櫃並加新櫃，才有機會1月改善；若仍優先載回程重櫃，短缺可能延到2月或之後。這使「高價維持多久」有了可追的輸入：回程配載、空櫃回流、新櫃交付與港口周轉。", "對長榮的研究，這份材料接在作者的供需假設後面：如果補救速度快，較高運價持續時間可能縮短；如果回流慢，就繼續追下一期報價與收入。這些是Alan Murphy的當期模型，按12月16日加入更新，供與作者看法交叉比較。"]}, {"date_context": "2020年12月21日操作／12月23日 23:01:30說明", "heading": "作者為何減碼：年度獲利目標達到，先收回成本", "text": "作者12月23日晚間回述，「前天」已賣出7,650張，剩餘連同股期約當4,110張、市值約1.2億元。依這個相對日期，操作記在12月21日。他的決策理由是行情已達自己設定的年度獲利目標，所以賣出一部分，把進場市值成本收回，留下其餘部位參與後市。此時文章仍留有上行預期；驅動這次減碼的是他對已累積獲利與部位規模的安排。把它接回12月14日，前一次決定是營收落差查完後仍續抱，這一次則是到達個人目標後降低投入。兩次行動各有自己的觸發條件。後面的年度回顧又記他因新同業獲利回補，於是部位路徑可以依資料更新和個人目標逐次對回。他仍偏向認為行情在中段，理由還包括當年其他獲利爆發股的比較。他在12月23日列恆大高點約對應當年11倍PE、熱映約9倍，認為即使市場預期題材只有一年，短期也可能給更高倍數；若航運高獲利延續更久，價格空間便可能還在。這些倍數是他當時引用的比較。因此他的決策並非只靠一個目標價：公司前景仍好，讓他保留上漲參與；個人年度目標達成，讓他先收回原投入金額。減碼後承受波動的心理壓力較小，他認為更有機會把剩下的部位抱久一點。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1608735699.A.EE1"], "verification_steps": [7], "key": "original-10", "sort_date": "2020-12-21", "sort_order": 100, "paragraphs": ["作者12月23日晚間回述，「前天」已賣出7,650張，剩餘連同股期約當4,110張、市值約1.2億元。依這個相對日期，操作記在12月21日。", "他的決策理由是行情已達自己設定的年度獲利目標，所以賣出一部分，把進場市值成本收回，留下其餘部位參與後市。此時文章仍留有上行預期；驅動這次減碼的是他對已累積獲利與部位規模的安排。", "把它接回12月14日，前一次決定是營收落差查完後仍續抱，這一次則是到達個人目標後降低投入。兩次行動各有自己的觸發條件。後面的年度回顧又記他因新同業獲利回補，於是部位路徑可以依資料更新和個人目標逐次對回。", "他仍偏向認為行情在中段，理由還包括當年其他獲利爆發股的比較。他在12月23日列恆大高點約對應當年11倍PE、熱映約9倍，認為即使市場預期題材只有一年，短期也可能給更高倍數；若航運高獲利延續更久，價格空間便可能還在。這些倍數是他當時引用的比較。", "因此他的決策並非只靠一個目標價：公司前景仍好，讓他保留上漲參與；個人年度目標達成，讓他先收回原投入金額。減碼後承受波動的心理壓力較小，他認為更有機會把剩下的部位抱久一點。"]}, {"key": "deck-dec23", "sort_date": "2020-12-23", "sort_order": 50, "date_context": "2020年12月23日分享：作者稱為宏遠12月21日報告", "heading": "同一天的另一份研究：先假設運價腰斬，再算獲利還剩多少", "text": "12月23日，robertshih分享一份12頁研究，文中稱為宏遠12月21日的新報告。簡報列12月18日SCFI2,412、第四季均值約1,759，對照第三季1,182與EPS1.7元，再主動把明年運價往下壓，檢查較差情境下還能賺多少。它先讓2021年運價退回第三季指數1182，約比2412低51%；若每一季仍能保留第三季1.7元獲利，全年就是6.8元。這一步的意思是先壓低報價，看看獲利還剩多少，再和價格背後的市場預估比較。簡報列市場預估3.79元，於是6.8元情境仍有較大預期差。但從指數1182推到每季1.7元，中間沿用了第三季的成本、貨量與合約條件；往後應檢查這些條件是否還在，並放入轉債等股數變化。這份研究留下的是一條較低運價仍可能高於市場原估的論證。作者同日說明個人減碼，則由自己的部位與目標觸發。把兩份材料按各自作者與用途並列，便能理解公司估值情境和個人資金決策如何同時存在。", "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"], "verification_steps": [16], "lane": "資訊", "paragraphs": ["12月23日，robertshih分享一份12頁研究，文中稱為宏遠12月21日的新報告。簡報列12月18日SCFI2,412、第四季均值約1,759，對照第三季1,182與EPS1.7元，再主動把明年運價往下壓，檢查較差情境下還能賺多少。", "它先讓2021年運價退回第三季指數1182，約比2412低51%；若每一季仍能保留第三季1.7元獲利，全年就是6.8元。這一步的意思是先壓低報價，看看獲利還剩多少，再和價格背後的市場預估比較。", "簡報列市場預估3.79元，於是6.8元情境仍有較大預期差。但從指數1182推到每季1.7元，中間沿用了第三季的成本、貨量與合約條件；往後應檢查這些條件是否還在，並放入轉債等股數變化。", "這份研究留下的是一條較低運價仍可能高於市場原估的論證。作者同日說明個人減碼，則由自己的部位與目標觸發。把兩份材料按各自作者與用途並列，便能理解公司估值情境和個人資金決策如何同時存在。"], "calculations": [{"title": "先把較低運價帶回獲利基準", "formula": "（1182 ÷ 2412 − 1）× 100% ≈ −51%\n假設每季EPS 1.70 × 4季 ＝ 全年6.80元", "meaning": "6.80元依賴「第三季獲利水準能保留」的情境；接著要查成本、貨量與航線組合。"}, {"title": "較差情境和市場預估，中間差多少", "formula": "情境EPS6.80 − 報告列市場預估3.79＝3.01元\n6.80 ÷ 3.79 − 1 ≈ 79.4%", "meaning": "沿用第三季條件推四季為報告的簡化情境；市場預估3.79採報告當時列值。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [3]}]}, {"key": "deck-ecb-dec23", "sort_date": "2020-12-23", "sort_order": 111, "date_context": "2020年12月23日分享：研究第4–5頁", "heading": "另一份ECB判斷：股份增加多少，獲利要多賺多少才跟得上", "paragraphs": ["這份研究把ECB問題分成股票供給和每股獲利。作者11月關注的是套利賣單壓價；12月研究進一步問，轉股後股份增加，是否會把營運成長吃掉。", "報告先拿陽明作比較：9月底到11月底，可轉債面額由72.6億降到42.3億，減少30.3億元，約換成29.1萬張普通股；同頁又列股價由9.7到13.25元，約漲37%。研究員用這個例子說明，市場也可能在股份增加時，繼續上調獲利評價。", "長榮的規模則可從條款驗算：新增約4.779億股，相對當時原股數48.13億股，增加約9.93%。若利潤維持原狀，每股盈餘會降約9.03%；若總利潤增加9.93%，則剛好抵銷股數增加。", "因此，研究員的看法是，應把預期獲利成長和股數增加放在一起比較。他認為長榮的成長足以承受約一成增股，並把因轉股消息而出現的短線回落視為可能機會。這是研究員的買點判斷，和作者按日量估賣壓消化的思路各有重點。"], "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"], "verification_steps": [38], "lane": "判斷", "calculations": [{"title": "讓股數與利潤放在同一把計算裡", "formula": "潛在新增股4.778736億 ÷ 原48.13億 ≈ 9.93%\n獲利固定時：新EPS ÷ 原EPS\n＝ 48.13 ÷（48.13＋4.778736）≈ 90.97%\n利潤增加約9.93%，可抵銷同幅度增股", "meaning": "以官方初始條款與研究原股數補算，用於理解稀釋；實際EPS再採各期平均股數與已公告利潤。"}], "text": "這份研究把ECB問題分成股票供給和每股獲利。作者11月關注的是套利賣單壓價；12月研究進一步問，轉股後股份增加，是否會把營運成長吃掉。報告先拿陽明作比較：9月底到11月底，可轉債面額由72.6億降到42.3億，減少30.3億元，約換成29.1萬張普通股；同頁又列股價由9.7到13.25元，約漲37%。研究員用這個例子說明，市場也可能在股份增加時，繼續上調獲利評價。長榮的規模則可從條款驗算：新增約4.779億股，相對當時原股數48.13億股，增加約9.93%。若利潤維持原狀，每股盈餘會降約9.03%；若總利潤增加9.93%，則剛好抵銷股數增加。因此，研究員的看法是，應把預期獲利成長和股數增加放在一起比較。他認為長榮的成長足以承受約一成增股，並把因轉股消息而出現的短線回落視為可能機會。這是研究員的買點判斷，和作者按日量估賣壓消化的思路各有重點。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [3]}]}, {"key": "deck-demand-dec23", "sort_date": "2020-12-23", "sort_order": 112, "date_context": "2020年12月23日分享：研究第6–9頁", "heading": "利空消息怎麼查：聖誕節、英國脫歐、表面運價停漲，各拆哪一段", "paragraphs": ["研究先處理聖誕節後需求可能轉弱的說法。它由到貨時間倒推：海運超過一個月，還有陸運、倉儲和上架，聖誕銷售的商品通常得較早離開亞洲。研究因此認為，12月仍在上漲的歐洲線，需要另外追補庫存和供給瓶頸，才能解釋眼前的價格。", "對英國脫歐，它先分航線。英國與歐盟之間的貿易、英國囤貨，和亞洲輸往整個歐洲的貨櫃需求，涵蓋範圍不同。報告又指出當時緊張處包括北歐，據此判斷用英國單一事件解釋全部歐洲線漲價，涵蓋的供需範圍不足。", "對美國線報價暫停上漲，研究改查實際收費。它稱每大櫃另有1,000至2,000美元服務費，約相當於四千美元運價的25%至50%。這代表貨主的總支出可能繼續增加，指數主報價持平時，還要把附加費一起看。", "它再找港口貨物流量核對需求與空櫃回流：洛杉磯港11月進口464,820 TEU，出口實櫃130,917加空櫃294,010，合計424,927 TEU，少回流39,893 TEU。報告將這個差額作為貨櫃仍滯留當地、亞洲回櫃不足的線索。", "最後得到的投資論點是：新聞標題所指的利空，先對到真正受影響的貨物、航線與時間，再看總收費、出貨和回櫃有沒有轉弱。若原先支撐高運價的條件仍在，單一節日結束或主報價持平，對獲利預估的影響就要重新估量。"], "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"], "verification_steps": [39], "lane": "判斷", "calculations": [{"title": "報告怎麼用收費與港口量，核對表面停漲", "formula": "服務費 ÷ 約4,000美元主報價\n＝ 1,000～2,000 ÷ 4,000＝25%～50%\n11月回流櫃量＝130,917＋294,010＝424,927 TEU\n進口464,820 − 回流424,927＝39,893 TEU", "meaning": "均依研究所引當期資料驗算；港口差額是回流線索，仍須配合貨櫃後續去向觀察。"}], "text": "研究先處理聖誕節後需求可能轉弱的說法。它由到貨時間倒推：海運超過一個月，還有陸運、倉儲和上架，聖誕銷售的商品通常得較早離開亞洲。研究因此認為，12月仍在上漲的歐洲線，需要另外追補庫存和供給瓶頸，才能解釋眼前的價格。對英國脫歐，它先分航線。英國與歐盟之間的貿易、英國囤貨，和亞洲輸往整個歐洲的貨櫃需求，涵蓋範圍不同。報告又指出當時緊張處包括北歐，據此判斷用英國單一事件解釋全部歐洲線漲價，涵蓋的供需範圍不足。對美國線報價暫停上漲，研究改查實際收費。它稱每大櫃另有1,000至2,000美元服務費，約相當於四千美元運價的25%至50%。這代表貨主的總支出可能繼續增加，指數主報價持平時，還要把附加費一起看。它再找港口貨物流量核對需求與空櫃回流：洛杉磯港11月進口464,820 TEU，出口實櫃130,917加空櫃294,010，合計424,927 TEU，少回流39,893 TEU。報告將這個差額作為貨櫃仍滯留當地、亞洲回櫃不足的線索。最後得到的投資論點是：新聞標題所指的利空，先對到真正受影響的貨物、航線與時間，再看總收費、出貨和回櫃有沒有轉弱。若原先支撐高運價的條件仍在，單一節日結束或主報價持平，對獲利預估的影響就要重新估量。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [4]}]}, {"key": "deck-tracking-dec23", "sort_date": "2020-12-23", "sort_order": 113, "date_context": "2020年12月23日分享：研究第1–2、10–12頁", "heading": "接下來看什麼：輪流漲價、營收落後一個月，以及運價年增", "paragraphs": ["報告還把不同航線放在一起追。12月18日綜合指數漲4.3%，東南亞線漲12.7%；研究認為，船與櫃在不同航線間調度，各地搶運力，會形成輪流漲價。公司受惠多少，仍取決於各航線占比和適用的新價格。", "它把時間對到營收：10月運價主要反映11月、11月反映12月、12月再反映翌年1月。這使後續追蹤有了先後順序，先看報價與訂艙，再看下一期營收和利潤，遇到落差就回查航程與費用。", "對較長的行情，研究延續看運價和獲利年增的思路，同時注意短期淡旺季。它也把12月31日陽明法說列為新資料時間點，並觀察馬士基等同業股價。法說提供營運更新；同業價格提供市場如何反應產業預期的參照。"], "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"], "verification_steps": [40], "lane": "判斷", "text": "報告還把不同航線放在一起追。12月18日綜合指數漲4.3%，東南亞線漲12.7%；研究認為，船與櫃在不同航線間調度，各地搶運力，會形成輪流漲價。公司受惠多少，仍取決於各航線占比和適用的新價格。它把時間對到營收：10月運價主要反映11月、11月反映12月、12月再反映翌年1月。這使後續追蹤有了先後順序，先看報價與訂艙，再看下一期營收和利潤，遇到落差就回查航程與費用。對較長的行情，研究延續看運價和獲利年增的思路，同時注意短期淡旺季。它也把12月31日陽明法說列為新資料時間點，並觀察馬士基等同業股價。法說提供營運更新；同業價格提供市場如何反應產業預期的參照。"}, {"key": "buyback-dec25", "sort_date": "2020-12-25", "sort_order": 50, "date_context": "2020年12月25日操作推定／2021年1月3日本人回述", "heading": "減碼後又買回：同業單月獲利，給了他新的判斷依據", "text": "王憶紅12月25日報導，陽明在「昨日」公布11月自結：營收152.65億元、稅後獲利27.05億元、EPS0.92元，單月已超過前三季累計。這讓高運價的研究從報價與營收，往實際利潤多走了一步。作者在1月3日年度回顧回述，自己在陽明公布0.92元的隔天，追回約當1,700張長榮股期。把新聞的昨日定位為12月24日，再接隔天，回補日因此記為12月25日的交叉對時推定。他的行動依據可沿時間接起來：剛依個人目標減碼，隨後同業公布比先前累計更強的單月獲利，便重新估量長榮在共同運價環境下可能留下的利潤，再買回部分部位。作者的回述直接交代了新數字與回補的先後關係。跨公司推估仍要比較各自航線、長約、成本與股數。這組資料支持重新檢查長榮的未來獲利，實際成交價格則另由交易明細回答。之後1月公布長榮12月收入，會繼續檢查新估計的營運方向。", "refs": ["https://ec.ltn.com.tw/article/paper/1421281", "https://www.pttweb.cc/bbs/Stock/M.1609611680.A.094"], "verification_steps": [17], "lane": "判斷", "paragraphs": ["王憶紅12月25日報導，陽明在「昨日」公布11月自結：營收152.65億元、稅後獲利27.05億元、EPS0.92元，單月已超過前三季累計。這讓高運價的研究從報價與營收，往實際利潤多走了一步。", "作者在1月3日年度回顧回述，自己在陽明公布0.92元的隔天，追回約當1,700張長榮股期。把新聞的昨日定位為12月24日，再接隔天，回補日因此記為12月25日的交叉對時推定。", "他的行動依據可沿時間接起來：剛依個人目標減碼，隨後同業公布比先前累計更強的單月獲利，便重新估量長榮在共同運價環境下可能留下的利潤，再買回部分部位。作者的回述直接交代了新數字與回補的先後關係。", "跨公司推估仍要比較各自航線、長約、成本與股數。這組資料支持重新檢查長榮的未來獲利，實際成交價格則另由交易明細回答。之後1月公布長榮12月收入，會繼續檢查新估計的營運方向。"]}, {"key": "analysts-dec29", "sort_date": "2020-12-29", "sort_order": 50, "date_context": "2020年12月29日 17:55：蔡芃敏採訪兩位分析師", "heading": "同樣看好基本面，兩位分析師對此刻買進的考量不同", "text": "12月29日，中央社蔡芃敏報導長榮收38.35元、漲4.35%，成交約88萬張，三家貨櫃航商合計逾140萬張。同一天兩位受訪者都看好產業，卻從不同問題推決策。宏遠陳國清把短期波動連到可轉債，認為產業改善約半年、股價漲四五個月，行情仍可能在中段。他的判斷先看生意好轉是否尚未完成，再把交易性賣壓視為當下波動的可能來源。國泰證期顧問處蔡明翰則把已漲幅度、乖離與爆量放進買價考量。即使未來獲利方向相同，價格已先反映多少，會改變新投入資金剩下的空間。因此，已有部位要留多少，和準備新買要付多少，會得到不同安排。這篇留下了當期的多頭理由和價格顧慮。後來1月確實回檔，可用來接價格路徑；要解釋每一筆賣單的原因，仍沿當期交易與部位資料查。它在故事裡的作用，是讓公司前景、當時價格與部位選擇三者連在一起。", "refs": ["https://www.cna.com.tw/news/afe/202012290291.aspx"], "verification_steps": [18], "lane": "資訊", "paragraphs": ["12月29日，中央社蔡芃敏報導長榮收38.35元、漲4.35%，成交約88萬張，三家貨櫃航商合計逾140萬張。同一天兩位受訪者都看好產業，卻從不同問題推決策。", "宏遠陳國清把短期波動連到可轉債，認為產業改善約半年、股價漲四五個月，行情仍可能在中段。他的判斷先看生意好轉是否尚未完成，再把交易性賣壓視為當下波動的可能來源。", "國泰證期顧問處蔡明翰則把已漲幅度、乖離與爆量放進買價考量。即使未來獲利方向相同，價格已先反映多少，會改變新投入資金剩下的空間。因此，已有部位要留多少，和準備新買要付多少，會得到不同安排。", "這篇留下了當期的多頭理由和價格顧慮。後來1月確實回檔，可用來接價格路徑；要解釋每一筆賣單的原因，仍沿當期交易與部位資料查。它在故事裡的作用，是讓公司前景、當時價格與部位選擇三者連在一起。"]}, {"key": "company-dec31", "sort_date": "2020-12-31", "sort_order": 50, "date_context": "2020年12月31日 15:19：王憶紅報導陽明法說", "heading": "公司端怎麼看：第一季價量高檔，接著看第二季換約", "text": "12月31日，王憶紅報導陽明總經理杜書勤在法說提出：2021第一季各航線價量有望維持高檔，第二季美國線長約換約也可望受惠。研究員先前的「現貨先反映、長約稍後接上」，因此多了同業公司端的當期說法。這份展望可拆成連續的驗證時間：第一季先檢查訂艙、報價與出貨是否仍強；到第二季再看換約價差和適用箱量；全年則追疫情、貿易政策與港口周轉如何改變貨流和供給。每個階段都要把新收入和新增成本相減，再看利潤。對長榮而言，同業的說法提供共同環境，公司的數量估算仍回到長榮自己的航線與合約。研究因此是先用多方來源確認景氣，再把各家財務與生意結構拆開，形成各自的EPS與買價判斷。", "refs": ["https://ec.ltn.com.tw/article/breakingnews/3397812"], "verification_steps": [19], "lane": "資訊", "paragraphs": ["12月31日，王憶紅報導陽明總經理杜書勤在法說提出：2021第一季各航線價量有望維持高檔，第二季美國線長約換約也可望受惠。研究員先前的「現貨先反映、長約稍後接上」，因此多了同業公司端的當期說法。", "這份展望可拆成連續的驗證時間：第一季先檢查訂艙、報價與出貨是否仍強；到第二季再看換約價差和適用箱量；全年則追疫情、貿易政策與港口周轉如何改變貨流和供給。每個階段都要把新收入和新增成本相減，再看利潤。", "對長榮而言，同業的說法提供共同環境，公司的數量估算仍回到長榮自己的航線與合約。研究因此是先用多方來源確認景氣，再把各家財務與生意結構拆開，形成各自的EPS與買價判斷。"]}, {"key": "annual-2020", "sort_date": "2021-01-03", "sort_order": 50, "date_context": "2021年1月2日 23:05部落格／1月3日 02:21論壇", "heading": "年度回顧把前面的行動接起來：11月中建倉，年底回補後仍有部位", "text": "2021年1月2日晚，作者部落格年度總結回顧，長榮在11月中建倉；1月3日PTT版則列現股1,124張、股期2,345口，合計約當5,814張，並說曾追回約當1,700張。這把最早完整公開文章與他後來自述的建倉月份接起來。逐次部位因而有了可核的順序：11月中建倉，12月7日持續加碼，12月21日按個人目標部分賣出，陽明新月獲利出現後回補，年初仍有部位。每次變動都有文章或年度回顧對應；回補日另外標明是依相對日期推定。他也自述盤中會在現股與期貨之間轉換，利用兩邊價差。這屬於持有工具與資金安排的調整，應同看換算後股數、到期月份、保證金和成本。原文提供了操作方式與當時部位，逐筆價差收益還要由成交紀錄核。全年整體資產變化約3.8億元，作者約一半歸長榮，其餘來自其他短線策略；年度數字按這個多策略範圍保存。市場從11月到後來高點的漲幅，另按價格序列計算，和他的實際各次加減碼分開對照。", "refs": ["https://et220870.blogspot.com/2021/01/2020.html", "https://www.pttweb.cc/bbs/Stock/M.1609611680.A.094"], "verification_steps": [20], "lane": "判斷", "paragraphs": ["2021年1月2日晚，作者部落格年度總結回顧，長榮在11月中建倉；1月3日PTT版則列現股1,124張、股期2,345口，合計約當5,814張，並說曾追回約當1,700張。這把最早完整公開文章與他後來自述的建倉月份接起來。", "逐次部位因而有了可核的順序：11月中建倉，12月7日持續加碼，12月21日按個人目標部分賣出，陽明新月獲利出現後回補，年初仍有部位。每次變動都有文章或年度回顧對應；回補日另外標明是依相對日期推定。", "他也自述盤中會在現股與期貨之間轉換，利用兩邊價差。這屬於持有工具與資金安排的調整，應同看換算後股數、到期月份、保證金和成本。原文提供了操作方式與當時部位，逐筆價差收益還要由成交紀錄核。", "全年整體資產變化約3.8億元，作者約一半歸長榮，其餘來自其他短線策略；年度數字按這個多策略範圍保存。市場從11月到後來高點的漲幅，另按價格序列計算，和他的實際各次加減碼分開對照。"], "calculations": [{"title": "把現股與股期，換成同一單位", "formula": "依作者換算：1,124張 ＋ 2,345口 × 每口2張 ＝ 約當5,814張", "meaning": "約當張數用來描述部位規模。部位紀錄採作者年報自述。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}]}, {"date_context": "2021年1月8日公告／1月11日報導", "heading": "預測接受實績檢查：12月營收回升24.77%", "text": "1月11日中央社回述，長榮已於前一個星期五、1月8日公布12月營收245.8億元，月增24.77%、比11月多近50億元，創當時單月新高。這是12月14日作者預測後，第一個能直接對答案的收入結果。先固定他當時的預測：因11月偏回程，推12月偏去程、收入會補回。再看實績：12月的確回升。保存的FinLab資料，11月196.99341億、12月245.80336億，也與新聞方向和量級相符，公告時點則由新聞核到1月8日。因此，查證後可更新的是回補方向得到支持。若要再檢查他提出的航程解釋能占多少，還要把新報價、各方向實收、貨量和航次進度分開，因為月營收呈現的是這些項目的總和。下一步應繼續看1月收入與後續利潤：回補若只是跨月挪動，持續性有限；若較高運價和新服務仍在進帳，下一期也會留下線索。這讓一次預測驗證自然接到下一輪追蹤。", "refs": ["https://www.cna.com.tw/news/afe/202101110233.aspx"], "verification_steps": [8], "key": "original-11", "sort_date": "2021-01-08", "sort_order": 110, "paragraphs": ["1月11日中央社回述，長榮已於前一個星期五、1月8日公布12月營收245.8億元，月增24.77%、比11月多近50億元，創當時單月新高。這是12月14日作者預測後，第一個能直接對答案的收入結果。", "先固定他當時的預測：因11月偏回程，推12月偏去程、收入會補回。再看實績：12月的確回升。保存的FinLab資料，11月196.99341億、12月245.80336億，也與新聞方向和量級相符，公告時點則由新聞核到1月8日。", "因此，查證後可更新的是回補方向得到支持。若要再檢查他提出的航程解釋能占多少，還要把新報價、各方向實收、貨量和航次進度分開，因為月營收呈現的是這些項目的總和。", "下一步應繼續看1月收入與後續利潤：回補若只是跨月挪動，持續性有限；若較高運價和新服務仍在進帳，下一期也會留下線索。這讓一次預測驗證自然接到下一輪追蹤。"], "calculations": [{"title": "12月回補，如何由實際營收核算", "formula": "12月245.80336億 − 11月196.99341億\n＝ 增加48.80995億元\n（245.80336 ÷ 196.99341 − 1）× 100%\n≈ 月增24.77%", "meaning": "保存的FinLab月營收與1月11日中央社回述一致；1月8日公告時間由新聞定位。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}]}, {"date_context": "2021年1月至2月9日", "heading": "營收繼續創高，股價卻先回檔，再恢復上行", "text": "2月9日中央社再報，長榮1月營收284.35億元，月增15.68%、年增71.69%。12月回補後，1月又增加，收入端的改善因此多延續一期。價格卻走了不同節奏：1月底收31.2元，當月還原下跌23.34%；2月底37.95元，再回升21.63%。這時研究要同時看公司實績和市場原先已放進價格的期待。收入提高，可支持營運改善；後面還有多少未反映的利潤，則要另外估。具體查法是把原模型逐項更新：運價和實收仍強嗎，新增成本吃掉多少，後面換約還能增加多少，現價和更新後獲利相比又是幾倍？同時核當期賣壓和資金變化，才可往價格回檔原因推。本案已有連續收入與股價可對照，對1月各種賣壓的貢獻則保留為待查項目。決策時，先把可核的營運結果更新，再處理買價和持有規模，避免讓單日漲跌取代整套獲利判斷。", "refs": ["https://www.cna.com.tw/news/afe/202102090298.aspx"], "verification_steps": [8], "table": {"title": "把預測和後來的結果攤開來看", "columns": ["何時、原先想確認什麼", "後來查到的結果", "這次可以得到的判斷"], "rows": [["2020-12-14：11月月減約3%，作者推測12月去程比例提高，營收會補回。", "2021-01-08公告12月245.8億元，月增24.77%；1月11日中央社報導可核。", "下一月回補的方向得到支持。各航次與新運價分別貢獻多少，總營收還要搭配細項來算。"], ["接著追：營收回補後，下一個月還能不能維持？", "2021-02-09報導1月營收284.35億元，較12月再增15.68%。", "收入持續增加，多了一期營運支持；同時股價1月回檔，仍要持續比較市場期待與價格。"]]}, "key": "original-12", "sort_date": "2021-02-09", "sort_order": 120, "paragraphs": ["2月9日中央社再報，長榮1月營收284.35億元，月增15.68%、年增71.69%。12月回補後，1月又增加，收入端的改善因此多延續一期。", "價格卻走了不同節奏：1月底收31.2元，當月還原下跌23.34%；2月底37.95元，再回升21.63%。這時研究要同時看公司實績和市場原先已放進價格的期待。收入提高，可支持營運改善；後面還有多少未反映的利潤，則要另外估。", "具體查法是把原模型逐項更新：運價和實收仍強嗎，新增成本吃掉多少，後面換約還能增加多少，現價和更新後獲利相比又是幾倍？同時核當期賣壓和資金變化，才可往價格回檔原因推。", "本案已有連續收入與股價可對照，對1月各種賣壓的貢獻則保留為待查項目。決策時，先把可核的營運結果更新，再處理買價和持有規模，避免讓單日漲跌取代整套獲利判斷。"]}, {"date_context": "2021年2月19日：11月文章後約三個月", "heading": "用大盤與同業核對：這波行情有很強的航運共同因素", "text": "要檢查這段上漲是否和航運機會有關，先讓比較期間一致，再把長榮、大盤與陽明、萬海放在一起。這裡採文章發表前的11月17日收盤為比較基準，至2021年2月19日，長榮還原上漲74.64%，比大盤多54.24個百分點，比指定同業平均多5.53個百分點。再回看文章前60個交易間隔，長榮已漲40.67%，同業平均漲68.21%。這表示作者是在產業行情已展開後，尋找長榮相對落後及後續獲利的空間。文章發表前的價格位置，必須和發表後的變化一起看。把證據順序接好：當期新聞有運價與供給瓶頸，多家航商收入及利潤改善，族群價格又共同上漲。這幾項彼此對得上，支持航運共同景氣是重要解釋。長榮之後額外相對同業的表現，則再拆航線、成本、財務與交易因素。因此，ECB假說的驗證還要另外核借券流量、轉換與相對估值。產業改善的證據、長榮相對表現、特定賣方交易，各有對應資料；按這個順序看，就能避免把整段行情全部歸給單一訊息。", "refs": [], "verification_steps": [9], "key": "original-13", "sort_date": "2021-02-19", "sort_order": 130, "paragraphs": ["要檢查這段上漲是否和航運機會有關，先讓比較期間一致，再把長榮、大盤與陽明、萬海放在一起。這裡採文章發表前的11月17日收盤為比較基準，至2021年2月19日，長榮還原上漲74.64%，比大盤多54.24個百分點，比指定同業平均多5.53個百分點。", "再回看文章前60個交易間隔，長榮已漲40.67%，同業平均漲68.21%。這表示作者是在產業行情已展開後，尋找長榮相對落後及後續獲利的空間。文章發表前的價格位置，必須和發表後的變化一起看。", "把證據順序接好：當期新聞有運價與供給瓶頸，多家航商收入及利潤改善，族群價格又共同上漲。這幾項彼此對得上，支持航運共同景氣是重要解釋。長榮之後額外相對同業的表現，則再拆航線、成本、財務與交易因素。", "因此，ECB假說的驗證還要另外核借券流量、轉換與相對估值。產業改善的證據、長榮相對表現、特定賣方交易，各有對應資料；按這個順序看，就能避免把整段行情全部歸給單一訊息。"], "calculations": [{"title": "將大盤與同業放在同一比較期間", "formula": "長榮74.64% − 大盤20.40%＝54.24個百分點\n長榮74.64% − 指定同業平均69.11%\n＝ 5.53個百分點", "meaning": "沿用既有2020/11/17收盤至2021/02/19的還原報酬比較；用來區分市場、產業與公司的價格變化。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}]}, {"key": "march-update", "sort_date": "2021-03-11", "sort_order": 50, "date_context": "2021年3月11日 22:41：作者轉用陽明研究產業", "heading": "運價回落後，他重算全年，為何把資金轉向陽明？", "text": "3月11日，作者轉以陽明研究同一波航運景氣。SCFI由2875回到2721，他先承認淡季回落，再引用台驊董事長顏益財訪談，檢查供需是否有足以延續高價的變化。研究的問題因此改成：即使後面報價下降，全年還能賺多少？他先比陽明11、12月營收約152.7、168.7億元，稅後利潤約27.05、50億元。收入多約16億元，利潤卻多約23億元，他由此假設新增收入多來自漲價，新增 EPS的順序", "formula": "1月：35.8億元 ×（1 − 20%）＝ 28.64億元\n28.64億元 ÷ 約32.6億股 ≈ 0.879元\n12月EPS1.64 ＋ 約0.88 ＝ 1月估2.52元\n2月：39.6億元 ×（1 − 20%）＝ 31.68億元\n31.68億元 ÷ 約32.6億股 ≈ 0.972元\n1.64 ＋ 約0.97 ＝ 2月估2.61元", "meaning": "新增收入大致等於新增稅前利潤、稅20%採作者假設；約32.6億股為編者反推近似分母。1月後來自結2.32，比這次估計低0.20元。"}, {"title": "獲利情境，如何接回當時股價", "formula": "28.1元 ÷ 預估EPS14.5 ≈ 1.94倍\n28.1元 ÷ 預估年底淨值24.9 ≈ 1.13倍", "meaning": "原文以近似值列PE1.93倍、PB1.13倍；這裡按所列輸入重算。"}], "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [2]}, {"type": "paragraphs", "indices": [5]}, {"type": "table", "index": 0}]}, {"key": "may-update", "sort_date": "2021-05-06", "sort_order": 50, "date_context": "2021年5月6日 22:21：作者再上修產業情境", "heading": "運價比原估強，他逐項改假設，再查市場願意付幾倍", "text": "5月6日，作者回頭檢查3月情境，發現淡季降價幅度較小、止跌回升較快，SCFI已到3100。他列1至4月均值2871、2840、2627、2829，顯示原先預想第二季明顯降價的環境已有變化，未來季度的輸入要重設。他又列陽明1月自結EPS2.32元、3月2.43元，判斷第一季約7元的方向大致成立。對照3月曾估1月2.52元，單月估計高了0.20元。這一項落差回查成本、業外與稅；後續運價比原估強，則另用來改第二季之後的獲利。他把全年分成三條路徑：悲觀情境讓第二、三季指數在2600至2900，第四季降到1300至1400，全年EPS22至23.5；中立27至29；樂觀30至33.5。下表逐季保留，方便下一期資料出現時，辨認原先走的是哪一條。再處理模型外的增減項。原文估陽明換約後完整一年可增加3.5至4.5元EPS，5月生效、約6月起反映營收。若全年效果按月份平均攤，2021的6至12月占7/12，算出2.04至2.63元，對上作者列的約2至2.6元。全年與本年使用不同期間，差別就在這7個月。作者另估燃油成本比去年增加約1.5元EPS，並預留油價繼續上漲的空間，所以簡化為長約收益和燃油增支互抵。若只扣已列1.5元，長約還剩約0.54至1.13元；他把這個餘額也留給額外成本風險。這就是三條全年情境沒有再加上全部換約收益的理由。稅與股數再各算一次。原文預想過往虧損的扣抵可能把獲利提高10%至20%，現金增資使股數增加約9%、單股獲利稀釋約8.3%。若兩項同時成立，原EPS乘1.10至1.20再除1.09，結果約比原估高0.9%至10.1%；若獲利總額維持原估，只有股數增加，EPS則成為原來約91.7%。稅的改善幅度採作者情境，實際財報仍要核所得稅費用與遞延稅資產。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "verification_steps": [22], "lane": "判斷", "table": {"title": "5月6日作者的陽明EPS情境：把每季輸入攤開", "columns": ["情境", "Q1", "Q2", "Q3", "Q4", "全年"], "rows": [["悲觀", "7", "6.5–7", "7–7.5", "1.5–2", "22–23.5"], [ ext": "2021年5月6日：陽明增資、稅負與財務假設", "heading": "增資稀釋EPS，作者為何仍認為財務條件改善", "paragraphs": ["作者對陽明現金增資先看股份：預計發30萬張、即3億股，約增加9%，所以獲利總額固定時，EPS變成原來1/1.09，減少約8.3%。但公司也會收到現金，他接著評估資產負債表能改善多少。", "他當時估募得230至240億元，主張每股淨值增加約6至7元。若由增股9%反推原股數約33.33億股，230至240億除下去，每原有一股新增現金約6.9至7.2元，可以理解他估計的量級。精確的每股淨值則要把新增3億股一起放進分母。", "沿他的其他估計示範，2020年底淨值11.26元加第一季預估7元，先以18.26元作增資前起點；按上述股數和募資額，增資後淨值約23.08至23.36元，增加約4.82至5.10元。這是補算的條件情境，原文6至7元仍保留為作者估計。", "原文還說承銷價可能按市價九二折，股東權益影響約0.72%。其近似算式是新增股9%乘折價8%；若按增資後股數計算，未認購股東的每股理論價格攤薄約0.66%。實際條件還看承銷價、認購權與發行股數。", "作者再往後想：若7、8月承銷時股價提高，而發行股數一樣，公司就可能募到更多現金。因此他同時保留EPS被稀釋和財務資源增加兩種影響，再與他預想的所得稅改善放在一起估整體結果。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "verification_steps": [41], "lane": "判斷", "calculations": [{"title": "新增現金和每股淨值，分別怎麼算", "formula": "原股數近似值：新增3億股 ÷ 9%≈33.333億股\n每原有一股新增現金：230～240億 ÷ 33.333億\n≈6.90～7.20元\n增資後淨值＝（原淨值×原股數＋募資）÷新總股數\n若增資前18.26元：\n（18.26×33.333＋230～240）÷36.333\n≈23.08～23.36元，約增加4.82～5.10元", "meaning": "補算情境：18.26由原文2020年底11.26與Q1預估7相加；發行費用及其他權益變化先維持原狀。"}, {"title": "0.72%近似值與增資後分母", "formula": "作者近似：9%增股 × 8%折價＝0.72%\n用增資後股數：8% × 9% ÷ 1.09≈0.66%", "meaning": "以折價發行與未參與認購的每股理論攤薄作示範；認購權價值和實際發行條件另影響原股東結果。"}], "text": "作者對陽明現金增資先看股份：預計發30萬張、即3億股，約增加9%，所以獲利總額固定時，EPS變成原來1/1.09，減少約8.3%。但公司也會收到現金，他接著評估資產負債表能改善多少。他當時估募得230至240億元，主張每股淨值增加約6至7元。若由增股9%反推原股數約33.33億股，230至240億除下去，每原有一股新增現金約6.9至7.2元，可以理解他估計的量級。精確的每股淨值則要把新增3億股一起放進分母。沿他的其他估計示範，2020年底淨值11.26元加第一季預估7元，先以18.26元作增資前起點；按上述股數和募資額，增資後淨值約23.08至23.36元，增加約4.82至5.10元。這是補算的條件情境，原文6至7元仍保留為作者估計。原文還說承銷價可能按市價九二折，股東權益影響約0.72%。其近似算式是新增股9%乘折價8%；若按增資後股數計算，未認購股東的每股理論價格攤薄約0.66%。實際條件還看承銷價、認購權與發行股數。作者再往後想：若7、8月承銷時股價提高，而發行股數一樣，公司就可能募到更多現金。因此他同時保留EPS被稀釋和財務資源增加兩種影響，再與他預想的所得稅改善放在一起估整體結果。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [4]}]}, {"key": "may-valuation", "sort_date": "2021-05-06", "sort_order": 60, "date_context": "2021年5月6日：作者以CMoney研究二十年估值", "heading": "獲利估出來之後，他怎麼查市場可能給幾倍？", "paragraphs": ["作者接著問：公司大賺，市場仍可能只給2.5至3倍，怎麼支持更高價格？他因此用CMoney「選股勝利組」整理2001至2020年資料，先剔除近一年平均日量低於200張的股票，再用營業利益率、稅率與稅後淨利率，調整出他採用的本業EPS。", "調整的動機，是先降低賣資產等一次性損益對比較的影響。他再以當年最高股價除以調整後EPS，按年整理低倍數公司，並另外看EPS大於15元的組別。原文連到20個頁籤的Excel，這是他估值觀察所稱的資料底稿。", "他還給達爾膚作實算：實際EPS14.69元、營業利益率31%、稅後淨利率86.5%；以20%稅率調整，14.69乘31%乘80%再除86.5%，得到本業EPS約4.21元。原文稱大部分差額來自出售子公司，這一步用來降低一次性處分利益對估值比較的影響。", "依他自行整理的結果，先提出本業高獲利公司年內高點常可到約4倍以上；再把配息率達五成的公司挑出，主張通常可到6倍以上。他又查陽明過去獲利好時的配息，預期這次也有較高配息，因而採中立EPS27至29元乘6倍，估162至174元。", "原文也列例外，包括日勝生的訴訟可能使已認列利益流失，以及隆大、日勝生等個案在隔年公布年報與股利後才上漲。作者因此也在判斷獲利能留下多少、何時配出，以及市場需要等到哪一個公告。二十年統計與例外篩選採他在文章裡提出的研究結果。", "這套推論衡量的是歷史一年內曾出現的估值，再將它外推為未來目標。檢查這項外推時，先記下決策日已知的EPS預估與買價、固定觀察期限，再對後來公布的EPS、配息和價格，查看多久兌現、途中承受多少波動。作者選的6倍和9倍，因此各是一項要在後續繼續驗證的價格情境。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF", "https://reurl.cc/ZQmMeA"], "verification_steps": [29], "lane": "判斷", "calculations": [{"title": "作者如何調整本業EPS，再推到估值情境", "formula": "當營業利益率 ×（1 − 稅率）低於稅後淨利率：\n調整EPS ＝ 實際EPS ×〔營業利益率 ×（1 − 稅率）÷ 稅後淨利率〕\n其餘依原文規則採實際EPS\n歷史比較倍數 ＝ 當年最高股價 ÷ 作者調整後EPS\n目標情境 ＝ 中立EPS27～29 × 假設6倍 ＝ 162～174元", "meaning": "作者先調整出本業EPS，再用歷史高價倍數與配息條件，推估當年的價格空間。"}, {"title": "作者用達爾膚示範，為何14.69元要改看4.21元", "formula": "14.69 ×〔31% ×（1−20%）÷86.5%〕\n≈4.21元本業EPS", "meaning": "數字和方法採作者原文示例，目的為調整其認為主要來自業外的獲利。"}], "text": "作者接著問：公司大賺，市場仍可能只給2.5至3倍，怎麼支持更高價格？他因此用CMoney「選股勝利組」整理2001至2020年資料，先剔除近一年平均日量低於200張的股票，再用營業利益率、稅率與稅後淨利率，調整出他採用的本業EPS。調整的動機，是先降低賣資產等一次性損益對比較的影響。他再以當年最高股價除以調整後EPS，按年整理低倍數公司，並另外看EPS大於15元的組別。原文連到20個頁籤的Excel，這是他估值觀察所稱的資料底稿。他還給達爾膚作實算：實際EPS14.69元、營業利益率31%、稅後淨利率86.5%；以20%稅率調整，14.69乘31%乘80%再除86.5%，得到本業EPS約4.21元。原文稱大部分差額來自出售子公司，這一步用來降低一次性處分利益對估值比較的影響。依他自行整理的結果，先提出本業高獲利公司年內高點常可到約4倍以上；再把配息率達五成的公司挑出，主張通常可到6倍以上。他又查陽明過去獲利好時的配息，預期這次也有較高配息，因而採中立EPS27至29元乘6倍，估162至174元。原文也列例外，包括日勝生的訴訟可能使已認列利益流失，以及隆大、日勝生等個案在隔年公布年報與股利後才上漲。作者因此也在判斷獲利能留下多少、何時配出，以及市場需要等到哪一個公告。二十年統計與例外篩選採他在文章裡提出的研究結果。這套推論衡量的是歷史一年內曾出現的估值，再將它外推為未來目標。檢查這項外推時，先記下決策日已知的EPS預估與買價、固定觀察期限，再對後來公布的EPS、配息和價格，查看多久兌現、途中承受多少波動。作者選的6倍和9倍，因此各是一項要在後續繼續驗證的價格情境。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "calculations", "indices": [1]}, {"type": "paragraphs", "indices": [3]}, {"type": "calculations", "indices": [0]}, {"type": "paragraphs", "indices": [4]}, {"type": "paragraphs", "indices": [5]}]}, {"key": "may-pb-pe", "sort_date": "2021-05-06", "sort_order": 65, "date_context": "2021年5月6日：作者比較本益比與股價淨值比", "heading": "他為何改看PE：把同一組高獲利股票的兩種估值放在一起", "paragraphs": ["作者以前也參考PB，這次卻想檢查，過去兩倍PB的高點是不是適合拿來限制今年股價。他先挑2020年本業EPS超過15元的一組股票，比較它們在年內高點的PE和PB。", "依他的整理，這組PE由9.26到20.69倍，高低約差2.23倍；PB卻由0.98到10.55倍，高低約差10.8倍。他因此認為，在這組獲利爆發股裡，EPS對價格的解釋比較集中。這是他的估值研究解讀。", "他再舉恆大、申豐：獲利爆發後，年內高價對應PB可到五倍左右，明顯高於過去較平穩年份。若公司能賺的錢大幅增加，只沿用舊PB上限，就可能低估這種變化。", "海運也被他拿來檢查。過去好年景每股約賺4至5元、淨值約15至20元，配上當時PE後，股價高點常落30至45元，回頭除以淨值就容易看到兩倍上下PB。他的主張是，這個舊比例可能反映過去的獲利規模，應先重算今年EPS再選倍數。", "他又用三家去年的數字比較：陽明不配息、PE約7.13倍，低於長榮8.84和萬海11.27倍，但PB反而高於長榮。作者將這個差異接到配息和獲利評價，認為用PE較能說明他觀察到的價格排序。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "verification_steps": [42], "lane": "判斷", "calculations": [{"title": "同一組股票，他怎麼比較兩種倍數的分散程度", "formula": "PE區間高低比＝20.69 ÷ 9.26≈2.23\nPB區間高低比＝10.55 ÷ 0.98≈10.77\n長榮：44.75 ÷ EPS5.06≈8.84倍PE\n長榮：44.75 ÷ 淨值19.25≈2.32倍PB", "meaning": "原文把2021/01/04高價納入對2020年獲利的比較。這組歷史數字用來理解作者選估值方法的過程。"}], "table": {"title": "作者用相同價格，對照EPS與淨值：當時文章列值", "columns": ["公司", "2021/01/04高價", "2020 EPS", "2020年底淨值", "PE", "PB"], "rows": [["陽明", "32.15", "4.51", "11.26", "7.13", "2.86"], ["長榮", "44.75", "5.06", "19.25", "8.84", "2.32"], ["萬海", "57.50", "5.10", "19.79", "11.27", "2.90"]]}, "text": "作者以前也參考PB，這次卻想檢查，過去兩倍PB的高點是不是適合拿來限制今年股價。他先挑2020年本業EPS超過15元的一組股票，比較它們在年內高點的PE和PB。依他的整理，這組PE由9.26到20.69倍，高低約差2.23倍；PB卻由0.98到10.55倍，高低約差10.8倍。他因此認為，在這組獲利爆發股裡，EPS對價格的解釋比較集中。這是他的估值研究解讀。他再舉恆大、申豐：獲利爆發後，年內高價對應PB可到五倍左右，明顯高於過去較平穩年份。若公司能賺的錢大幅增加，只沿用舊PB上限，就可能低估這種變化。海運也被他拿來檢查。過去好年景每股約賺4至5元、淨值約15至20元，配上當時PE後，股價高點常落30至45元，回頭除以淨值就容易看到兩倍上下PB。他的主張是，這個舊比例可能反映過去的獲利規模，應先重算今年EPS再選倍數。他又用三家去年的數字比較：陽明不配息、PE約7.13倍，低於長榮8.84和萬海11.27倍，但PB反而高於長榮。作者將這個差異接到配息和獲利評價，認為用PE較能說明他觀察到的價格排序。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [0]}, {"type": "table", "index": 0}]}, {"key": "may-nine-times", "sort_date": "2021-05-06", "sort_order": 70, "date_context": "2021年5月6日：6倍目標之外的9倍情境", "heading": "9倍從哪裡來：高EPS分組、進入門檻與獲利持續時間", "paragraphs": ["6倍之外，作者再看本業EPS超過15元的歷史組別，認為年內高點多在9倍以上；他列2013年長虹約7.6倍為例外，並解釋配息率只有三成多。因此，正常配息和高額本業獲利一起出現，是他設想較高倍數的條件。", "他也比較供給反應。口罩缺貨時，其他產業公司可以投入生產；航運則需要龐大資金、船舶與交付時間。他認為運價高時新增競爭供給較慢，便有理由繼續研究高獲利能維持多久。", "若只賺一年，9倍是他想像的年內高點情境；若高運價能維持兩年以上，他認為市場可能把高EPS看成較有持續性的水準，估值意義也會改變。這項判斷依賴後面幾季的運價、需求和新運力，所以他仍將運價提前大跌列為要下修的條件。", "他還用面板股作資金環境比較：原文稱2017年低倍數約4.5倍，2021年按當時法人預估已到7至8倍，據此認為資金對循環股的接受度提高。再加上預期指數納入和法人上修，他認為海運仍可能有更高評價。", "把中立EPS27至29元乘9，可補算成243至261元情境；作者正式列出的至少目標仍是乘6得到162至174元。前者用來看倍數若上調，價格空間如何改變，持有決策仍須隨新EPS與市場價格更新。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "verification_steps": [43], "lane": "判斷", "calculations": [{"title": "同一個獲利估計，換倍數會差多少", "formula": "作者明列：EPS27～29 × 6＝162～174元\n依9倍觀點補算：27～29 × 9＝243～261元\n倍數由6到9，在EPS固定時價格情境增加50%", "meaning": "9倍為作者較積極的估值觀點；243–261為將其觀點乘開的條件情境。"}], "text": "6倍之外，作者再看本業EPS超過15元的歷史組別，認為年內高點多在9倍以上；他列2013年長虹約7.6倍為例外，並解釋配息率只有三成多。因此，正常配息和高額本業獲利一起出現，是他設想較高倍數的條件。他也比較供給反應。口罩缺貨時，其他產業公司可以投入生產；航運則需要龐大資金、船舶與交付時間。他認為運價高時新增競爭供給較慢，便有理由繼續研究高獲利能維持多久。若只賺一年，9倍是他想像的年內高點情境；若高運價能維持兩年以上，他認為市場可能把高EPS看成較有持續性的水準，估值意義也會改變。這項判斷依賴後面幾季的運價、需求和新運力，所以他仍將運價提前大跌列為要下修的條件。他還用面板股作資金環境比較：原文稱2017年低倍數約4.5倍，2021年按當時法人預估已到7至8倍，據此認為資金對循環股的接受度提高。再加上預期指數納入和法人上修，他認為海運仍可能有更高評價。把中立EPS27至29元乘9，可補算成243至261元情境；作者正式列出的至少目標仍是乘6得到162至174元。前者用來看倍數若上調，價格空間如何改變，持有決策仍須隨新EPS與市場價格更新。", "reading_blocks": [{"type": "paragraphs", "indices": [0]}, {"type": "paragraphs", "indices": [1]}, {"type": "paragraphs", "indices": [2]}, {"type": "paragraphs", "indices": [3]}, {"type": "paragraphs", "indices": [4]}, {"type": "calculations", "indices": [0]}]}, {"key": "may-catalysts", "sort_date": "2021-05-06", "sort_order": 80, "date_context": "2021年5月6日：作者把估值情境接到資金與後續更新", "heading": "他預想誰會重新買進，以及哪些新資料會讓目標價改變", "paragraphs": ["他同時預想可能帶來新買盤的時間點：原文推測海運市值提高後，5、6月可能納入MSCI或台灣50。因果是若進入指數，追蹤該指數的資金需按權重調整部位，可能增加股票需求。這在當時屬待公告與持股變化檢查的預測。", "另一個觀察是他引述4月19日JPM長榮報告，稱其EPS約10元、採10倍PE、目標101元。作者雖不同意其獲利估計，卻把「機構已願用10倍」視為估值可能改變的線索：如果後來機構上修EPS、倍數仍高，就可能提高目標並帶來新買盤。這組數字採作者當時的引述，呈現他如何從機構報告推想後續買盤。", "他最後把更新條件寫清：運價續創高、第四季降幅小於預估，會上修EPS；稅費與配息改變，也會改獲利或倍數；運價較早大跌則下修。持有理由因而接成「新獲利高於原估、估值方式可能改變、資金可能增加」，每一條都留下後續能對答案的資料。", "在操作上，他同日自述持有23,590張陽明、約19.8億元市值並持續加碼，也會做短線價差。短線賣出某個帳戶，可能同時搭配另一帳戶買進；他因此用合計波段部位是否增加描述長期決策。這份披露讓3月轉向陽明之後的部位路徑，接到5月仍在擴大持有。"], "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF", "https://speakerdeck.com/robertshih/jpm-report-2603"], "verification_steps": [30], "lane": "判斷", "text": "他同時預想可能帶來新買盤的時間點：原文推測海運市值提高後，5、6月可能納入MSCI或台灣50。因果是若進入指數，追蹤該指數的資金需按權重調整部位，可能增加股票需求。這在當時屬待公告與持股變化檢查的預測。另一個觀察是他引述4月19日JPM長榮報告，稱其EPS約10元、採10倍PE、目標101元。作者雖不同意其獲利估計，卻把「機構已願用10倍」視為估值可能改變的線索：如果後來機構上修EPS、倍數仍高，就可能提高目標並帶來新買盤。這組數字採作者當時的引述，呈現他如何從機構報告推想後續買盤。他最後把更新條件寫清：運價續創高、第四季降幅小於預估，會上修EPS；稅費與配息改變，也會改獲利或倍數；運價較早大跌則下修。持有理由因而接成「新獲利高於原估、估值方式可能改變、資金可能增加」，每一條都留下後續能對答案的資料。在操作上，他同日自述持有23,590張陽明、約19.8億元市值並持續加碼，也會做短線價差。短線賣出某個帳戶，可能同時搭配另一帳戶買進；他因此用合計波段部位是否增加描述長期決策。這份披露讓3月轉向陽明之後的部位路徑，接到5月仍在擴大持有。"}, {"key": "ecb-complete", "sort_date": "2021-07-01", "sort_order": 5, "date_context": "2021年7月1日18:57:40：長榮透過SGX公告", "heading": "把ECB追到後來：已全數轉換，賣單期間仍逐日核對", "paragraphs": ["7月1日晚間，長榮在新加坡交易所公告，經此前提前贖回安排後，這批ECB已全數轉換，7月1日已無流通在外餘額，並將從SGX下市。這是後來核到的公司資料，放回它實際公布的日期。", "它讓11月的假說得到一個明確後續狀態：潛在轉股量有上限，而這批債券到7月1日已完成轉換。公司債轉為股權後，原債務減少、股份增加，所以估每股獲利時也要更新股數。", "要評估作者的一至兩個月估計，仍須回到11月至翌年1月的逐日賣出與還券。原因是持有人可能早先借券賣出，轉股後只是交股還券；另一名持有人則可能轉股後才賣。公告核的是債券當時已全轉，市場供給何時發生，沿交易紀錄另追。"], "refs": ["https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546", "https://wwwc.twse.com.tw/zh/products/sbl/download/edu-info16.pdf", "https://links.sgx.com/1.0.0/corporate-announcements/90JS5329MGPV2XYG/93849ad870c9107c36d456f7fa8eb8420bdb2d84d6f30d0a2da96da7cdda47a6"], "verification_steps": [28], "lane": "營運", "text": "7月1日晚間，長榮在新加坡交易所公告，經此前提前贖回安排後，這批ECB已全數轉換，7月1日已無流通在外餘額，並將從SGX下市。這是後來核到的公司資料，放回它實際公布的日期。它讓11月的假說得到一個明確後續狀態：潛在轉股量有上限，而這批債券到7月1日已完成轉換。公司債轉為股權後，原債務減少、股份增加，所以估每股獲利時也要更新股數。要評估作者的一至兩個月估計，仍須回到11月至翌年1月的逐日賣出與還券。原因是持有人可能早先借券賣出，轉股後只是交股還券；另一名持有人則可能轉股後才賣。公告核的是債券當時已全轉，市場供給何時發生，沿交易紀錄另追。"}, {"date_context": "2021年3月至7月6日高點／7月底回落", "heading": "趨勢後段加速：把上漲幅度與作者交易分別接回時間", "text": "後面的行情繼續加速。長榮3月底收45.5元、4月底79元、6月底197元；4月還原漲幅73.63%，6月99.80%，7月6日到224元收盤高點。這段較長區間採文章後首個交易日收盤為基準：從2020年11月18日22.5元算到2021年7月6日，相隔230個曆日、151個交易間隔，還原漲幅895.56%。把判斷接回這段價格，能看到持續更新的過程：11月由第三季獲利估全年，12月因新運價上修；營收落差出現就問公司查船期；3月把回落放進全年；5月因回落比原估小、回升更快，再改獲利和估值情境。每次提高獲利預估，都要說清楚是運價、貨量還是成本改變了。這段行情裡，運價上漲、營收增加、利潤放大和研究預估上修依序出現，多家航商也共同上漲。長榮自己的漲幅還要和同業相比，才能進一步看它的航線、新船、估值差與交易供給帶來多少額外變化。到7月底收132元，當月還原下跌32.99%。作者前一年已部分減碼，之後又回補、轉移部位，所以行情高點與他的實際績效分別記錄。完整週期要同時看他何時更新判斷、當時承擔多少，以及市場後來走到哪裡。", "refs": [], "verification_steps": [10], "key": "original-14", "sort_date": "2021-07-06", "sort_order": 140, "paragraphs": ["後面的行情繼續加速。長榮3月底收45.5元、4月底79元、6月底197元；4月還原漲幅73.63%，6月99.80%，7月6日到224元收盤高點。這段較長區間採文章後首個交易日收盤為基準：從2020年11月18日22.5元算到2021年7月6日，相隔230個曆日、151個交易間隔，還原漲幅895.56%。", "把判斷接回這段價格，能看到持續更新的過程：11月由第三季獲利估全年，12月因新運價上修；營收落差出現就問公司查船期；3月把回落放進全年；5月因回落比原估小、回升更快，再改獲利和估值情境。每次提高獲利預估，都要說清楚是運價、貨量還是成本改變了。", "這段行情裡，運價上漲、營收增加、利潤放大和研究預估上修依序出現，多家航商也共同上漲。長榮自己的漲幅還要和同業相比，才能進一步看它的航線、新船、估值差與交易供給帶來多少額外變化。", "到7月底收132元，當月還原下跌32.99%。作者前一年已部分減碼，之後又回補、轉移部位，所以行情高點與他的實際績效分別記錄。完整週期要同時看他何時更新判斷、當時承擔多少，以及市場後來走到哪裡。"]}, {"key": "annual-2021", "sort_date": "2022-01-02", "sort_order": 50, "date_context": "2022年1月2日 23:18部落格／23:59論壇", "heading": "年度回顧交代後段：下半年降低部位，也減少出手", "text": "2022年1月2日，作者年度回顧說，2021下半年行情轉冷後，調整整體部位與交易頻率，年底以輕部位等待下一個機會。他也停止部分容量小、預期收益較弱或需高度專注的策略。這段
