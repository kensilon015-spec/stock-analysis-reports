的獲利基準便可能不同。研究因此要從「這季轉盈」往前問：哪項改善還在發生，能持續到什麼時候？當時能接著追的是新運價、實際貨量和下一期營收。若報價維持、貨量和利潤也持續增加，轉盈就更可能延續。到11月，robertshih開始公開寫出選股、估值和持有理由。", "refs": ["https://www.cna.com.tw/news/firstnews/202008140050.aspx"], "story_index": 0}, {"date": "2020-08-31", "lane": "市場", "title": "本月還原漲跌 +58.18%", "detail": "2020-08-31月末觀測：本月供應商還原收盤變動+58.18%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2020-09-30", "lane": "市場", "title": "本月還原漲跌 -8.91%", "detail": "2020-09-30月末觀測：本月供應商還原收盤變動-8.91%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2020-09-30", "precision": "day", "date_label": "2020年9月22日文件／9月29日發行交付／9月30日SGX頁面更新", "lane": "營運", "title": "ECB發行：3億美元、轉換價18.2元", "detail": "這批債券的條款在9月已公開。長榮發行3億美元海外可轉債；9月22日的發行文件列初始轉換價18.2元、固定換算匯率每美元28.9910元，9月29日發行交付，9月30日新加坡交易所頁面更新；條款寫明2020年12月29日起開始接受轉股。", "refs": ["https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546"], "story_index": 5, "detail_only": true}, {"date": "2020-09-30", "precision": "day", "date_label": "2020年8月至9月", "lane": "市場", "title": "市場已開始反映，也經歷回檔", "detail": "股價在作者發文前已經動起來。保存的日價顯示，7月31日收11元，8月31日收17.4元，8月還原漲幅58.18%；9月底回到15.85元，當月下跌8.91%。8月14日新聞刊出時，也已記長榮攻上13.55元漲停。所以到了後面研究長榮時，必須把兩件事接起來：市場已經交易過轉盈與運價回升，投資機會要來自後續仍可能增加、而當時價格尚未充分計入的獲利。單憑「公司比去年好」還少一步，還要估今年與明年多賺多少，再和買價相比。所以他11月面對的問題是：前面已漲過一段，眼前運價、換約與獲利還能比市場原先預期多多少？只有把這段增量算出來，再和當時股價相比，才知道剩下的機會。", "refs": ["https://www.cna.com.tw/news/firstnews/202008140050.aspx"], "story_index": 1}, {"date": "2020-10-26", "precision": "day", "date_label": "2020年10月26日 14:16", "lane": "資訊", "title": "新報價與供給瓶頸，讓延續假說有了依據", "detail": "10月26日，中央社報導ONE將自11月1日起每大箱加收300美元，並列美西運價3,865美元、美東4,625美元。新聞接著解釋零售商補庫存、港口缺工、缺櫃與缺船的情況。把它們接起來，因果就比較清楚：貨主需要運貨，但船與櫃周轉受阻，能及時提供的運輸服務增加得慢，船公司因此有機會提高報價。看到這些消息，就有理由繼續追「高運價能維持多久」。要算長榮能多賺多少，還要看它跑哪些航線、多少生意使用舊長約，以及新報價何時進入營收。後面作者確實沿著這幾個問題，逐步把產業消息接到估值。往獲利推時，中間需要接三個環節。先看需求增加與周轉受阻是否仍在，判斷報價有沒有延續條件；再查長榮自己的航線與合約，估哪些貨量能採新價；最後比較多收的運費與新增塞港、租船、燃油等成本。前兩項決定收入能增多少，最後一項決定增加的收入能留下多少。10月的新聞提供供需與報價線索。到了11月，作者拿第三季獲利、長約與航程，把產業改善接到長榮能多賺多少，再估當時價格還留下多少空間。", "refs": ["https://www.cna.com.tw/news/afe/202010260132.aspx"], "story_index": 2}, {"date": "2020-10-30", "lane": "市場", "title": "本月還原漲跌 +19.24%", "detail": "2020-10-30月末觀測：本月供應商還原收盤變動+19.24%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2020-11-17", "precision": "day", "date_label": "2020年11月17日 22:09:17", "lane": "判斷", "title": "作者怎麼估下一季：先把已公布數字與前方報價並排", "detail": "11月17日晚上，robertshih先列第三季EPS1.7元、前三季累計2.27元，以及10月營收創當年新高；再把它們和持續上升的SCFI運價放在一起。他先找一個已公布、可作起點的獲利水準，再判斷下一季遇到的價格條件是否更有利。推論順序是：第三季在較早的運價環境下已賺1.7元；眼前運價繼續高於那個環境，10月營收也仍強。若貨量、成本與合約沒有出現足以抵銷漲價的變化，第四季就有機會至少維持第三季水準。這是他選擇用1.7元作下一季起估值的原因。他把前三季2.27元加上假設的第四季1.7元，得到3.97元，文中進一步判斷全年超過4元。這筆估計讓讀者能追到輸入：已公布部分是2.27，向前看的部分是第四季能否維持。之後新資料出來，應先改這個輸入，再改全年獲利。這個估計最先等到的是下一季營收和獲利。12月新運價再漲，他上修第四季；11月營收卻月減時，他又回頭問公司、查船期，檢查原先的獲利推論是否仍站得住腳。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "story_index": 3}, {"date": "2020-11-17", "precision": "day", "date_label": "2020年11月17日 同一篇文章", "lane": "判斷", "title": "作者為什麼選長榮：同族群比較後，找出便宜與賣壓的解釋", "detail": "有了全年獲利估計，作者才和價格比較。他用長榮21元、全年EPS約4元、每股淨值16.68元，算出約5.2倍本益比（PE）、1.26倍股價淨值比（PB）；同文列陽明約7倍與1.69倍、萬海約12.5倍與2倍。各公司的全年獲利採作者當時預估。他先提出一個相對比較：三家都受惠運價上升，按他的獲利估計，長榮的價格倍數卻較低。若公司差異足以解釋折價，便宜可以持續；若其中一部分折價來自暫時性的賣單，等賣單消化後，價格就可能靠近同族群的評價。接下來需要找到造成價差的具體原因。作者列了股本較大與海外可轉換公司債（ECB）兩個解釋，並把重點放在近期增加的借券賣出餘額。他的完整投資主張因而有兩條線：運價與換約使獲利往上，交易性賣壓可能使當時價格暫時跟不上。下面分別追這批債券怎麼連到股票賣單，以及他如何估賣壓的數量和時間。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "story_index": 4}, {"date": "2020-11-17", "precision": "day", "date_label": "2020年11月17日：作者的ECB推論，連回9月發行條款", "lane": "判斷", "title": "作者為何判斷ECB賣壓壓住股價，又怎麼估消化時間？", "detail": "作者觀察長榮近兩個月借券賣出餘額增加，推測主要是持有ECB的外資做動態套利。他文中採21元股價，和18.2元轉換價相差2.8元，讓債券換股權與股票市價之間的關係值得研究；持有人可以一邊保留換股權，一邊在股票市場安排價差與避險部位。作者把3億美元ECB換成40至50萬張潛在股票，再和長榮日均成交10至20萬張相比，估套利賣壓一至兩個月可以消化。他的投資理由是：公司獲利持續改善，眼前壓價的賣方若有有限的部位，賣完之後，長榮就有機會回到較接近同業的評價。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384", "https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546", "https://wwwc.twse.com.tw/zh/products/sbl/download/edu-info16.pdf"], "story_index": 5, "detail_only": true}, {"date": "2020-11-17", "precision": "day", "date_label": "2020年11月17日 同一篇文章", "lane": "判斷", "title": "他把持有理由寫成條件：舊長約重簽，並追蹤運價是否反轉", "detail": "作者接著往2021年推：既然眼前運價已高，為什麼收入還沒完全跟上？他認為一部分客戶仍使用較早簽下的低價長約，所以目前獲利還受舊價限制。等舊約到期、按較高運價重簽，同一批合約貨量便可能增加收入，形成第二段獲利改善。這個推論需要兩組資料一起成立：現貨高價能維持到換約時，且新約價差乘上適用貨量後，仍足以超過新增成本。他因此把券商次年EPS5至6元的預估接進來。後續應追換約價格、適用箱量、生效月份與成本，才能檢查改善究竟有多大。價格方面，他以全年EPS4元、假設配息六成得到2.4元，再用10%、8%、6%的殖利率情境倒算24、30、40元。這是把「公司可能賺到」接到「投資人願意付多少」，配息與市場要求的報酬各有一項假設。他也翻過去二十年長榮獲利較好的年份，比較EPS與年內股價高點，認為本次約4元的獲利可支持三字頭價格。這是另一條歷史估值參照；那些年份的成本、配息與資金環境，還要和眼前條件一起比。把他的歷史比較再算開，今年若賺4元，股價30元相當於7.5倍PE；他列出的2004、2005、2007等獲利好年份，高價約對應7至10倍。作者因此認為三字頭有歷史參照，又把當時資金寬鬆放進價格空間的判斷。下表保留他原文數字，倍數按同一列驗算。文章最後將持有條件接回運價：高檔持續，就追實收與獲利能否兌現；若運價大跌且走成趨勢，則重新判斷。這讓研究從一次目標價，變成可隨新資料更新的持有理由：換約提高獲利、交易賣壓可能減輕、當時價格仍留有空間。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "story_index": 6}, {"date": "2020-11-30", "lane": "市場", "title": "本月還原漲跌 +30.69%", "detail": "2020-11-30月末觀測：本月供應商還原收盤變動+30.69%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2020-12-07", "precision": "day", "date_label": "2020年12月7日 21:45:38", "lane": "判斷", "title": "先上修第四季，再算2020年底淨值", "detail": "12月7日，作者先更新自己的核心輸入。他把第二季SCFI平均895、EPS0.66，與第三季1182、EPS1.7並排；眼前指數已到2129，他估第四季均值至少1700。原先只按第三季1.7元估第四季，現在遇到更高的報價，獲利假設就需要上修。他用已公布季度作比較：SCFI從895到1182，約漲32%；EPS從0.66到1.70，多了1.04元。船公司的部分成本在短期內較固定，漲價多收的錢可以使利潤增加得更快；實際幅度還受貨量、航線、合約及燃油影響。這個比較讓他相信獲利有上修空間。他因此把第四季EPS抓2.5至3元，前三季2.27元加上去，全年變成4.77至5.27元。這個2.5至3元是作者參考運價、已公布獲利及宏遠研究給的估計區間；原文沒有列逐航線箱量、費用和稅率的完整季度試算。可直接驗算的，是全年加總，以及他比前文1.7元提高了多少。他又把航線分開看：先前東南亞強勢，萬海也有表現；當時東南亞漲勢休息，但長榮主要經營的美國與歐洲線仍強。這讓他判斷要追的是長榮自己的航線報價，族群總指數之外，營收結構同樣重要。新的獲利估計接著影響年底淨值：第三季每股淨值16.68元，加假設第四季賺2.5至3元，得到19.18至19.68元。這一步把當季獲利留在公司、其他權益變化先維持原狀，接著才往下一年的長約和估值推。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"], "story_index": 7}, {"date": "2020-12-07", "date_label": "2020年12月7日：同一篇文章的推論接續", "title": "換約多逾2元EPS，原文究竟給了哪些計算依據", "detail": "作者下一步盯住美國線舊長約。舊約每大箱一千多美元，當時現貨美東4,700、美西3,947美元；他的想法是，同一批原先按低價承運的貨，等到重簽後提高單價，可以在原有運輸量上增加收入。若增加的成本較小，這段價差就有機會留下成利潤。要從每箱價差走到每股多賺多少，中間先算適用新價的大箱數，乘實際換約漲幅與匯率；扣掉新增燃油、租船、塞港等費用，再處理稅和股東可分得的利潤，最後除以相同期間的股數。若原始箱量用TEU記，先除以2換成大箱FEU；現貨報價在這裡提供議價空間的參照，估算營收時，要用實際談成的新長約價格。他12月7日引用的宏遠52頁研究，確實在第45、46頁做了換約試算。第45頁假設長約約四成，5月1日換約、考慮航程後6月見到效益，完整年度落在2021年6月至2022年5月。對照第9頁美線櫃量示意，去程長約25除以去程合計38加25，約39.7%，可用來理解去程長約約四成的分母。第46頁則以一間未具名航商列價差表：每大箱多100美元，稅前利益增加12.12億元；扣20%後剩9.696億元，對應稀釋EPS約0.29元。把這張表繼續算，價差700美元對應稅後67.872億元、EPS約2.04元；價差1,000美元對應稅後96.96億元、EPS約2.91元。所以「價差擴大，換約能帶來數元EPS」有明確的數字示範。表中沒有另列採用的箱量與匯率，增加稅前利益的那一步仍藏在模型輸入裡。第46頁的股數也要一起看。9.696億元除以同份研究第50頁陽明的稀釋股數33.321億股，約0.291元；長榮第49頁則採52.992億股。未具名示例的數字與陽明股數相符。用於長榮時，模型應放入長榮自己的長約貨櫃量和股數，再用長榮自己的股數計算EPS。作者12月7日自己提出長榮換約多逾2元、全年6元以上，但文章沒有另列長榮的箱量、換約價、成本及稅的工作表。能核對到的是：他看見舊約與現貨大幅價差，讀了附有敏感度表的研究，據此判斷次年還有一段獲利增量。12月11日宏遠後續報告才明確給出長榮每漲100美元增加0.33元的敏感度；下面依12月14日公開引用的時間，把能算到2元的條件接續展開。", "lane": "判斷", "story_index": 8, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-07", "date_label": "2020年12月7日：同一篇文章的推論接續", "title": "從全年6元，怎麼走到淨值25至26、目標37.5至39元", "detail": "作者把2021全年獲利抓6元以上，理由是現有運價先支撐獲利，長約重簽再提供增量。他給的是全年預估下限，接著把這筆未來獲利放進淨值，推算股價可能還有多少空間。前面估2020年底淨值19.18至19.68元，若2021每股再賺6元並先全數保留，年底就約25.18至25.68元，與文中25至26元的整數區間相近。若其間發放股利，淨值應扣掉每股股利；若有轉股、增資或匯兌等權益變化，則重新用股東權益和股數計算。作者這次使用的是先保留獲利的簡化估算。有了25至26元，再問市場願付幾倍。他參照長榮2004、2005、2007、2010等獲利好年份，認為至少1.5倍PB有歷史參照；也質疑宏遠只給長榮1.3倍、同業卻給1.5至2倍。這是他選1.5倍的理由，倍數仍是對市場評價的判斷。最後25乘1.5得到37.5元，26乘1.5得到39元。整條推論因而是：運價提高先上修當季獲利，換約再延伸到明年；留存獲利推高淨值，最後以歷史與同業選倍數。後續資料可以分別改EPS、股利、股數或倍數，目標價也就跟著重算。", "lane": "判斷", "story_index": 9, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-07", "date_label": "2020年12月7日：同一篇文章的推論接續", "title": "獲利與估值上修後，他為何繼續加碼", "detail": "ECB假說也有後續：他再引借券相關截圖，文中稱借券費率達10%，仍把股價受到壓抑連到持債機構的避險賣單。這記錄了他持續檢查同一解釋；費率與餘額提供交易活動線索，交易者身分則另由部位資料核。這讓他同時保留兩條理由：營運面的運價和換約有望把獲利往上推，交易面的ECB套利賣單則可能暫時壓低價格。前一條靠後續實收與利潤驗證；後一條靠賣出流量、剩餘部位與相對評價驗證。新增資料要各自回到對應的假設。最後他自述持有現股9,000張、股期1,332口並繼續加碼。這次行動的順序是新報價推高獲利估計、換約保留下一年的增量、價格仍低於他的估值，因此擴大部位。後續每一筆新營收與獲利，都應拿來檢查這些上修是否成立。他列現股9,000張與股期1,332口，按每口約當2張，合計11,664張。這個換算呈現曝險規模；實際投入資金與盈虧還要按現股買價、期貨成交價及保證金逐筆核。", "lane": "判斷", "story_index": 10, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"]}, {"date": "2020-12-07", "precision": "day", "date_label": "2020年11月23日資料截點／12月7日公開上傳與引用", "lane": "資訊", "title": "宏遠林奕頎怎麼拆：同樣運價上漲，先看公司跑哪條線", "detail": "作者12月7日引用宏遠研究員林奕頎的報告，提供較細的公司拆解。研究先對照第二季SCFI895、EPS0.66與第三季1182、EPS1.70；截至11月23日，第四季指數均值已到1568、當日1938，於是上修下一季的獲利情境。研究員再看成本的反向證據：第三季燃油均價較第二季高約22%，EPS仍增加。他據此繼續研究漲價收益是否足以蓋過成本增加。這比只看油價上升就下修，或只看運價上升就等比例放大EPS，多接了一層已發生的結果。他再看眼前成本：報告列截至11月20日第四季海運燃油均價346美元，第三季367美元，約低6%。因此，這一季的方向是運價提高、油價均值反而降低，兩邊一起支持獲利上修；實際公司費用還要看用油量、燃料種類和其他營運支出。接著拆營收來源：長榮2019年美國線約四成、歐洲三成、亞洲三成。報告另用美線櫃量示意，分回程37%、去程現貨38%、去程長約25%。前一組按公司收入算，後一組按美線貨櫃量TEU算；推模型時各用自己的基準。各航線開始漲價的時間也不同。報告列美國線5月底起漲、歐洲線8月底起漲並在11月加速，亞洲線10月下旬轉強；第四季受惠範圍因此比第三季更廣。歐洲以現貨為主、亞洲多採現貨循環航線，新價格進入營收的節奏，也會和仍有舊長約的美國線不同。這種拆法回答「誰先受惠、誰還沒受惠」。現貨可以較快反映新價，舊長約則等生效；不同航線漲幅又不同，所以要先把報價接到適用合約，再按各部分實際貨量加總。總指數與公司的收入之間，就是透過這些項目相連。研究還把損益表接到每股數字。第49頁估2021稅後純益303.73億元，採股數48.13億股，算EPS6.31元；把分母改成稀釋股數52.992億股，算5.73元。同一筆估計利潤，攤在更多股數上，每股數字就降低。年底淨值也有接法：表內2020年底18.70元，加2021預估EPS6.31元，正好是25.01元，顯示這一段採保留獲利的簡化銜接；最後25.01乘1.3倍，得到約32.5元。作者自己採1.5倍，兩人的分歧因此可以分成獲利輸入、留存條件和倍數。研究也追海外同業的市場反應，列馬士基3月19日至11月20日漲135%、中遠海控5月22日至11月20日漲224%。研究員把這些當成全球航運景氣已被市場重估的參照，再回到長榮自己的EPS與價格，判斷還有多少差距。宏遠使用截至11月23日的資料，12月7日由作者分享。除了獲利表，研究員還追需求、供給、空櫃與船員周轉，以及2010年的景氣經驗，判斷這波改善能延續多久。", "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "story_index": 11}, {"date": "2020-12-07", "date_label": "2020年12月7日分享：宏遠第16–23頁，資料截至11月23日", "title": "為何相信需求還在：看出口、庫存與商品消費是否一起改善", "detail": "林奕頎先用需求資料驗證漲價。他看到美國製造業指數6月、歐元區7月回到50以上，製造活動由收縮轉向擴張；再列亞洲9月輸美貨櫃量年增14.5%、中國輸美年增19.6%。產業調查與實際出貨量同方向，讓運價上漲有了貨物流動的支持。下一個問題是：貨已經運這麼多，為何還可能繼續？他查美國零售商庫存與銷售的比率，6月1.22、7月和8月1.23，仍處低檔。若商品持續賣出、庫存還沒補足，零售商便需要繼續向上游下單，接著產生運輸需求。庫存銷售比低，可能是商品賣得快，也可能是庫存太少。研究員因此同時看出口貨櫃量和終端銷售：報告列iRobot季度營收增43%、Winnebago約增40%，以及玩具和清潔用品需求。他把這些放在一起，判斷實體商品消費是需求來源之一。他的解釋是，疫情限制旅行與部分服務消費，支出轉向居家、娛樂和日常商品，這些商品仍需要跨國運輸。若零售銷售維持、庫存又持續偏低，就支持後續補貨；若庫存回升而銷售轉弱，原先的持續補貨假設便需要調整。他還把疫苗與解封放進需求判斷。報告引用旅客調查，認為旅行消費短期可能難回原狀；另彙整國際機構對2021經濟復甦的預估。商品消費若維持，製造和補庫存又恢復，便有機會讓運輸需求延續。這部分是對未來消費行為與復甦速度的預測，後續觀察重點是實際零售、庫存與出貨量。", "lane": "判斷", "story_index": 12, "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-07", "date_label": "2020年12月7日分享：宏遠第24–32頁", "title": "為何供給跟不上：新船要等，長榮卻已有船排在交付名單", "detail": "運價提高會吸引更多供給，研究員於是接著查新船。他列2020年7月全球待交船約221萬TEU，占現有運力9.4%；10月約降到8%。這批待交船還要分好幾年交付，能立刻增加的運力有限。他再查新增訂單，2020年前三季約17.74萬TEU，同期交付新船約65.86萬TEU。舊訂單持續交船，補進去的新訂單卻少，待交訂單便逐步消耗。研究員因此認為，當期景氣轉好之後，船隊擴張仍有一段時間差。造船慢還有資本與決策因素。過去景氣不佳，航商財務和銀行放款意願較弱；新船又要決定船型、燃料、引擎和融資。報告舉中遠2020年10月下訂大型船，預計2023至2024年才陸續交付，說明新增訂單無法立即解除當時的缺船。放回長榮，研究員看到另一種差異：截至11月18日，長榮已排定待交約49.26萬TEU，相當於當時船隊39.1%，預計2020至2022年投入。若高運價持續到交船，長榮除了每櫃多收運費，還可能用新增運力多接貨。這就是他認為長榮有額外成長空間的原因。39.1%是待交船相對現有船隊的規模，真正多出多少營業能力，還要扣舊船退租、處分和周轉變慢的影響。宏遠當時先假設新船搭配部分舊船退出，只估2021營收年增17%；若交船後舊船仍留下來，便可能再上修。", "lane": "判斷", "story_index": 13, "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-07", "date_label": "2020年12月7日分享：宏遠第33–38頁", "title": "缺的是周轉能力：為何加快空櫃回亞洲，可能比收回程運費划算", "detail": "研究員把缺櫃拆成生產和使用兩端。新櫃製造受先前產能縮減與防疫限制影響；使用中的貨櫃又卡在港口、卡車和倉庫。貨櫃沒有回到亞洲裝貨，即使公司帳上仍有這個櫃，也暫時接不了下一趟出口。他因此追貨櫃租賃商和製造商的訂單：報告轉述Triton、Textainer的需求能見度已到2021年2月附近，中國新櫃訂單也排到下一年。這些交期提供了瓶頸短期難補上的線索。報告再舉長榮加快調回空櫃的做法。回程每大櫃約500美元、載貨率約五至六成，平均每個可用回程艙位的運費約250至300美元；當時去程美西、美東現貨報價約3,913和4,682美元。若等待回程貨源會拖慢空櫃回亞洲，航商就要在較少的回程收入和下一趟較高的去程收入之間取捨。船員換班也影響同一件事。限制上岸、隔離或染疫停航，會延長一艘船完成航程的時間。同樣數量的船與櫃，一年能完成的航次減少，可用供給便下降。這同時增加成本和議價能力。研究員的看多條件，是新增運費收入足以超過塞港、租船與人員等增加費用。後續應一起追實收運費、載貨率、完成航次和費用，才知道周轉受阻最後留下多少利潤。", "lane": "判斷", "story_index": 14, "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-07", "date_label": "2020年12月7日分享：宏遠第39–44頁的2010年比較", "title": "他怎麼區分淡季回落與趨勢反轉：回頭看2010年的先後順序", "detail": "研究員想處理另一個會動搖持有的問題：運價從高點回落，是否就該預期股價見頂？他翻2010年，發現7月8日至12月30日，SCFI從1,583降到1,083，約跌32%；同段長榮股價從22.9到30.8元，約漲34%。他從這段歷史提出解釋：旺季轉淡季會使單季運價和獲利下降，但若比去年同季仍好，全年獲利預期還可能往上。於是他把季變動和年變動分開，觀察運價年增是否延續，以及季度EPS何時開始年減。報告第48頁另列2020上半年是疫情衝擊的低基期，因此預期2021同期較容易呈現年增。驗證年增時，再對照運價、貨量和當期實際利潤，確認成長來自新改善，還是去年基期特別低。宏遠當時認為2010年的股價高點，約出現在獲利年增轉弱之前，並將這個觀察拿來追2021年。這是一項用單次歷史景氣循環提出的判斷；新一輪仍要看需求、供給和市場原先預期。對投資決策而言，運價一週小跌時，他會再問：是季節性回落，還是補庫存結束、船櫃周轉恢復，已使後續獲利低於原估？先找出改變的是哪一項，再調整持有理由。", "lane": "判斷", "story_index": 15, "refs": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020-12-08", "precision": "day", "date_label": "2020年12月8日10:42：nixt的業內訪談與換約判斷", "lane": "資訊", "title": "nixt怎麼查：問三家航商，發現客戶先搶櫃、附加費也在漲", "detail": "12月8日上午，nixt沿著同一波運價上漲，去問分別任職三家大型航商的朋友。他問的是，現在運費是否真的漲得很兇，想用第一線接單情況核對報價指數。依他的轉述，客戶先找櫃、確認有沒有櫃可用，對價格的在意程度降低，各種附加費也持續提高。nixt據此認為，SCFI顯示的漲幅可能還沒完整涵蓋實際收費。檢查這個說法時，指數的費用範圍也要對上。上海航交所列SCFI已包含燃油、旺季等多種海運附加費，碼頭作業、內陸運送等費用則另列。因此，對照業內說的額外收費，要先確認它屬於哪個費目，才能判斷實收比指數多了多少。他接著把瓶頸連起來：疫情使清關和港口處理變慢，貨量卻增加；新櫃訂單排到次年第二季，補充速度趕不上需求。既有櫃卡在途中、新櫃又還沒交付，便能解釋貨主為何急著找櫃。他還認為，次年長約會參考10月以後的運價與市場狀況，因此支持長榮2021年EPS6元以上的方向。這個估值判斷來自業內轉述、報價與換約預期，原文沒有另外列出逐航線的獲利試算。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607395376.A.5B4", "https://en.sse.net.cn/indices/fqaen.jsp"], "story_index": 16}, {"date": "2020-12-08", "date_label": "2020年12月8日18:31；21:29與21:57當晚補充", "title": "nic0911補另一條理由：農曆年前先備貨，再用明年淨值驗算估值", "detail": "同一天傍晚，nic0911把需求時間再往前拆。他看到中國PMI和出口維持高檔，又考慮次年農曆年在2月中旬；如果工廠年後復工有不確定性，出口商和海外買家可能提前在年前備貨，讓貨物流量提早集中。他的推論是，港口效率下降使每個貨櫃周轉更慢，提前備貨又提高裝櫃需求，缺櫃便可能延到次年上半年。要追的是年前出貨強度、年後復工和港口效率，三者如何一起變化。當晚21:29，他另補估值：假設第四季EPS4元，原先第三季淨值16.68加上去，年底20.68；再假設2021賺6元並保留，次年底26.68；給1.5倍PB，約40元。這比robertshih的第四季2.5至3元更積極，所以淨值與目標價也更高。他同時註明採未稀釋股本，並引中遠海控的券商2倍PB作同業參考。到了21:57，他又指出長榮先前在船價低時訂船、景氣反轉時交船。價格提高與既有交船計畫一起出現，是他看公司條件較好的理由。", "lane": "判斷", "story_index": 17, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607423495.A.7D5"]}, {"date": "2020-12-14", "precision": "day", "date_label": "2020年12月14日 20:31:49", "lane": "判斷", "title": "出現矛盾：運價一直漲，11月營收卻減少", "detail": "12月公布長榮11月營收約196.99億元，低於10月203.03億元、月減約3%。robertshih原先認為運價提高會帶動營收，這個反差使他去電長榮，想問發言人為什麼會月減。他在12月14日寫，發言人回電後先解釋幾個因素：塞港與船期延誤、11月比10月少一天，以及營收依航程進度逐日認列。公司認為更主要的原因，是美國線去程與回程船次的月份組合。去程由亞洲載貨到美國，運價和載貨率較高；回程運價和載貨率較低。依作者轉述，11月剛好有較高比例船次處於回程，因此即使去程報價上漲，當月認列的營收仍可能減少。作者聽完後，把原先「運價漲，營收卻減，是否生意轉弱」的疑問，改成「高價去程和低價回程在不同月份認列，造成大小月」。他接著查航線占比與船期，用下面的模型檢查這個解釋，再據此提出12月營收回補的預測。", "refs": ["https://disp.cc/b/Stock/d1NA"], "story_index": 18}, {"date": "2020-12-14", "precision": "day", "date_label": "2020年12月14日 同一次查證", "lane": "判斷", "title": "他具體查到什麼：美國線占比、去回程差異與航程認列", "detail": "他先確認這個因素大不大：美國線占長榮營收四成多，因此去回程船次比例改變，有機會影響全公司單月數字。他再連到ShipmentLink船期表，列亞洲到美西單程約20至25天、美東約35至40天，看到一趟航程足以跨月。接著把公司縮成一艘船來想。假設每程30天、每月1日出發，這個月跑運價高且較滿載的去程，營收較多；下個月跑低價、載貨率低的回程，營收較少。市場報價即使維持，月份營收仍會出現高低起伏。再放回多艘船的現實：各船出發日不同，通常會平滑這個落差；但若某個月恰好較多回程航段，仍可能讓全公司營收偏低。作者認為公司對11月的解釋，和這個航程模型接得起來。他得到的結論是：11月月減3%，可以由當月去回程組合與認列進度解釋；原先高運價的獲利方向仍值得繼續觀察。下一個要驗證的具體結果，就是12月去程占比提高後，營收是否明顯回升。", "refs": ["https://disp.cc/b/Stock/d1NA"], "story_index": 19}, {"date": "2020-12-14", "precision": "day", "date_label": "2020年12月14日 查完之後", "lane": "判斷", "title": "他得到的論點與決定：預測12月補回，繼續持有", "detail": "作者最後在文中明確推測，11月既然是回程比例高的小月，12月就可能是去程比例高的大月，營收有機會把前月落差補回。這是他把公司解釋和船期資料接起來後，自己提出的12月預測。他的決定是全部部位繼續持有。理由也接得完整：運價仍強，公司回電提供月減原因，航程資料讓大小月模型有了營運依據；接下來等12月營收，檢查這個解釋是否得到支持。同篇文章還交代持有工具的變動：股期多數已換到翌年1月合約，兩千多萬元獲利因此轉為已實現，整筆長榮部位總獲利約1.1億元。到期月份往後移、獲利轉為已實現，和是否減少整體曝險，要分別看換月後的持有數量。作者當時說的是繼續全數持有。文章引用的宏遠報告，另以2021年底淨值27.42元乘1.7倍，列46.6元目標。作者的12月營收預測先在隔年1月接受檢查；研究員的全年估值則繼續看長約、新船、成本與股數。", "refs": ["https://disp.cc/b/Stock/d1NA"], "story_index": 20}, {"date": "2020-12-14", "precision": "day", "date_label": "2020年12月11日報告／12月14日上傳、由作者引用", "lane": "資訊", "title": "宏遠的新估算：把營收落差、換約與稀釋逐項算進去", "detail": "林奕頎12月11日報告、12月14日由作者上傳引用，先面對11月營收年增22%、月減約3%的落差。他把塞港、截航時間和運價反映到收入超過一個月的延遲放進解釋，預期12月及翌年1月再創高，留下兩個後續能核對的月份。這份研究有把成本和股數接到獲利。第四季估營業利益152.69億元，扣業外淨支出11.39億元，約得稅前141.30億元；報告再估稅後107.39億元，除48.13億股約2.23元，改除52.908億稀釋股數約2.03元。稅前到稅後的差額含報告估計的稅與歸屬調整，原文有總數，細項未逐項展開。成本還有船隊設備的差異。報告提到提高脫硫設備裝設比率，就能增加較便宜高硫油的使用，12月10日高、低硫油每噸價差56美元。節省多少取決於可替代用油量，以及設備、維護和運轉費用；所以同樣運價下，兩家航商最後留下的利潤也可能不同。換約的計算現在明確落在長榮：第1、3頁寫每大箱漲100美元，一整年稀釋EPS增加0.33元；效益期間寫2021年6月至2022年5月。所以先用漲價幅度除以100，再乘0.33，就得到它這組模型對應的12個月增益。要比較2021單一曆年，再算6至12月能入帳的部分。把2元這個門檻算開：若看完整12個月，長約每大箱多約606美元，就對應2元；若先假設每月箱量平均分布、2021只反映7個月，則要多約1,039美元。用1,100美元示範，完整年度多3.63元，乘7/12後，2021約多2.12元。這是依後續報告敏感度作的編者重建，用來說明達到2元需要哪些條件。0.33元本身還可以往回查一層。它乘報告52.908億股，等於每漲100美元須增加約17.46億元的歸屬股東稅後利益。若編者另假設匯率30、扣稅20%、新增成本先維持原狀，且新增利益全數歸屬母公司，這個結果需要一年約72.75萬FEU適用新價。報告沒有列這組箱量與匯率，這裡是對照模型所需條件，方便日後拿實際箱量、成本與稅替換。全年估計另有完整損益表：第7頁估2021稅後純益409.26億元，除52.908億股得稀釋EPS7.74元；未稀釋EPS為8.50元。預估年底淨值27.42元，可由2020年底18.91元加次年EPS約8.50元銜接，四捨五入後與表內值相近；再乘1.7倍得46.61元，報告目標列46.60元。這裡的全年7.74元已是包含報告各項營運假設的總預估。旁邊每100美元增加0.33元，供比較換約幅度改變時要增減多少。將兩者接起來時，要先對報告原先已放入的換約假設，才知道新消息究竟讓原估上修了多少。這份更新把長約、成本、股數和新船放在同一個預估裡。接下來應觀察12月與1月營收是否創高，再對照新船實際交付、長約重簽和稅後利潤，逐項更新原來的估計。", "refs": ["https://speakerdeck.com/robertshih/14"], "story_index": 21}, {"date": "2020-12-16", "precision": "day", "date_label": "2020年12月16日：Sea-Intelligence當期研究", "lane": "資訊", "title": "Alan Murphy追空櫃：短缺要怎麼解除，才是延續多久的關鍵", "detail": "12月16日，Sea-Intelligence執行長Alan Murphy把空櫃短缺拆成四種處理情境：沿用原方式、加速調回空櫃、增加新櫃，以及調回與新櫃一起做。他想回答的問題，是造成高運價的供給瓶頸要多久才能改善。推論關鍵在回程船位的用途。如果航商優先帶回程重櫃，眼前可取得運輸收入，但空櫃回到亞洲的速度較慢；若加速帶空櫃回來，亞洲下一趟可接貨能力便較快補上。新櫃投入則再增加可用數量，兩個措施合併才會更快改善短缺。研究在當時情境下估，積極調空櫃並加新櫃，才有機會1月改善；若仍優先載回程重櫃，短缺可能延到2月或之後。這使「高價維持多久」有了可追的輸入：回程配載、空櫃回流、新櫃交付與港口周轉。對長榮的研究，這份材料接在作者的供需假設後面：如果補救速度快，較高運價持續時間可能縮短；如果回流慢，就繼續追下一期報價與收入。這些是Alan Murphy的當期模型，按12月16日加入更新，供與作者看法交叉比較。", "refs": ["https://sea-intelligence.com/press-room/37-empty-container-shortages-in-asia-to-persist-into-january"], "story_index": 22}, {"date": "2020-12-23", "precision": "day", "date_label": "2020年12月21日操作／12月23日 23:01:30說明", "lane": "判斷", "title": "作者為何減碼：年度獲利目標達到，先收回成本", "detail": "作者12月23日晚間回述，「前天」已賣出7,650張，剩餘連同股期約當4,110張、市值約1.2億元。依這個相對日期，操作記在12月21日。他的決策理由是行情已達自己設定的年度獲利目標，所以賣出一部分，把進場市值成本收回，留下其餘部位參與後市。此時文章仍留有上行預期；驅動這次減碼的是他對已累積獲利與部位規模的安排。把它接回12月14日，前一次決定是營收落差查完後仍續抱，這一次則是到達個人目標後降低投入。兩次行動各有自己的觸發條件。後面的年度回顧又記他因新同業獲利回補，於是部位路徑可以依資料更新和個人目標逐次對回。他仍偏向認為行情在中段，理由還包括當年其他獲利爆發股的比較。他在12月23日列恆大高點約對應當年11倍PE、熱映約9倍，認為即使市場預期題材只有一年，短期也可能給更高倍數；若航運高獲利延續更久，價格空間便可能還在。這些倍數是他當時引用的比較。因此他的決策並非只靠一個目標價：公司前景仍好，讓他保留上漲參與；個人年度目標達成，讓他先收回原投入金額。減碼後承受波動的心理壓力較小，他認為更有機會把剩下的部位抱久一點。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1608735699.A.EE1"], "story_index": 23}, {"date": "2020-12-23", "precision": "day", "date_label": "2020年12月23日分享：作者稱為宏遠12月21日報告", "lane": "資訊", "title": "同一天的另一份研究：先假設運價腰斬，再算獲利還剩多少", "detail": "12月23日，robertshih分享一份12頁研究，文中稱為宏遠12月21日的新報告。簡報列12月18日SCFI2,412、第四季均值約1,759，對照第三季1,182與EPS1.7元，再主動把明年運價往下壓，檢查較差情境下還能賺多少。它先讓2021年運價退回第三季指數1182，約比2412低51%；若每一季仍能保留第三季1.7元獲利，全年就是6.8元。這一步的意思是先壓低報價，看看獲利還剩多少，再和價格背後的市場預估比較。簡報列市場預估3.79元，於是6.8元情境仍有較大預期差。但從指數1182推到每季1.7元，中間沿用了第三季的成本、貨量與合約條件；往後應檢查這些條件是否還在，並放入轉債等股數變化。這份研究留下的是一條較低運價仍可能高於市場原估的論證。作者同日說明個人減碼，則由自己的部位與目標觸發。把兩份材料按各自作者與用途並列，便能理解公司估值情境和個人資金決策如何同時存在。", "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"], "story_index": 24}, {"date": "2020-12-23", "date_label": "2020年12月23日分享：研究第4–5頁", "title": "另一份ECB判斷：股份增加多少，獲利要多賺多少才跟得上", "detail": "這份研究把ECB問題分成股票供給和每股獲利。作者11月關注的是套利賣單壓價；12月研究進一步問，轉股後股份增加，是否會把營運成長吃掉。報告先拿陽明作比較：9月底到11月底，可轉債面額由72.6億降到42.3億，減少30.3億元，約換成29.1萬張普通股；同頁又列股價由9.7到13.25元，約漲37%。研究員用這個例子說明，市場也可能在股份增加時，繼續上調獲利評價。長榮的規模則可從條款驗算：新增約4.779億股，相對當時原股數48.13億股，增加約9.93%。若利潤維持原狀，每股盈餘會降約9.03%；若總利潤增加9.93%，則剛好抵銷股數增加。因此，研究員的看法是，應把預期獲利成長和股數增加放在一起比較。他認為長榮的成長足以承受約一成增股，並把因轉股消息而出現的短線回落視為可能機會。這是研究員的買點判斷，和作者按日量估賣壓消化的思路各有重點。", "lane": "判斷", "story_index": 25, "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"]}, {"date": "2020-12-23", "date_label": "2020年12月23日分享：研究第6–9頁", "title": "利空消息怎麼查：聖誕節、英國脫歐、表面運價停漲，各拆哪一段", "detail": "研究先處理聖誕節後需求可能轉弱的說法。它由到貨時間倒推：海運超過一個月，還有陸運、倉儲和上架，聖誕銷售的商品通常得較早離開亞洲。研究因此認為，12月仍在上漲的歐洲線，需要另外追補庫存和供給瓶頸，才能解釋眼前的價格。對英國脫歐，它先分航線。英國與歐盟之間的貿易、英國囤貨，和亞洲輸往整個歐洲的貨櫃需求，涵蓋範圍不同。報告又指出當時緊張處包括北歐，據此判斷用英國單一事件解釋全部歐洲線漲價，涵蓋的供需範圍不足。對美國線報價暫停上漲，研究改查實際收費。它稱每大櫃另有1,000至2,000美元服務費，約相當於四千美元運價的25%至50%。這代表貨主的總支出可能繼續增加，指數主報價持平時，還要把附加費一起看。它再找港口貨物流量核對需求與空櫃回流：洛杉磯港11月進口464,820 TEU，出口實櫃130,917加空櫃294,010，合計424,927 TEU，少回流39,893 TEU。報告將這個差額作為貨櫃仍滯留當地、亞洲回櫃不足的線索。最後得到的投資論點是：新聞標題所指的利空，先對到真正受影響的貨物、航線與時間，再看總收費、出貨和回櫃有沒有轉弱。若原先支撐高運價的條件仍在，單一節日結束或主報價持平，對獲利預估的影響就要重新估量。", "lane": "判斷", "story_index": 26, "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"]}, {"date": "2020-12-23", "date_label": "2020年12月23日分享：研究第1–2、10–12頁", "title": "接下來看什麼：輪流漲價、營收落後一個月，以及運價年增", "detail": "報告還把不同航線放在一起追。12月18日綜合指數漲4.3%，東南亞線漲12.7%；研究認為，船與櫃在不同航線間調度，各地搶運力，會形成輪流漲價。公司受惠多少，仍取決於各航線占比和適用的新價格。它把時間對到營收：10月運價主要反映11月、11月反映12月、12月再反映翌年1月。這使後續追蹤有了先後順序，先看報價與訂艙，再看下一期營收和利潤，遇到落差就回查航程與費用。對較長的行情，研究延續看運價和獲利年增的思路，同時注意短期淡旺季。它也把12月31日陽明法說列為新資料時間點，並觀察馬士基等同業股價。法說提供營運更新；同業價格提供市場如何反應產業預期的參照。", "lane": "判斷", "story_index": 27, "refs": ["https://speakerdeck.com/robertshih/2603-1223-report"]}, {"date": "2020-12-25", "precision": "day", "date_label": "2020年12月25日操作推定／2021年1月3日本人回述", "lane": "判斷", "title": "減碼後又買回：同業單月獲利，給了他新的判斷依據", "detail": "王憶紅12月25日報導，陽明在「昨日」公布11月自結：營收152.65億元、稅後獲利27.05億元、EPS0.92元，單月已超過前三季累計。這讓高運價的研究從報價與營收，往實際利潤多走了一步。作者在1月3日年度回顧回述，自己在陽明公布0.92元的隔天，追回約當1,700張長榮股期。把新聞的昨日定位為12月24日，再接隔天，回補日因此記為12月25日的交叉對時推定。他的行動依據可沿時間接起來：剛依個人目標減碼，隨後同業公布比先前累計更強的單月獲利，便重新估量長榮在共同運價環境下可能留下的利潤，再買回部分部位。作者的回述直接交代了新數字與回補的先後關係。跨公司推估仍要比較各自航線、長約、成本與股數。這組資料支持重新檢查長榮的未來獲利，實際成交價格則另由交易明細回答。之後1月公布長榮12月收入，會繼續檢查新估計的營運方向。", "refs": ["https://ec.ltn.com.tw/article/paper/1421281", "https://www.pttweb.cc/bbs/Stock/M.1609611680.A.094"], "story_index": 28}, {"date": "2020-12-29", "precision": "day", "date_label": "2020年12月29日 17:55：蔡芃敏採訪兩位分析師", "lane": "資訊", "title": "同樣看好基本面，兩位分析師對此刻買進的考量不同", "detail": "12月29日，中央社蔡芃敏報導長榮收38.35元、漲4.35%，成交約88萬張，三家貨櫃航商合計逾140萬張。同一天兩位受訪者都看好產業，卻從不同問題推決策。宏遠陳國清把短期波動連到可轉債，認為產業改善約半年、股價漲四五個月，行情仍可能在中段。他的判斷先看生意好轉是否尚未完成，再把交易性賣壓視為當下波動的可能來源。國泰證期顧問處蔡明翰則把已漲幅度、乖離與爆量放進買價考量。即使未來獲利方向相同，價格已先反映多少，會改變新投入資金剩下的空間。因此，已有部位要留多少，和準備新買要付多少，會得到不同安排。這篇留下了當期的多頭理由和價格顧慮。後來1月確實回檔，可用來接價格路徑；要解釋每一筆賣單的原因，仍沿當期交易與部位資料查。它在故事裡的作用，是讓公司前景、當時價格與部位選擇三者連在一起。", "refs": ["https://www.cna.com.tw/news/afe/202012290291.aspx"], "story_index": 29}, {"date": "2020-12-31", "lane": "市場", "title": "本月還原漲跌 +64.78%", "detail": "2020-12-31月末觀測：本月供應商還原收盤變動+64.78%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2020-12-31", "precision": "day", "date_label": "2020年12月31日 15:19：王憶紅報導陽明法說", "lane": "資訊", "title": "公司端怎麼看：第一季價量高檔，接著看第二季換約", "detail": "12月31日，王憶紅報導陽明總經理杜書勤在法說提出：2021第一季各航線價量有望維持高檔，第二季美國線長約換約也可望受惠。研究員先前的「現貨先反映、長約稍後接上」，因此多了同業公司端的當期說法。這份展望可拆成連續的驗證時間：第一季先檢查訂艙、報價與出貨是否仍強；到第二季再看換約價差和適用箱量；全年則追疫情、貿易政策與港口周轉如何改變貨流和供給。每個階段都要把新收入和新增成本相減，再看利潤。對長榮而言，同業的說法提供共同環境，公司的數量估算仍回到長榮自己的航線與合約。研究因此是先用多方來源確認景氣，再把各家財務與生意結構拆開，形成各自的EPS與買價判斷。", "refs": ["https://ec.ltn.com.tw/article/breakingnews/3397812"], "story_index": 30}, {"date": "2021-01-03", "precision": "day", "date_label": "2021年1月2日 23:05部落格／1月3日 02:21論壇", "lane": "判斷", "title": "年度回顧把前面的行動接起來：11月中建倉，年底回補後仍有部位", "detail": "2021年1月2日晚，作者部落格年度總結回顧，長榮在11月中建倉；1月3日PTT版則列現股1,124張、股期2,345口，合計約當5,814張，並說曾追回約當1,700張。這把最早完整公開文章與他後來自述的建倉月份接起來。逐次部位因而有了可核的順序：11月中建倉，12月7日持續加碼，12月21日按個人目標部分賣出，陽明新月獲利出現後回補，年初仍有部位。每次變動都有文章或年度回顧對應；回補日另外標明是依相對日期推定。他也自述盤中會在現股與期貨之間轉換，利用兩邊價差。這屬於持有工具與資金安排的調整，應同看換算後股數、到期月份、保證金和成本。原文提供了操作方式與當時部位，逐筆價差收益還要由成交紀錄核。全年整體資產變化約3.8億元，作者約一半歸長榮，其餘來自其他短線策略；年度數字按這個多策略範圍保存。市場從11月到後來高點的漲幅，另按價格序列計算，和他的實際各次加減碼分開對照。", "refs": ["https://et220870.blogspot.com/2021/01/2020.html", "https://www.pttweb.cc/bbs/Stock/M.1609611680.A.094"], "story_index": 31}, {"date": "2021-01-08", "precision": "day", "date_label": "2021年1月8日公告／1月11日報導", "lane": "營運", "title": "預測接受實績檢查：12月營收回升24.77%", "detail": "1月11日中央社回述，長榮已於前一個星期五、1月8日公布12月營收245.8億元，月增24.77%、比11月多近50億元，創當時單月新高。這是12月14日作者預測後，第一個能直接對答案的收入結果。先固定他當時的預測：因11月偏回程，推12月偏去程、收入會補回。再看實績：12月的確回升。保存的FinLab資料，11月196.99341億、12月245.80336億，也與新聞方向和量級相符，公告時點則由新聞核到1月8日。因此，查證後可更新的是回補方向得到支持。若要再檢查他提出的航程解釋能占多少，還要把新報價、各方向實收、貨量和航次進度分開，因為月營收呈現的是這些項目的總和。下一步應繼續看1月收入與後續利潤：回補若只是跨月挪動，持續性有限；若較高運價和新服務仍在進帳，下一期也會留下線索。這讓一次預測驗證自然接到下一輪追蹤。", "refs": ["https://www.cna.com.tw/news/afe/202101110233.aspx"], "story_index": 32}, {"date": "2021-01-29", "lane": "市場", "title": "本月還原漲跌 -23.34%", "detail": "2021-01-29月末觀測：本月供應商還原收盤變動-23.34%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-02-09", "precision": "day", "date_label": "2021年1月至2月9日", "lane": "營運", "title": "營收繼續創高，股價卻先回檔，再恢復上行", "detail": "2月9日中央社再報，長榮1月營收284.35億元，月增15.68%、年增71.69%。12月回補後，1月又增加，收入端的改善因此多延續一期。價格卻走了不同節奏：1月底收31.2元，當月還原下跌23.34%；2月底37.95元，再回升21.63%。這時研究要同時看公司實績和市場原先已放進價格的期待。收入提高，可支持營運改善；後面還有多少未反映的利潤，則要另外估。具體查法是把原模型逐項更新：運價和實收仍強嗎，新增成本吃掉多少，後面換約還能增加多少，現價和更新後獲利相比又是幾倍？同時核當期賣壓和資金變化，才可往價格回檔原因推。本案已有連續收入與股價可對照，對1月各種賣壓的貢獻則保留為待查項目。決策時，先把可核的營運結果更新，再處理買價和持有規模，避免讓單日漲跌取代整套獲利判斷。", "refs": ["https://www.cna.com.tw/news/afe/202102090298.aspx"], "story_index": 33}, {"date": "2021-02-19", "precision": "day", "date_label": "2021年2月19日：11月文章後約三個月", "lane": "市場", "title": "用大盤與同業核對：這波行情有很強的航運共同因素", "detail": "要檢查這段上漲是否和航運機會有關，先讓比較期間一致，再把長榮、大盤與陽明、萬海放在一起。這裡採文章發表前的11月17日收盤為比較基準，至2021年2月19日，長榮還原上漲74.64%，比大盤多54.24個百分點，比指定同業平均多5.53個百分點。再回看文章前60個交易間隔，長榮已漲40.67%，同業平均漲68.21%。這表示作者是在產業行情已展開後，尋找長榮相對落後及後續獲利的空間。文章發表前的價格位置，必須和發表後的變化一起看。把證據順序接好：當期新聞有運價與供給瓶頸，多家航商收入及利潤改善，族群價格又共同上漲。這幾項彼此對得上，支持航運共同景氣是重要解釋。長榮之後額外相對同業的表現，則再拆航線、成本、財務與交易因素。因此，ECB假說的驗證還要另外核借券流量、轉換與相對估值。產業改善的證據、長榮相對表現、特定賣方交易，各有對應資料；按這個順序看，就能避免把整段行情全部歸給單一訊息。", "refs": [], "story_index": 34}, {"date": "2021-02-26", "lane": "市場", "title": "本月還原漲跌 +21.63%", "detail": "2021-02-26月末觀測：本月供應商還原收盤變動+21.63%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-03-11", "precision": "day", "date_label": "2021年3月11日 22:41：作者轉用陽明研究產業", "lane": "判斷", "title": "運價回落後，他重算全年，為何把資金轉向陽明？", "detail": "3月11日，作者轉以陽明研究同一波航運景氣。SCFI由2875回到2721，他先承認淡季回落，再引用台驊董事長顏益財訪談，檢查供需是否有足以延續高價的變化。研究的問題因此改成：即使後面報價下降，全年還能賺多少？他先比陽明11、12月營收約152.7、168.7億元，稅後利潤約27.05、50億元。收入多約16億元，利潤卻多約23億元，他由此假設新增收入多來自漲價，新增成本相對有限，嘗試由月營收增量推月獲利。這個月差還可能含業外與稅負變化，後面要拿實際財報比。按作者模型，1月較12月增收35.8億元，假設新增收入大致轉成稅前利潤，再扣20%稅，剩28.64億元。用約32.6億股攤算，每股增加0.879元，四捨五入約0.88元；加12月1.64元，得1月預估2.52元。2月同法由增收39.6億推稅後增加31.68億，每股增加約0.972元，得2.61元。32.6億股是編者依兩筆估算反推的近似分母，原文沒有另列股數。接著他先把第一季抓約7元，再把後面運價往下壓：第二季約1900，第三季1800至1900，接近原文列的2020第四季均值1974；他就借用當時第四季估計EPS約3元，給第二、三季各3元。第四季再讓指數降到1300至1400，估EPS1.5元，全年加總14.5元。季度EPS採歷史對照和作者情境判斷，原文未建立固定的SCFI與EPS換算公式。他再拿14.5元與28.1元股價相比，得到約1.94倍本益比。原文另估年底淨值24.9元，以28.1除下去約1.13倍。這使讀者能分清：每季能賺多少是營運假設，市場願意付幾倍是另一層估值判斷。同文列長榮890張、陽明約當17,155張。這使長榮部位紀錄至少延續到3月11日，也看出他把資金重心轉向自認較便宜的同業。到5月文章，再用自結利潤與運價新走勢檢查3月的估算精度。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1615473670.A.C95"], "story_index": 35}, {"date": "2021-03-31", "lane": "市場", "title": "本月還原漲跌 +19.89%", "detail": "2021-03-31月末觀測：本月供應商還原收盤變動+19.89%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-04-29", "lane": "市場", "title": "本月還原漲跌 +73.63%", "detail": "2021-04-29月末觀測：本月供應商還原收盤變動+73.63%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-05-06", "precision": "day", "date_label": "2021年5月6日 22:21：作者再上修產業情境", "lane": "判斷", "title": "運價比原估強，他逐項改假設，再查市場願意付幾倍", "detail": "5月6日，作者回頭檢查3月情境，發現淡季降價幅度較小、止跌回升較快，SCFI已到3100。他列1至4月均值2871、2840、2627、2829，顯示原先預想第二季明顯降價的環境已有變化，未來季度的輸入要重設。他又列陽明1月自結EPS2.32元、3月2.43元，判斷第一季約7元的方向大致成立。對照3月曾估1月2.52元，單月估計高了0.20元。這一項落差回查成本、業外與稅；後續運價比原估強，則另用來改第二季之後的獲利。他把全年分成三條路徑：悲觀情境讓第二、三季指數在2600至2900，第四季降到1300至1400，全年EPS22至23.5；中立27至29；樂觀30至33.5。下表逐季保留，方便下一期資料出現時，辨認原先走的是哪一條。再處理模型外的增減項。原文估陽明換約後完整一年可增加3.5至4.5元EPS，5月生效、約6月起反映營收。若全年效果按月份平均攤，2021的6至12月占7/12，算出2.04至2.63元，對上作者列的約2至2.6元。全年與本年使用不同期間，差別就在這7個月。作者另估燃油成本比去年增加約1.5元EPS，並預留油價繼續上漲的空間，所以簡化為長約收益和燃油增支互抵。若只扣已列1.5元，長約還剩約0.54至1.13元；他把這個餘額也留給額外成本風險。這就是三條全年情境沒有再加上全部換約收益的理由。稅與股數再各算一次。原文預想過往虧損的扣抵可能把獲利提高10%至20%，現金增資使股數增加約9%、單股獲利稀釋約8.3%。若兩項同時成立，原EPS乘1.10至1.20再除1.09，結果約比原估高0.9%至10.1%；若獲利總額維持原估，只有股數增加，EPS則成為原來約91.7%。稅的改善幅度採作者情境，實際財報仍要核所得稅費用與遞延稅資產。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "story_index": 36}, {"date": "2021-05-06", "date_label": "2021年5月6日：陽明增資、稅負與財務假設", "title": "增資稀釋EPS，作者為何仍認為財務條件改善", "detail": "作者對陽明現金增資先看股份：預計發30萬張、即3億股，約增加9%，所以獲利總額固定時，EPS變成原來1/1.09，減少約8.3%。但公司也會收到現金，他接著評估資產負債表能改善多少。他當時估募得230至240億元，主張每股淨值增加約6至7元。若由增股9%反推原股數約33.33億股，230至240億除下去，每原有一股新增現金約6.9至7.2元，可以理解他估計的量級。精確的每股淨值則要把新增3億股一起放進分母。沿他的其他估計示範，2020年底淨值11.26元加第一季預估7元，先以18.26元作增資前起點；按上述股數和募資額，增資後淨值約23.08至23.36元，增加約4.82至5.10元。這是補算的條件情境，原文6至7元仍保留為作者估計。原文還說承銷價可能按市價九二折，股東權益影響約0.72%。其近似算式是新增股9%乘折價8%；若按增資後股數計算，未認購股東的每股理論價格攤薄約0.66%。實際條件還看承銷價、認購權與發行股數。作者再往後想：若7、8月承銷時股價提高，而發行股數一樣，公司就可能募到更多現金。因此他同時保留EPS被稀釋和財務資源增加兩種影響，再與他預想的所得稅改善放在一起估整體結果。", "lane": "判斷", "story_index": 37, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"]}, {"date": "2021-05-06", "precision": "day", "date_label": "2021年5月6日：作者以CMoney研究二十年估值", "lane": "判斷", "title": "獲利估出來之後，他怎麼查市場可能給幾倍？", "detail": "作者接著問：公司大賺，市場仍可能只給2.5至3倍，怎麼支持更高價格？他因此用CMoney「選股勝利組」整理2001至2020年資料，先剔除近一年平均日量低於200張的股票，再用營業利益率、稅率與稅後淨利率，調整出他採用的本業EPS。調整的動機，是先降低賣資產等一次性損益對比較的影響。他再以當年最高股價除以調整後EPS，按年整理低倍數公司，並另外看EPS大於15元的組別。原文連到20個頁籤的Excel，這是他估值觀察所稱的資料底稿。他還給達爾膚作實算：實際EPS14.69元、營業利益率31%、稅後淨利率86.5%；以20%稅率調整，14.69乘31%乘80%再除86.5%，得到本業EPS約4.21元。原文稱大部分差額來自出售子公司，這一步用來降低一次性處分利益對估值比較的影響。依他自行整理的結果，先提出本業高獲利公司年內高點常可到約4倍以上；再把配息率達五成的公司挑出，主張通常可到6倍以上。他又查陽明過去獲利好時的配息，預期這次也有較高配息，因而採中立EPS27至29元乘6倍，估162至174元。原文也列例外，包括日勝生的訴訟可能使已認列利益流失，以及隆大、日勝生等個案在隔年公布年報與股利後才上漲。作者因此也在判斷獲利能留下多少、何時配出，以及市場需要等到哪一個公告。二十年統計與例外篩選採他在文章裡提出的研究結果。這套推論衡量的是歷史一年內曾出現的估值，再將它外推為未來目標。檢查這項外推時，先記下決策日已知的EPS預估與買價、固定觀察期限，再對後來公布的EPS、配息和價格，查看多久兌現、途中承受多少波動。作者選的6倍和9倍，因此各是一項要在後續繼續驗證的價格情境。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF", "https://reurl.cc/ZQmMeA"], "story_index": 38}, {"date": "2021-05-06", "date_label": "2021年5月6日：作者比較本益比與股價淨值比", "title": "他為何改看PE：把同一組高獲利股票的兩種估值放在一起", "detail": "作者以前也參考PB，這次卻想檢查，過去兩倍PB的高點是不是適合拿來限制今年股價。他先挑2020年本業EPS超過15元的一組股票，比較它們在年內高點的PE和PB。依他的整理，這組PE由9.26到20.69倍，高低約差2.23倍；PB卻由0.98到10.55倍，高低約差10.8倍。他因此認為，在這組獲利爆發股裡，EPS對價格的解釋比較集中。這是他的估值研究解讀。他再舉恆大、申豐：獲利爆發後，年內高價對應PB可到五倍左右，明顯高於過去較平穩年份。若公司能賺的錢大幅增加，只沿用舊PB上限，就可能低估這種變化。海運也被他拿來檢查。過去好年景每股約賺4至5元、淨值約15至20元，配上當時PE後，股價高點常落30至45元，回頭除以淨值就容易看到兩倍上下PB。他的主張是，這個舊比例可能反映過去的獲利規模，應先重算今年EPS再選倍數。他又用三家去年的數字比較：陽明不配息、PE約7.13倍，低於長榮8.84和萬海11.27倍，但PB反而高於長榮。作者將這個差異接到配息和獲利評價，認為用PE較能說明他觀察到的價格排序。", "lane": "判斷", "story_index": 39, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"]}, {"date": "2021-05-06", "date_label": "2021年5月6日：6倍目標之外的9倍情境", "title": "9倍從哪裡來：高EPS分組、進入門檻與獲利持續時間", "detail": "6倍之外，作者再看本業EPS超過15元的歷史組別，認為年內高點多在9倍以上；他列2013年長虹約7.6倍為例外，並解釋配息率只有三成多。因此，正常配息和高額本業獲利一起出現，是他設想較高倍數的條件。他也比較供給反應。口罩缺貨時，其他產業公司可以投入生產；航運則需要龐大資金、船舶與交付時間。他認為運價高時新增競爭供給較慢，便有理由繼續研究高獲利能維持多久。若只賺一年，9倍是他想像的年內高點情境；若高運價能維持兩年以上，他認為市場可能把高EPS看成較有持續性的水準，估值意義也會改變。這項判斷依賴後面幾季的運價、需求和新運力，所以他仍將運價提前大跌列為要下修的條件。他還用面板股作資金環境比較：原文稱2017年低倍數約4.5倍，2021年按當時法人預估已到7至8倍，據此認為資金對循環股的接受度提高。再加上預期指數納入和法人上修，他認為海運仍可能有更高評價。把中立EPS27至29元乘9，可補算成243至261元情境；作者正式列出的至少目標仍是乘6得到162至174元。前者用來看倍數若上調，價格空間如何改變，持有決策仍須隨新EPS與市場價格更新。", "lane": "判斷", "story_index": 40, "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"]}, {"date": "2021-05-06", "precision": "day", "date_label": "2021年5月6日：作者把估值情境接到資金與後續更新", "lane": "判斷", "title": "他預想誰會重新買進，以及哪些新資料會讓目標價改變", "detail": "他同時預想可能帶來新買盤的時間點：原文推測海運市值提高後，5、6月可能納入MSCI或台灣50。因果是若進入指數，追蹤該指數的資金需按權重調整部位，可能增加股票需求。這在當時屬待公告與持股變化檢查的預測。另一個觀察是他引述4月19日JPM長榮報告，稱其EPS約10元、採10倍PE、目標101元。作者雖不同意其獲利估計，卻把「機構已願用10倍」視為估值可能改變的線索：如果後來機構上修EPS、倍數仍高，就可能提高目標並帶來新買盤。這組數字採作者當時的引述，呈現他如何從機構報告推想後續買盤。他最後把更新條件寫清：運價續創高、第四季降幅小於預估，會上修EPS；稅費與配息改變，也會改獲利或倍數；運價較早大跌則下修。持有理由因而接成「新獲利高於原估、估值方式可能改變、資金可能增加」，每一條都留下後續能對答案的資料。在操作上，他同日自述持有23,590張陽明、約19.8億元市值並持續加碼，也會做短線價差。短線賣出某個帳戶，可能同時搭配另一帳戶買進；他因此用合計波段部位是否增加描述長期決策。這份披露讓3月轉向陽明之後的部位路徑，接到5月仍在擴大持有。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF", "https://speakerdeck.com/robertshih/jpm-report-2603"], "story_index": 41}, {"date": "2021-05-31", "lane": "市場", "title": "本月還原漲跌 +24.81%", "detail": "2021-05-31月末觀測：本月供應商還原收盤變動+24.81%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-06-30", "lane": "市場", "title": "本月還原漲跌 +99.80%", "detail": "2021-06-30月末觀測：本月供應商還原收盤變動+99.80%。資料取自先前保存的逐月統計。", "refs": []}, {"date": "2021-07-01", "precision": "day", "date_label": "2021年7月1日18:57:40：長榮透過SGX公告", "lane": "營運", "title": "把ECB追到後來：已全數轉換，賣單期間仍逐日核對", "detail": "7月1日晚間，長榮在新加坡交易所公告，經此前提前贖回安排後，這批ECB已全數轉換，7月1日已無流通在外餘額，並將從SGX下市。這是後來核到的公司資料，放回它實際公布的日期。它讓11月的假說得到一個明確後續狀態：潛在轉股量有上限，而這批債券到7月1日已完成轉換。公司債轉為股權後，原債務減少、股份增加，所以估每股獲利時也要更新股數。要評估作者的一至兩個月估計，仍須回到11月至翌年1月的逐日賣出與還券。原因是持有人可能早先借券賣出，轉股後只是交股還券；另一名持有人則可能轉股後才賣。公告核的是債券當時已全轉，市場供給何時發生， 核對robertshih的PTT Stock發文索引13篇、推文索引12筆、本人部落格兩篇年度回顧，以及本文引用的三份研究簡報。", "direct_evergreen_posts": 4, "later_investment_reviews": 4, "rumor_clarification": 1, "other_topics": 4, "indexes": ["https://www.pttweb.cc/user/robertshih/stock?t=article", "https://www.pttweb.cc/user/robertshih/stock?page=1&t=article"], "note": "以本次可取得的公開索引與文章逐項核對；作者私人帳戶交易與全網刪文另需原始紀錄。", "versions": [{"date": "2021-03-11", "detail": "Disp副本列年末淨值21.9、PB1.28；現行PTTweb列24.9、PB1.13。主文採兩版共有的運價與EPS14.5情境。", "urls": ["https://disp.cc/b/Stock/dj8k", "https://www.pttweb.cc/bbs/Stock/M.1615473670.A.C95"]}]}, "author_inventory": [{"date": "2020年11月17日：作者的ECB推論，連回9月發行條款", "title": "作者為何判斷ECB賣壓壓住股價，又怎麼估消化時間？", "summary": "作者觀察長榮近兩個月借券賣出餘額增加，推測主要是持有ECB的外資做動態套利。他文中採21元股價，和18.2元轉換價相差2.8元，讓債券換股權與股票市價之間的關係值得研究；持有人可以一邊保留換股權，一邊在股票市場安排價差與避險部位。", "author": "robertshih（投資判斷）；長榮發行條款、證交所借券教材（機制核對）", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384", "https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546", "https://wwwc.twse.com.tw/zh/products/sbl/download/edu-info16.pdf"], "story_index": 5}, {"date": "2020年12月7日：同一篇文章的推論接續", "title": "換約多逾2元EPS，原文究竟給了哪些計算依據", "summary": "作者下一步盯住美國線舊長約。舊約每大箱一千多美元，當時現貨美東4,700、美西3,947美元；他的想法是，同一批原先按低價承運的貨，等到重簽後提高單價，可以在原有運輸量上增加收入。若增加的成本較小，這段價差就有機會留下成利潤。", "author": "robertshih原文、宏遠研究與編者核算，分別歸屬", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "story_index": 8}, {"date": "2020年12月7日：同一篇文章的推論接續", "title": "從全年6元，怎麼走到淨值25至26、目標37.5至39元", "summary": "作者把2021全年獲利抓6元以上，理由是現有運價先支撐獲利，長約重簽再提供增量。他給的是全年預估下限，接著把這筆未來獲利放進淨值，推算股價可能還有多少空間。", "author": "robertshih原文、宏遠研究與編者核算，分別歸屬", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "story_index": 9}, {"date": "2020年12月7日：同一篇文章的推論接續", "title": "獲利與估值上修後，他為何繼續加碼", "summary": "ECB假說也有後續：他再引借券相關截圖，文中稱借券費率達10%，仍把股價受到壓抑連到持債機構的避險賣單。這記錄了他持續檢查同一解釋；費率與餘額提供交易活動線索，交易者身分則另由部位資料核。", "author": "robertshih原文、宏遠研究與編者核算，分別歸屬", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"], "story_index": 10}, {"date": "2020年11月23日資料截點／12月7日公開上傳與引用", "title": "宏遠林奕頎怎麼拆：同樣運價上漲，先看公司跑哪條線", "author": "多方資料，見各來源署名", "summary": "作者12月7日引用宏遠研究員林奕頎的報告，提供較細的公司拆解。研究先對照第二季SCFI895、EPS0.66與第三季1182、EPS1.70；截至11月23日，第四季指數均值已到1568、當日1938，於是上修下一季的獲利情境。", "urls": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"], "story_index": 11}, {"story_index": 12, "date": "2020年12月7日分享：宏遠第16–23頁，資料截至11月23日", "title": "為何相信需求還在：看出口、庫存與商品消費是否一起改善", "summary": "林奕頎先用需求資料驗證漲價。他看到美國製造業指數6月、歐元區7月回到50以上，製造活動由收縮轉向擴張；再列亞洲9月輸美貨櫃量年增14.5%、中國輸美年增19.6%。產業調查與實際出貨量同方向，讓運價上漲有了貨物流動的支持。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"story_index": 13, "date": "2020年12月7日分享：宏遠第24–32頁", "title": "為何供給跟不上：新船要等，長榮卻已有船排在交付名單", "summary": "運價提高會吸引更多供給，研究員於是接著查新船。他列2020年7月全球待交船約221萬TEU，占現有運力9.4%；10月約降到8%。這批待交船還要分好幾年交付，能立刻增加的運力有限。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"story_index": 14, "date": "2020年12月7日分享：宏遠第33–38頁", "title": "缺的是周轉能力：為何加快空櫃回亞洲，可能比收回程運費划算", "summary": "研究員把缺櫃拆成生產和使用兩端。新櫃製造受先前產能縮減與防疫限制影響；使用中的貨櫃又卡在港口、卡車和倉庫。貨櫃沒有回到亞洲裝貨，即使公司帳上仍有這個櫃，也暫時接不了下一趟出口。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"story_index": 15, "date": "2020年12月7日分享：宏遠第39–44頁的2010年比較", "title": "他怎麼區分淡季回落與趨勢反轉：回頭看2010年的先後順序", "summary": "研究員想處理另一個會動搖持有的問題：運價從高點回落，是否就該預期股價見頂？他翻2010年，發現7月8日至12月30日，SCFI從1,583降到1,083，約跌32%；同段長榮股價從22.9到30.8元，約漲34%。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-bao-gao-hong-yuan"]}, {"date": "2020年12月8日10:42：nixt的業內訪談與換約判斷", "title": "nixt怎麼查：問三家航商，發現客戶先搶櫃、附加費也在漲", "author": "多方資料，見各來源署名", "summary": "12月8日上午，nixt沿著同一波運價上漲，去問分別任職三家大型航商的朋友。他問的是，現在運費是否真的漲得很兇，想用第一線接單情況核對報價指數。", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1607395376.A.5B4"], "story_index": 16}, {"story_index": 17, "date": "2020年12月8日18:31；21:29與21:57當晚補充", "title": "nic0911補另一條理由：農曆年前先備貨，再用明年淨值驗算估值", "summary": "同一天傍晚，nic0911把需求時間再往前拆。他看到中國PMI和出口維持高檔，又考慮次年農曆年在2月中旬；如果工廠年後復工有不確定性，出口商和海外買家可能提前在年前備貨，讓貨物流量提早集中。", "author": "見各段署名與來源", "urls": ["https://www.pttweb.cc/bbs/Stock/M.1607423495.A.7D5"]}, {"date": "2020年12月11日報告／12月14日上傳、由作者引用", "title": "宏遠的新估算：把營收落差、換約與稀釋逐項算進去", "author": "多方資料，見各來源署名", "summary": "林奕頎12月11日報告、12月14日由作者上傳引用，先面對11月營收年增22%、月減約3%的落差。他把塞港、截航時間和運價反映到收入超過一個月的延遲放進解釋，預期12月及翌年1月再創高，留下兩個後續能核對的月份。", "urls": ["https://speakerdeck.com/robertshih/14"], "story_index": 21}, {"date": "2020年12月16日：Sea-Intelligence當期研究", "title": "Alan Murphy追空櫃：短缺要怎麼解除，才是延續多久的關鍵", "author": "多方資料，見各來源署名", "summary": "12月16日，Sea-Intelligence執行長Alan Murphy把空櫃短缺拆成四種處理情境：沿用原方式、加速調回空櫃、增加新櫃，以及調回與新櫃一起做。他想回答的問題，是造成高運價的供給瓶頸要多久才能改善。", "urls": ["https://sea-intelligence.com/press-room/37-empty-container-shortages-in-asia-to-persist-into-january"], "story_index": 22}, {"date": "2020年12月23日分享：作者稱為宏遠12月21日報告", "title": "同一天的另一份研究：先假設運價腰斬，再算獲利還剩多少", "author": "多方資料，見各來源署名", "summary": "12月23日，robertshih分享一份12頁研究，文中稱為宏遠12月21日的新報告。簡報列12月18日SCFI2,412、第四季均值約1,759，對照第三季1,182與EPS1.7元，再主動把明年運價往下壓，檢查較差情境下還能賺多少。", "urls": ["https://speakerdeck.com/robertshih/2603-1223-report"], "story_index": 24}, {"story_index": 25, "date": "2020年12月23日分享：研究第4–5頁", "title": "另一份ECB判斷：股份增加多少，獲利要多賺多少才跟得上", "summary": "這份研究把ECB問題分成股票供給和每股獲利。作者11月關注的是套利賣單壓價；12月研究進一步問，轉股後股份增加，是否會把營運成長吃掉。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-1223-report"]}, {"story_index": 26, "date": "2020年12月23日分享：研究第6–9頁", "title": "利空消息怎麼查：聖誕節、英國脫歐、表面運價停漲，各拆哪一段", "summary": "研究先處理聖誕節後需求可能轉弱的說法。它由到貨時間倒推：海運超過一個月，還有陸運、倉儲和上架，聖誕銷售的商品通常得較早離開亞洲。研究因此認為，12月仍在上漲的歐洲線，需要另外追補庫存和供給瓶頸，才能解釋眼前的價格。", "author": "見各段署名與來源", "urls": ["https://speakerdeck.com/robertshih/2603-1223-report"]}, {"story_index": 27, "date": "2020年12月23日分享：研究第1–2、10–12頁", "title": "接下來看什麼：輪流漲價、營收落後一個月，以及運價年增", "summary": "報告還把不同航線放在一起追。12月18日綜合指數漲4.3%，東南亞線漲12.7%；研究 轉盈。當時貨量與運價回升，燃油成本又較低，收入與成本兩邊都在改善。這讓接下來幾季的獲利有了想像空間，也帶出第一個問題：這些好條件能持續多久？", "接著，零售商補庫存，港口缺工、缺櫃又拖慢運輸周轉。貨主想運的貨增加，能及時提供的運輸服務卻跟得較慢，航商因而有機會提高報價。10月底的新聞已出現新一波加價訊息，於是研究可以繼續往下追：漲價何時會進入長榮的營收，又能留下多少利潤？", "到了11月，作者開始公開把已公布的獲利、眼前運價與當時股價放在一起比較。下面就按事情發生的順序，摘要他看見什麼、因此想到什麼，以及接著採取的查證與操作。"], "flow_heading": "他接著怎麼想、怎麼做？", "flow_intro": "一筆新資料帶出下一個問題；問題查清楚之後，他才更新獲利估計、估值或持有部位。", "steps": [{"title": "11月17日｜看到獲利與運價一起改善，先估下一季", "text": "他看到第三季EPS已達1.7元，10月營收又創當年新高，而眼前運價仍在上漲。因此他推想：第三季在較早的運價下已能賺1.7元，第四季若維持貨量、成本與合約條件，就有機會維持這個水準。\n\n他把前三季2.27元，加上預估第四季1.7元，算出全年約4元，再拿這個估計和股價比較。", "story_key": "original-03"}, {"title": "11月17日｜長榮較便宜，他接著找價差的原因", "text": "按他的獲利估計，21元的長榮比陽明、萬海的價格倍數低。他又看到借券賣出餘額增加，推測持有ECB的機構可能先借券賣股，之後再轉股還券，使股價暫時承受賣壓。\n\n他估這批賣單有機會在一至兩個月消化，因而把持有理由接成兩條線：運價與換約有望提高獲利，暫時性的賣單則可能讓股價還沒跟上。", "story_key": "original-04"}, {"title": "12月7日｜新報價更高，於是上修獲利並加碼", "text": "運價繼續高於他11月估算時的水準，他便把第四季EPS由1.7元提高到2.5至3元。他也比較美國線低價舊長約與眼前報價，研究隔年換約還能增加多少收入。\n\n較高的獲利估計，也提高了他對淨值與合理股價的估算。他認為當時價格仍有空間，因此繼續加碼。", "story_key": "original-06"}, {"title": "12月14日｜運價漲、營收卻減，他打電話問公司", "text": "11月營收月減約3%，和他原先「運價漲，營收也應增加」的想法對不上，他於是去電長榮。依他的記載，公司回覆的主要原因是11月美國線回程比例較高，而回程運價與載貨率較低。\n\n他再查航線占比和ShipmentLink船期，理解跨月航程與去回程組合如何造成營收大小月。因此，他把疑問改成具體預測：12月若偏向高價去程，營收就可能補回，並決定繼續持有。", "story_key": "original-07"}, {"title": "12月至1月｜先依目標減碼，再因新數字買回", "text": "12月21日，部位獲利達到他的個人年度目標，他先賣出一部分、收回原投入金額。隨後陽明公布11月單月EPS0.92元，讓他看到高運價已轉成同業的實際利潤；依後來回述與新聞日期對照，他約在12月25日買回部分長榮股期。\n\n2021年1月8日，長榮公布12月營收月增24.77%。營收回升，支持了他先前提出的回補方向，也讓研究接著進入追蹤下一期收入與利潤的階段。", "story_key": "original-10"}, {"title": "2021年至2022年｜條件改變，估計與部位也跟著改", "text": "3月，他在運價回落後重算全年獲利，認為陽明的價格更有吸引力，資金重心因而轉向陽明。5月運價比原估強，他再上修陽明的獲利情境；到了下半年，行情轉冷，他調降整體部位。\n\n接著到2022年，運價與後續財報呈現的變化，又讓前面支撐高獲利的條件逐漸改變。報告沿著這些發展，把營運、估值與部位的變化接到這一輪景氣的後段。", "story_key": "march-update"}], "takeaway": "整篇故事就沿著這條線往前走：運價變化帶出獲利估計，價格比較形成持有理由，營收落差促使他查證，而新資料與個人的獲利目標，又推動下一次部位調整。", "links": [{"label": "從2020年夏天開始讀", "tab": "story", "story_key": "original-00"}, {"label": "看11月17日的完整推論", "tab": "story", "story_key": "original-03"}, {"label": "對照股價與主 -26", "short_date": "10/26", "title": "ONE調價消息", "type": "news", "story_index": 2, "detail": "當期新聞列ONE自11月1日起每大箱加收300美元，並提到補庫存、缺工、缺櫃與缺船。這些是追高運價能維持多久的線索。", "refs": ["https://www.cna.com.tw/news/afe/202010260132.aspx"], "date_label": "2020-10-26"}, {"id": "E03", "date": "2020-11-17", "price_date": "2020-11-17", "short_date": "11/17", "title": "作者提出估值", "type": "author", "story_index": 3, "detail": "22:09發文。作者把前三季EPS2.27元與假設第四季約1.7元接起來，估全年約4元；再比較長榮、陽明與萬海的獲利倍數，認為長榮相對便宜。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384"], "date_label": "2020-11-17"}, {"id": "E04", "date": "2020-12-07", "price_date": "2020-12-07", "short_date": "12/07", "title": "上修獲利與目標", "type": "author", "story_index": 7, "detail": "作者見SCFI升至2129，把第四季EPS改估2.5至3元，全年4.77至5.27元；次年淨值估25至26元，乘1.5倍，得到37.5至39元，並自述持續加碼。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D"], "date_label": "2020-12-07"}, {"id": "E05", "date": "2020-12-14", "price_date": "2020-12-14", "short_date": "12/14", "title": "問公司、查船期", "type": "author", "story_index": 19, "detail": "運價漲、11月營收卻月減約3%，作者因此致電公司、對照航線與船期。依他轉述，去回程比例和認列進度造成落差；他接著預測12月回補，決定續抱。", "refs": ["https://disp.cc/b/Stock/d1NA"], "date_label": "2020-12-14"}, {"id": "E06", "date": "2020-12-21", "price_date": "2020-12-21", "short_date": "12/21", "title": "作者部分減碼", "type": "author", "story_index": 23, "detail": "作者在12月23日文章回述，前天已賣出7650張，仍含股期約當4110張。原因是達到自己年度獲利目標，先收回成本，留下獲利部位參與後市。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1608735699.A.EE1"], "date_label": "2020-12-21操作；12/23本人回述"}, {"id": "E10", "date": "2020-12-25", "price_date": "2020-12-25", "short_date": "12/25", "title": "同業EPS後回補", "type": "author", "story_index": 28, "detail": "王憶紅12月25日報導，陽明在「昨日」公布11月自結：營收152.65億元、稅後獲利27.05億元、EPS0.92元，單月已超過前三季累計。這讓高運價的研究從報價與營收，往實際利潤多走了一步。作者在1月3日年度回顧回述，自己在陽明公布0.92元的隔天，追回約當1,700張長榮股期。把新聞的昨日定位為12月24日，再接隔天，回補日因此記為12月25日的交叉對時推定。他的行動依據可沿時間接起來：剛依個人目標減碼，隨後同業公布比先前累計更強的單月獲利，便重新估量長榮在共同運價環境下可能留下的利潤，再買回部分部位。作者的回述直接交代了新數字與回補的先後關係。跨公司推估仍要比較各自航線、長約、成本與股數。這組資料支持重新檢查長榮的未來獲利，實際成交價格則另由交易明細回答。之後1月公布長榮12月收入，會繼續檢查新估計的營運方向。", "refs": ["https://ec.ltn.com.tw/article/paper/1421281", "https://www.pttweb.cc/bbs/Stock/M.1609611680.A.094"], "date_label": "2020-12-25回補日依1/3自述與當期新聞對時推定"}, {"id": "E07", "date": "2021-01-08", "price_date": "2021-01-08", "short_date": "01/08", "title": "12月營收回補", "type": "operation", "story_index": 32, "detail": "1月11日中央社回述，長榮於前一週五公布12月營收245.8億元、月增24.77%。這支持作者12月14日預測的回補方向；航次和報價各占多少，還要看細項。", "refs": ["https://www.cna.com.tw/news/afe/202101110233.aspx"], "date_label": "2021-01-08公告；1/11新聞回述"}, {"id": "E11", "date": "2021-03-11", "price_date": "2021-03-11", "short_date": "03/11", "title": "重算回落情境、仍持890張", "type": "author", "story_index": 35, "detail": "3月11日，作者轉以陽明研究同一波航運景氣。SCFI由2875回到2721，他先承認淡季回落，再引用台驊董事長顏益財訪談，檢查供需是否有足以延續高價的變化。研究的問題因此改成：即使後面報價下降，全年還能賺多少？他先比陽明11、12月營收約152.7、168.7億元，稅後利潤約27.05、50億元。收入多約16億元，利潤卻多約23億元，他由此假設新增收入多來自漲價，新增成本相對有限，嘗試由月營收增量推月獲利。這個月差還可能含業外與稅負變化，後面要拿實際財報比。按作者模型，1月較12月增收35.8億元，假設新增收入大致轉成稅前利潤，再扣20%稅，剩28.64億元。用約32.6億股攤算，每股增加0.879元，四捨五入約0.88元；加12月1.64元，得1月預估2.52元。2月同法由增收39.6億推稅後增加31.68億，每股增加約0.972元，得2.61元。32.6億股是編者依兩筆估算反推的近似分母，原文沒有另列股數。接著他先把第一季抓約7元，再把後面運價往下壓：第二季約1900，第三季1800至1900，接近原文列的2020第四季均值1974；他就借用當時第四季估計EPS約3元，給第二、三季各3元。第四季再讓指數降到1300至1400，估EPS1.5元，全年加總14.5元。季度EPS採歷史對照和作者情境判斷，原文未建立固定的SCFI與EPS換算公式。他再拿14.5元與28.1元股價相比，得到約1.94倍本益比。原文另估年底淨值24.9元，以28.1除下去約1.13倍。這使讀者能分清：每季能賺多少是營運假設，市場願意付幾倍是另一層估值判斷。同文列長榮890張、陽明約當17,155張。這使長榮部位紀錄至少延續到3月11日，也看出他把資金重心轉向自認較便宜的同業。到5月文章，再用自結利潤與運價新走勢檢查3月的估算精度。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1615473670.A.C95"], "date_label": "2021-03-11"}, {"id": "E12", "date": "2021-05-06", "price_date": "2021-05-06", "short_date": "05/06", "title": "運價超預期，再上修", "type": "author", "story_index": 36, "detail": "5月6日，作者回頭檢查3月情境，發現淡季降價幅度較小、止跌回升較快，SCFI已到3100。他列1至4月均值2871、2840、2627、2829，顯示原先預想第二季明顯降價的環境已有變化，未來季度的輸入要重設。他又列陽明1月自結EPS2.32元、3月2.43元，判斷第一季約7元的方向大致成立。對照3月曾估1月2.52元，單月估計高了0.20元。這一項落差回查成本、業外與稅；後續運價比原估強，則另用來改第二季之後的獲利。他把全年分成三條路徑：悲觀情境讓第二、三季指數在2600至2900，第四季降到1300至1400，全年EPS22至23.5；中立27至29；樂觀30至33.5。下表逐季保留，方便下一期資料出現時，辨認原先走的是哪一條。再處理模型外的增減項。原文估陽明換約後完整一年可增加3.5至4.5元EPS，5月生效、約6月起反映營收。若全年效果按月份平均攤，2021的6至12月占7/12，算出2.04至2.63元，對上作者列的約2至2.6元。全年與本年使用不同期間，差別就在這7個月。作者另估燃油成本比去年增加約1.5元EPS，並預留油價繼續上漲的空間，所以簡化為長約收益和燃油增支互抵。若只扣已列1.5元，長約還剩約0.54至1.13元；他把這個餘額也留給額外成本風險。這就是三條全年情境沒有再加上全部換約收益的理由。稅與股數再各算一次。原文預想過往虧損的扣抵可能把獲利提高10%至20%，現金增資使股數增加約9%、單股獲利稀釋約8.3%。若兩項同時成立，原EPS乘1.10至1.20再除1.09，結果約比原估高0.9%至10.1%；若獲利總額維持原估，只有股數增加，EPS則成為原來約91.7%。稅的改善幅度採作者情境，實際財報仍要核所得稅費用與遞延稅資產。", "refs": ["https://www.pttweb.cc/bbs/Stock/M.1620310876.A.BAF"], "date_label": "2021-05-06"}, {"id": "E14", "date": "2021-07-01", "price_date": "2021-07-01", "short_date": "07/01", "title": "公司公告ECB已全轉", "type": "operation", "story_index": 42, "detail": "18:57:40收盤後，長榮透過SGX公告這批ECB已全數轉換，當日無流通在外餘額。這核對債券的最終狀態；先前借券賣出、轉股和還券仍各按自己的日期追。", "refs": ["https://links.sgx.com/FileOpen/Evergreen%20Marine%20ECB%20offering%20-%20Final%20OM.ashx?App=Prospectus&FileID=46546", "https://wwwc.twse.com.tw/zh/products/sbl/download/edu-info16.pdf", "https://links.sgx.com/1.0.0/corporate-announcements/90JS5329MGPV2XYG/93849ad870c9107c36d456f7fa8eb8420bdb2d84d6f30d0a2da96da7cdda47a6"], "date_label": "2021-07-0118:57:40收盤後公告"}, {"id": "E08", "date": "2021-07-06", "price_date": "2021-07-06", "short_date": "07/06", "title": "行情收盤高點", "type": "market", "story_index": 43, "detail": "保存的2020至2022年日價中，這天是還原收盤高點，當日實際收盤224元。作者已公開的部分減碼在前一年12月，兩個時間點各自標在圖上。", "refs": [], "date_label": "2021-07-06"}, {"id": "E13", "date": "2022-01-02", "price_date": "2021-12-30", "short_date": "01/02", "title": "回顧下半年降低部位", "type": "author", "story_index": 44, "detail": "2022年1月2日，作者年度回顧說，2021下半年行情轉冷後，調整整體部位與交易頻率，年底以輕部位等待下一個機會。他也停止部分容量小、預期收益較弱或需高度專注的策略。這段決策從單一公司的估值，轉到整體資金與時間如何分配。當剩餘價格空間、交易機會與可投入心力改變，即使某門生意仍賺錢，也可能降低整體曝險，保留資金等下一個條件較好的機會。這是他年度回顧實際交代的調整方向。他列全年已實現獲利約45億元，範圍含多帳戶、多策略及陽明波段，按其披露範圍保存。長榮最後一筆賣出日期、價格與數量，仍需要本人直接交代交易的材料；現有長榮明確部位至少接到3月11日，後續接的是整體部位下降。", "refs": ["https://et220870.blogspot.com/2022/01/2021.html", "https://www.pttweb.cc/bbs/Stock/M.1641139199.A.461"], "date_label": "2022-01-02年報發表；回顧2021下半年整體部位"}, {"id": "E09", "date": "2022-11-01", "price_date": "2022-11-01", "short_date": "11/01", "title": "後續回撤低點", "type": "market", "story_index": 47, "detail": "保存窗口內，從2021年7月6日高點到這天，還原收盤最大回撤為68.15%。這個位置接上前面的上漲與加速，讓整段市場週期看得更完整。", "refs": [], "date_label": "2022-11-01"}]}, "author_accounts": [{"source_url": "https://www.pttweb.cc/bbs/Stock/M.1605622166.A.384", "author": "robertshih（論壇作者；本輪取得公開全文副本）", "published": "2020-11-17 22:09；副本顯示22:11:30編輯", "source_title": "〈長榮海2603史狀拜（附對帳單）〉", "statement": "robertshih先把運價上升、Q3每股賺1.7元、前三季2.27元及10月營收年內新高並排。他假設Q4先與Q3持平，因此全年每股可賺逾4元；用股價21元估本益比5.2倍、淨值比1.26倍，再與陽明及萬海比較，認為長榮獲利較佳而估值較低。他另提出可轉債套利賣壓可能壓住評價，並預期舊長約到期換新約後獲利改善。進退場段要求持續追運價；他的樂觀判斷以運價維持為條件，若報價明顯轉弱就重評持有。估價也隨原假設持續追蹤。", "implication": "他把候選推成投資論點的橋梁，是獲利外推、同業估值差及可改善的壓抑因素；各橋梁都有後續需核的資料。", "locator": "originals/U33.html，main正文「3.分析/正文」及「4.進退場機制」；完整現行副本可讀，首發內容的歷史版本仍待封存。"}, {"source_url": "https://www.pttweb.cc/bbs/Stock/M.1607348742.A.E1D", "author": "robertshih（論壇作者；本輪取得公開全文副本）", "published": "2020-12-07 21:45（副本頁示）", "source_title": "〈Re:長榮海2603史狀拜〉2020年12月7日更新", "statement": "這次更新中，robertshih引用宏遠報告，把Q2平均SCFI895與長榮EPS0.66元、Q3指數1182與EPS1.7元並排；接著以當時指數2129、Q4全季平均估至少1700，推測Q4可賺2.5至3元，高於先前持平假設。他又比較舊美國線長約每大箱一千多美元與當時東西岸報價，估明年換約可增加每股獲利。他將2021年EPS預估提高至6元以上，年底淨值估25至26元，再取淨值比1.5倍得到37.5至39元，並自述持續加碼。美歐航線仍強與舊約換約的預期，是他提高估值、維持部位的主要理由。", "implication": "這筆資料能直接看出他改了哪些輸入：報價、季度EPS、換約與淨值；數字是當日預估，後續實績另行核對。", "locator": "originals/U34.html，main正文開頭SCFI/EPS對照，及「2021還有美國線換約效應」「抓1.5倍PB」段。"}, {"source_url": "https://disp.cc/b/Stock/d1NA", "author": "robertshih（發文者）；長榮發言人（由作者轉述回電）", "published": "2020-12-14 20:31:49；轉寄頁更新20:57:30", "source_title": "〈Re:長榮海2603史狀拜〉2020年12月14日營收追蹤", "statement": "robertshih看到運價漲、11月營收卻月減約百分之三，於是自述致電長榮詢問。他轉述發言人說明，收入依航程進度逐日認列，塞港、延遲及少一個營業日有影響，主要還有美國線去回程船次大小月。作者列美西單程約二十至二十五天、美東三十五至四十天，並連到船期表；去程運費與載貨率較好，回程較弱，所以船次組合會使月度收入起伏。他再自行推測十二月可能回補，明示這是個人預測；同時自述部位續抱與部分期貨轉月。", "implication": "他從一個反常數字出發，查航程與收入認列，再形成可被12月實績檢查的新預測；公司回覆與本人外推在原文明確分層。", "locator": "originals/U30.html，正文「我於是去電」「發言人有回電」「個人猜測」及部位段；電話內容屬作者轉述，副本已存。"}, {"source_url": "https://www.pttweb.cc/bbs/Stock/M.1608735699.A.EE1", "author": "robertshih（論壇作者；本輪取得現行全文副本）", "published": "2020-12-23 23:01；回述前天部分減碼", "source_title": "〈Re:長榮海2603營收追蹤〉減碼與續抱理由", "statement": "robertshih在十二月二十三日回應市場討論，自述前天已部分落袋七千六百五十張，發文時仍含股票期貨持有約當四千一百一十張。他說減碼的直接原因是股價已讓自己的年度獲利目標達成，因此先收回進場時的市值成本，保留獲利部位繼續參與。他仍傾向相信行情在山腰，並參考其他熱門景氣股的市場倍數，但對最終高點保留開放判斷。留下較小部位的理由，是後續更能承受震盪；進出條件則交由各人依風格、風險與週期設定。", "implication": "退出動機可以來自個人資金與耐震需求，即使營運看法仍正面；學習時把企業論點、估值與部位管理分開追。", "locator": "originals/U39.html，main正文「部分落袋了7650張」「年度獲利目標達到了」「留下純獲利」；為本人公開自述，完整成交紀錄另待鑑識。"}], "guide_figures": [{"id": "profit-chain", "title": "11月17日：從數字找到持有理由", "alt": "作者看到第三季EPS1.7元與10月營收新高，對照上漲運價估下一季，再比較21元股價與同業倍數，接著由借券增加推測ECB暫時賣壓。", "kind": "original_explanatory_diagram", "desktop": {"path": "images/guide_profit-chain_desktop.svg", "sha256": "1976381138118d3bdcdfcac37a6b219f622ea42b9a38135d61580af3511c79a8", "width": 960, "height": 210, "data_url": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NjAiIGhlaWdodD0iMjEwIiB2aWV3Qm94PSIwIDAgOTYwIDIxMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPg0KPHRpdGxlIGlkPSJ0aXRsZSI+MTHmnIgxN+aXpe+8muW+nuaVuOWtl+aJvuWIsOaMgeacieeQhueUsTwvdGl0bGU+PGRlc2MgaWQ9ImRlc2MiPuS9nOiAheeci+WIsOesrOS4ieWto0VQUzEuN+WFg+iIhzEw5pyI54ef5pS25paw6auY77yM5bCN54Wn5LiK5ryy6YGL5YO55Lyw5LiL5LiA5a2j77yM5YaN5q+U6LyDMjHlhYPogqHlg7noiIflkIzmpa3lgI3mlbjvvIzmjqXokZfnlLHlgJ/liLjlop7liqDmjqjmuKxFQ0LmmqvmmYLos6Plo5PjgII8L2Rlc2M+DQo8c3R5bGU+dGV4dHtmb250LWZhbWlseToiTWljcm9zb2Z0IEpoZW5nSGVpIiwiUGluZ0ZhbmcgVEMiLHNhbnMtc2VyaWZ9PC9zdHlsZT4NCjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI2IiBtYXJrZXJIZWlnaHQ9IjYiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzc2OTRhNyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L21hcmtlcj48L2RlZnM+DQo8cmVjdCB3aWR0aD0iOTYwIiBoZWlnaHQ9IjIxMCIgcng9IjgiIGZpbGw9IiMxNDIyMmMiLz4NCjx <script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('report-data').textContent),C=D.case,$=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sm=new Map(D.sources.map(s=>[s.url,s]));const sid=new Map(D.sources.map(s=>[s.id,s]));const pct=v=>(v>=0?'+':'')+Number(v).toFixed(2)+'%';const link=u=>/^(https?:\/\/|originals\/|data\/|qa\/)/.test(u||'')?esc(u):'#';
function refs(urls,byline=false){return (urls||[]).map(u=>{let s=sm.get(u);return `${byline&&s?`<span class="source-byline">${esc(s.author||s.kind)} · ${esc(s.published)}</span>`:''}<a href="${link(u)}" target="_blank" rel="noopener">${esc(s?s.id+' '+s.title:'原站')} ↗</a>${s?.local_path?`<a href="${link(s.local_path)}" target="_blank" rel="noopener">${esc(s.id)} 原件</a>`:''}${s?.notes_path?`<a href="${link(s.notes_path)}" target="_blank" rel="noopener">${esc(s.id)} 整理與取得紀錄</a>`:''}`;}).join('');}
function proof(v){return `<article class="verification-record"><h3>${esc(v.step_title)}</h3><p><b>當時查了什麼、怎麼判斷：</b>${esc(v.historical_process)}</p><p><b>資料核對：</b>${esc(v.current_method)}</p><p><b>查到的內容：</b>${esc(v.observed_result)}</p><p><b>得到的論點：</b>${esc(v.judgment_update)}</p>${(v.evidence||[]).map(e=>{const s=sm.get(e.url),local=e.local_path||s?.local_path;return `<p class="evidence-locator"><b>${esc(e.source_id||s?.id||'來源')} 定位：</b>${esc(e.locator||'')} ${local?.endsWith('.pdf')?(e.pages||[]).map(n=>`<a href="${link(local)}#page=${Number(n)}" target="_blank" rel="noopener">PDF第${Number(n)}頁 ↗</a>`).join(' · '):''}</p>`;}).join('')}<div class="refs">${refs((v.evidence||[]).map(e=>e.url).filter(Boolean))}</div></article>`;}
function calculations(items,labels=[]){return (items||[]).map((c,i)=>`<aside class="calculation-card">${labels[i]?`<div class="calculation-origin">${esc(labels[i])}</div>`:''}<h4>${esc(c.title)}</h4><pre>${esc(c.formula)}</pre><p>${esc(c.meaning)}</p></aside>`).join('');}
function explainTable(t,kind='explanation-table'){if(!t)return '';const stack=t.columns.length<=4;return `<div class="${kind} ${stack?'stackable-table':''}" style="margin-top:20px"><h4 class="table-title">${esc(t.title)}</h4>${!stack?'<span class="table-hint">左右滑動表格，對照完整內容 →</span>':''}<div class="table-wrap"><table class="${t.columns[0]==='時間'?'date-comparison':''}" style="min-width:620px"><thead><tr>${t.columns.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((x,i)=>`<td data-label="${esc(t.columns[i])}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${t.refs?.length?`<div class="refs">${refs(t.refs)}</div>`:''}</div>`;}
function contextNotes(p,index){return (p.context_notes||[]).filter(n=>n.after_paragraph===index).map(n=>`<aside class="context-note"><h5>${esc(n.title)}</h5><p>${esc(n.text)}</p>${n.refs?.length?`<div class="refs">${refs(n.refs)}</div>`:''}</aside>`).join('');}
function storyBody(p){const prose=indices=>`<div class="story-prose">${indices.map(i=>`<p class="story-text">${esc(p.paragraphs[i])}</p>${contextNotes(p,i)}`).join('')}</div>`;let body;if(!p.reading_blocks)body=prose(p.paragraphs.map((_,i)=>i))+calculations(p.calculations,p.calculation_labels)+explainTable(p.table);else body='<div class="story-blocks">'+p.reading_blocks.map(b=>b.type==='heading'?`<h4 class="story-subheading">${esc(b.text)}</h4>`:b.type==='paragraphs'?prose(b.indices):b.type==='calculations'?calculations(b.indices.map(i=>p.calculations[i]),b.indices.map(i=>p.calculation_labels?.[i])):explainTable((p.tables||[p.table])[b.index])).join('')+'</div>';return body+explainTable(p.outcome,'outcome-check');}
$('report-revision-date').textContent=(C.revision_date||D.date).replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1年$2月$3日');
$('story-count').textContent=`${C.reading_chapters.length}章 · 6個階段 · ${C.revision_label}`;
$('story-count').insertAdjacentHTML('afterend',[['ecb-pressure','ECB賣壓與消化計算'],['contract-dec07','長約增加EPS的計算']].map(([key,title])=>`<a class="inference-shortcut" href="#story-${C.narrative.findIndex(p=>p.key===key)}">${esc(title)} ↓</a>`).join(''));
const beatPositions=new Map(C.narrative.map((p,i)=>[p.key,i]));
const readingChapters=C.reading_chapters;
const phases=[...new Set(readingChapters.map(ch=>ch.phase))];
const chapterStart=ch=>beatPositions.get(ch.keys[0]);
function renderBeat(key,chapterIndex,grouped){
 const i=beatPositions.get(key),p=C.narrative[i],tag=grouped?'h4':'h3';
 return `<section class="story-beat ${grouped?'story-part':''}" id="story-${i}" data-chapter="${chapterIndex}"><div class="story-date">${esc(p.date_context)}</div><${tag} class="${grouped?'story-part-title':''}">${grouped?'':String(chapterIndex+1).padStart(2,'0')+' · '}${esc(p.heading)}</${tag}>${storyBody(p)}<div class="story-footnotes">${refs(p.refs,true)}${!p.refs.length?'<a href="data/market_summary.json">保存的行情與計算底稿 ↗</a>':''}</div><details class="inline-proof"><summary>查閱這段的證據與核對結果</summary>${p.verification_steps.map(n=>proof(C.verifications[n-1])).join('')}</details></section>`;
}
$('story-toc').innerHTML='<h2>沿六個階段讀</h2>'+phases.map((phase,n)=>`<details class="toc-phase" ${n===0?'open':''}><summary><span>${String(n+1).padStart(2,'0')}</span>${esc(phase)}</summary>${readingChapters.map((ch,i)=>ch.phase===phase?`<a href="#story-${chapterStart(ch)}" data-reading-chapter="${i}"><time>${esc(ch.date_label)}</time>${esc(ch.title)}</a>`:'').join('')}</details>`).join('');
$('chapter-jump').innerHTML=phases.map(phase=>`<optgroup label="${esc(phase)}">${readingChapters.map((ch,i)=>ch.phase===phase?`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(ch.title)}</option>`:'').join('')}</optgroup>`).join('');
$('story-content').innerHTML='<h2>沿著事情的發展，看他如何改變判斷</h2><p class="story-intro">同一天的推論接成一章。作者、研究員與公司的不同說法，保留各自日期與出處；算式接在相關說明旁。</p>'+readingChapters.map((ch,i)=>`<section class="story-chapter" id="chapter-${i}" data-reading-index="${i}">${ch.keys.length>1?`<div class="chapter-date">${esc(ch.date_label)} · ${esc(ch.phase)}</div><h3 class="chapter-heading">${String(i+1).padStart(2,'0')} · ${esc(ch.title)}</h3>${ch.intro?`<p class="chapter-intro">${esc(ch.intro)}</p>`:''}`:''}${ch.keys.map(key=>renderBeat(key,i,ch.keys.length>1)).join('')}</section>`).join('');
function markChapter(index){
 $('chapter-jump').value=String(index);
 document.querySelectorAll('[data-reading-chapter]').forEach(a=>{const selected=Number(a.dataset.readingChapter)===index;if(selected){a.setAttribute('aria-current','location');a.closest('details').open=true;}else a.removeAttribute('aria-current');});
}
function jumpChapter(index){tab('story');markChapter(index);$('story-'+chapterStart(readingChapters[index])).scrollIntoView({block:'start',behavior:'instant'});}
$('chapter-jump').onchange=e=>jumpChapter(Number(e.target.value));
document.querySelectorAll('[data-reading-chapter]').forEach(a=>a.onclick=e=>{e.preventDefault();jumpChapter(Number(a.dataset.readingChapter));});
markChapter(0);
let chapterFrame=0;
window.addEventListener('scroll',()=>{if(chapterFrame||$('story-pane').hidden)return;chapterFrame=requestAnimationFrame(()=>{chapterFrame=0;const threshold=window.innerWidth<=650?125:160;let active=0;document.querySelectorAll('.story-chapter').forEach((el,i)=>{if(el.getBoundingClientRect().top<=threshold)active=i;});markChapter(active);});},{passive:true});


const G=C.guide;
function guideFigure(id){const meta=G.illustrations.find(f=>f.id===id),f=D.guide_figures.find(f=>f.id===id);return `<figure class="guide-figure" data-guide-figure="${esc(id)}"><figcaption><h4>${esc(meta.title)}</h4></figcaption><picture><source media="(max-width:650px)" srcset="${f.mobile.data_url}"><img src="${f.desktop.data_url}" width="${f.desktop.width}" height="${f.desktop.height}" alt="${esc(f.alt)}" decoding="sync"></picture><p>${esc(meta.caption)}</p><a href="#story-${beatPositions.get(meta.story_key)}" data-guide-story="${esc(meta.story_key)}">${esc(meta.link_label)} →</a></figure>`;}
$('guide-pane').innerHTML=`<header class="guide-header"><div class="eyebrow">順著當時的資料，看事情怎麼發展</div><h2>${esc(G.title)}</h2><p class="guide-lead">${esc(G.lead)}</p></header><section class="guide-summary"><h3>${esc(G.summary_heading)}</h3>${G.summary.map(p=>`<p>${esc(p)}</p>`).join('')}</section><section class="guide-process"><h3>${esc(G.flow_heading)}</h3><p class="guide-process-intro">${esc(G.flow_intro)}</p><ol>${G.steps.map((s,i)=>`<li><h4>${esc(s.title)}</h4>${s.text.split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('')}<a href="#story-${beatPositions.get(s.story_key)}" data-guide-story="${esc(s.story_key)}">看這段經過 →</a>${i===1?guideFigure('profit-chain'):i===3?guideFigure('verification-cycle'):''}</li>`).join('')}</ol></section><p class="guide-takeaway">${esc(G.takeaway)}</p><nav class="guide-links" aria-label="從導讀繼續閱讀">${G.links.map(s=>`<a href="${s.story_key?'#story-'+beatPositions.get(s.story_key):'#market-pane'}" ${s.story_key?`data-guide-story="${esc(s.story_key)}"`:`data-guide-tab="${esc(s.tab)}"`}>${esc(s.label)} →</a>`).join('')}</nav>`;
document.querySelectorAll('[data-guide-story]').forEach(a=>a.onclick=e=>{e.preventDefault();tab('story');const index=beatPositions.get(a.dataset.guideStory);requestAnimationFrame(()=>$('story-'+index).scrollIntoView({block:'start',behavior:'instant'}));});

 const placed=[]; function badgeY(px,py){for(const dy of [-28,-62,-96,-130,-164,-198,-232,38,72,106,140]){const by=Math.min(B-14,Math.max(T+14,py+dy));if(placed.every(p=>Math.abs(p[0]-px)>26||Math.abs(p[1]-by)>26)){placed.push([px,by]);return by;}}const by=T+16+(placed.length%9)*32;placed.push([px,by]);return by;}
 const markers=events.map((e,i)=>{const p=points[nearest(Date.parse(e.price_date||e.date))],px=x(e.price_date||e.date),py=y(p[2]),by=badgeY(px,py);return `<g class="price-event" data-chart-event="${e.id}" role="button" tabindex="0" aria-pressed="false" aria-label="${esc(e.date+' '+e.title)}" style="--event-color:${colors[e.type]}"><title>${esc(e.date+' '+e.title)}</title><line x1="${px}" x2="${px}" y1="${py}" y2="${by}" stroke="${colors[e.type]}" stroke-width="1" opacity=".8"/><circle cx="${px}" cy="${py}" r="4" fill="${colors[e.type]}"/><circle class="event-badge" cx="${px}" cy="${by}" r="11"/><text class="event-number" x="${px}" y="${by+4}" text-anchor="middle">${i+1}</text></g>`;}).join('');
 $('market-pane').innerHTML=`<h2>把股價和當時發生的事，放在同一條時間上看</h2><p class="pane-intro">滑鼠移入圖表，X軸顯示日期、Y軸顯示游標位置的還原價格；上方列出該日收盤價。點選事件可讀當時的判斷與驗證，手機可左右滑動與點按查詢。</p><figure class="price-figure"><figcaption><h3>長榮股價 × 關鍵轉折</h3><span class="small muted">2020年7月—2022年11月</span></figcaption><div class="price-readout" id="price-readout" aria-live="off"><div><small>對應交易日期</small><time id="price-date"></time></div><div><small>當日收盤價</small><strong id="price-raw"></strong></div><div><small>圖上還原收盤</small><strong id="price-adjusted"></strong></div></div><p class="price-selected-event" id="price-selected-event"></p><p class="price-nearby" id="price-nearby"></p><div class="price-scroll" id="price-scroll" tabindex="0" role="group" aria-label="可移動滑鼠、點按或用左右鍵查詢的股價時間軸"><svg id="price-chart" class="price-chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="price-chart-title"><title id="price-chart-title">長榮還原股價及${events.length}個主要事件，橫軸逐月標記</title><defs><linearGradient id="price-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#99d2ef" stop-opacity=".16"/><stop offset="1" stop-color="#99d2ef" stop-opacity="0"/></linearGradient></defs><text x="${L}" y="17" fill="#afbec8" font-size="11">還原收盤（元）</text>${grid}<path d="${path}L${x(points.at(-1)[0])},${B}L${x(points[0][0])},${B}Z" fill="url(#price-fill)"/><path id="price-line" d="${path}" fill="none" stroke="#99d2ef" stroke-width="2.2"/>${ticks}${markers}<g id="price-crosshair" pointer-events="none"><line id="price-crosshair-line" y1="${T}" y2="${B}" stroke="#eacb8c" stroke-width="1" stroke-dasharray="4 4"/><line id="price-crosshair-horizontal" x1="${L}" x2="${W-R}" stroke="#eacb8c" stroke-width="1" stroke-dasharray="4 4"/><circle id="price-crosshair-dot" r="4" fill="#eacb8c" stroke="#101820" stroke-width="2"/><g id="price-crosshair-date" aria-label="X軸查詢日期"><rect x="-46" y="-13" width="92" height="24" rx="3" fill="#eacb8c"/><text id="price-crosshair-date-text" class="chart-axis-label" y="4" text-anchor="middle"></text></g><g id="price-crosshair-value" aria-label="Y軸游標還原價格"><rect x="2" y="-12" width="${L-7}" height="24" rx="3" fill="#eacb8c"/><text id="price-crosshair-value-text" class="chart-axis-label" x="${L-12}" y="4" text-anchor="end"></text></g></g></svg></div><p class="price-chart-note">當日收盤價是當天市場的實際報價。圖上還原收盤調整除權息與資本變動，讓跨日期漲幅採同一條價格序列；兩個數字分別顯示在查詢列。</p><div class="price-event-type"><span style="--event-color:${colors.news}">公開消息</span><span style="--event-color:${colors.author}">作者判斷與交易</span><span style="--event-color:${colors.operation}">營運驗證</span><span style="--event-color:${colors.market}">行情轉折</span></div><div class="price-events" aria-label="圖上事件">${events.map((e,i)=>`<button class="price-event-chip" data-chart-event="${e.id}" aria-pressed="false" style="--event-color:${colors[e.type]}"><span class="event-chip-number">${String(i+1).padStart(2,'0')}</span>${esc(e.short_date)} ${esc(e.title)}</button>`).join('')}</div><section id="price-event-detail" class="price-event-detail" aria-live="polite"></section></figure>`;
 let current=0;

$('method-pane').innerHTML='<div class="methods"><h2>讀完之後，帶走這套思考順序</h2><p>先問「跟以前相比，哪個賺錢條件變了」，再追這個改變會怎麼進入收入、成本與利潤。長榮的例子裡，運價是入口，已公布EPS是基準，長約與航程解釋時間差；最後把未來獲利和當時價格放在一起比較。</p><h3>每次更新，都留下四件事</h3><p>哪個新數字出現、它和原先預期差在哪裡、作者查了什麼來解釋差異，以及查完後如何改變估計或部位。把這四件事按日期寫下來，之後就有材料核對自己的決策。</p><section class="exercise"><div class="eyebrow">用12月14日這個轉折練習</div><h3>運價上漲，營收卻月減。接著該做什麼？</h3><button data-answer="0">沿用原先目標價，等待營收恢復。</button><button data-answer="1">先查航線、航程與認列，再提出下一期能檢查的預測。</button><button data-answer="2">用當天股價漲跌決定營運好壞。</button><div id="exercise-feedback" class="feedback" hidden></div></section><h3>這個例子如何查原始證據</h3><p>作者文章說明他問了誰、查了什麼與怎麼決定；當期新聞和公司資料提供營運數字；後續月營收檢查回補預測；同期間價格則回答市場如何反映。每種資料各接在它能回答的問題旁，原件連結放在段落下方。</p><details><summary>教材編排參考</summary><p class="small">按完整示例、時間演變、就近證據與練習回饋編排。參考<a href="https://ies.ed.gov/ncee/wwc/PracticeGuide/1" target="_blank" rel="noopener">IES實務指引</a>、<a href="https://education.nsw.gov.au/about-us/education-data-and-research/cese/publications/practical-guides-for-educators/cognitive-load-theory-in-practice" target="_blank" rel="noopener">NSW教育部認知負荷指南</a>、<a href="https://www.cmu.edu/teaching/principles/learning.html" target="_blank" rel="noopener">CMU學習原則</a>與<a href="https://digital.gov/guides/plain-language/principles/organize" target="_blank" rel="noopener">Digital.gov資料組織指引</a>。</p></details></div>';
